# Managed by tooling/instance.mjs. Separate project, database and volume per instance.
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: animemo
      POSTGRES_DB: animemo
      POSTGRES_PASSWORD: ${ANIMEMO_DB_PASSWORD:?Missing instance password}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U animemo -d animemo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app: &app
    image: ${ANIMEMO_IMAGE:?Missing pinned application image}
    pull_policy: never
    environment:
      DATABASE_URL: postgres://animemo:${ANIMEMO_DB_PASSWORD}@db:5432/${ANIMEMO_DATABASE:?Missing database name}?sslmode=disable
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Missing public origin}
      ANIMEMO_SETUP_TOKEN: ${ANIMEMO_SETUP_TOKEN:?Missing setup token}
      ANIMEMO_SECRET_KEY: ${ANIMEMO_SECRET_KEY:?Missing encryption key}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      BANGUMI_OAUTH_CLIENT_ID: ${BANGUMI_OAUTH_CLIENT_ID:-}
      BANGUMI_OAUTH_CLIENT_SECRET: ${BANGUMI_OAUTH_CLIENT_SECRET:-}
      BANGUMI_OAUTH_REDIRECT_URI: ${BANGUMI_OAUTH_REDIRECT_URI:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      LISTEN_ADDR: 0.0.0.0:18081
      WEB_DIR: /app/web
      ANIMEMO_BUNDLED_DIR: /app/extensions
    ports:
      - target: 18081
        published: "${ANIMEMO_INSTANCE_PORT:?Missing instance port}"
        host_ip: "${ANIMEMO_INSTANCE_BIND:-127.0.0.1}"
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/animemo, healthcheck]
      interval: 2s
      timeout: 3s
      start_period: 3s
      retries: 15
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    profiles: [runtime-worker]
    <<: *app
    command: [worker]
    ports: []
    healthcheck:
      test: [CMD, /app/animemo, worker-health]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12
    depends_on:
      app:
        condition: service_healthy
volumes:
  data:
