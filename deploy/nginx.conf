geo $realip_remote_addr $anime_trusted_upstream {
    default 0;
    127.0.0.1/32 1;
    172.28.0.0/16 1;
}

map "$anime_trusted_upstream:$http_x_forwarded_proto" $anime_forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

# Keep the SPA entry point fresh while allowing content-hashed Vite assets to
# be cached for a year. API and media responses keep their upstream policy.
map $request_uri $anime_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(api|admin|health|static|plugin-assets|media|local-media)(/|$) "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # The Compose port is bound to loopback. Only these explicit upstreams may
    # replace the peer address with the XFF value written by OpenResty.
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xjQsrThiVsL5TEjVM6dTosT1AwZvcPBi17BPpLuouCM=' https://challenges.cloudflare.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.bgm.tv wss://re-anime.cc; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $anime_cache_control always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $anime_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $anime_forwarded_proto;
    }

    location = /health/ {
        proxy_pass http://api:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $anime_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $anime_forwarded_proto;
    }

    location ^~ /plugin-assets/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $anime_forwarded_proto;
    }

    location /media/ {
        alias /var/www/anime-data/media/;
        expires 7d;
    }

    location ^~ /local-media/ {
        alias /var/www/anime-data/media/;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
