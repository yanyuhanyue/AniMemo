services:
  postgres:
    image: ${ANIMEMO_POSTGRES_IMAGE:?ANIMEMO_POSTGRES_IMAGE is required}
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    networks: !override
      - upgrade-gate

  redis:
    image: ${ANIMEMO_REDIS_IMAGE:?ANIMEMO_REDIS_IMAGE is required}
    platform: linux/amd64
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    networks: !override
      - upgrade-gate

  api:
    container_name: ${COMPOSE_PROJECT_NAME}-api
    env_file: !override
      - ${STATEFUL_UPGRADE_ENV_FILE:?STATEFUL_UPGRADE_ENV_FILE is required}
    volumes: !override
      - ${ANIMEMO_DATA_ROOT:?ANIMEMO_DATA_ROOT is required}/plugins:/app/runtime/plugins
      - ${ANIMEMO_DATA_ROOT}/logs:/app/logs
      - ${ANIMEMO_DATA_ROOT}/backups:/app/backups
      - ${ANIMEMO_DATA_ROOT}/media:/data/animemo/media
      - ${ANIMEMO_DATA_ROOT}/private:/app/runtime/private
      - ${STATEFUL_UPGRADE_HELPER_ROOT:?STATEFUL_UPGRADE_HELPER_ROOT is required}/scripts:/app/ci-scripts:ro
      - ${STATEFUL_UPGRADE_META_ROOT:?STATEFUL_UPGRADE_META_ROOT is required}:/app/ci-meta
    networks: !override
      - upgrade-gate

  migration:
    container_name: ${COMPOSE_PROJECT_NAME}-migration
    image: ${ANIMEMO_API_IMAGE:-animemo-upgrade-api:current}
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file: !override
      - ${STATEFUL_UPGRADE_ENV_FILE:?STATEFUL_UPGRADE_ENV_FILE is required}
    volumes: !override
      - ${ANIMEMO_DATA_ROOT:?ANIMEMO_DATA_ROOT is required}/plugins:/app/runtime/plugins
      - ${ANIMEMO_DATA_ROOT}/logs:/app/logs
      - ${ANIMEMO_DATA_ROOT}/backups:/app/backups
      - ${ANIMEMO_DATA_ROOT}/media:/data/animemo/media
      - ${ANIMEMO_DATA_ROOT}/private:/app/runtime/private
      - ${STATEFUL_UPGRADE_HELPER_ROOT:?STATEFUL_UPGRADE_HELPER_ROOT is required}/scripts:/app/ci-scripts:ro
      - ${STATEFUL_UPGRADE_META_ROOT:?STATEFUL_UPGRADE_META_ROOT is required}:/app/ci-meta
    networks: !override
      - upgrade-gate

  bootstrap:
    container_name: ${COMPOSE_PROJECT_NAME}-bootstrap
    image: ${ANIMEMO_API_IMAGE:-animemo-upgrade-api:current}
    env_file: !override
      - ${STATEFUL_UPGRADE_ENV_FILE:?STATEFUL_UPGRADE_ENV_FILE is required}
    volumes: !override
      - ${ANIMEMO_DATA_ROOT:?ANIMEMO_DATA_ROOT is required}/plugins:/app/runtime/plugins
      - ${ANIMEMO_DATA_ROOT}/logs:/app/logs
      - ${ANIMEMO_DATA_ROOT}/backups:/app/backups
      - ${ANIMEMO_DATA_ROOT}/media:/data/animemo/media
      - ${ANIMEMO_DATA_ROOT}/private:/app/runtime/private
    networks: !override
      - upgrade-gate

  web:
    container_name: ${COMPOSE_PROJECT_NAME}-web
    networks: !override
      - upgrade-gate

networks:
  animemo: !reset null
  upgrade-gate:
    name: ${COMPOSE_PROJECT_NAME}-network
