map $http_x_animemo_perf_client $anime_perf_client_ip {
    default $remote_addr;
    ~^198\.18\.0\.(?:[1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9])$ $http_x_animemo_perf_client;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 27m;

    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xjQsrThiVsL5TEjVM6dTosT1AwZvcPBi17BPpLuouCM=' https://challenges.cloudflare.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.bgm.tv wss://re-anime.cc; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $anime_perf_client_ip;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $anime_perf_client_ip;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ {
        proxy_pass http://api:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /plugin-assets/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $anime_perf_client_ip;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /plugin-previews/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $anime_perf_client_ip;
        proxy_set_header X-Forwarded-For $anime_perf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/anime-data/media/;
        expires 7d;
    }

    location ^~ /local-media/ {
        alias /var/www/anime-data/media/;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
