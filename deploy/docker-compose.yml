x-api-common: &api-common
  image: ${ANIMEMO_API_IMAGE:?ANIMEMO_API_IMAGE must be an immutable ghcr.io/yanyuhanyue/animemo-api@sha256 digest}
  environment:
    TZ: Asia/Shanghai
  labels:
    cc.animemo.config-revision: ${ANIMEMO_CONFIG_REVISION:?ANIMEMO_CONFIG_REVISION is required}
  networks:
    - animemo
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: ${ANIMEMO_POSTGRES_IMAGE:?ANIMEMO_POSTGRES_IMAGE must be an immutable docker.io/library/postgres@sha256 digest}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    labels:
      cc.animemo.config-revision: ${ANIMEMO_CONFIG_REVISION:?ANIMEMO_CONFIG_REVISION is required}
    networks:
      - animemo
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: ${ANIMEMO_REDIS_IMAGE:?ANIMEMO_REDIS_IMAGE must be an immutable docker.io/library/redis@sha256 digest}
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    labels:
      cc.animemo.config-revision: ${ANIMEMO_CONFIG_REVISION:?ANIMEMO_CONFIG_REVISION is required}
    networks:
      - animemo
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  migration:
    <<: *api-common
    profiles: [release-jobs]
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  bootstrap:
    <<: *api-common
    profiles: [release-jobs]
    restart: "no"
    command: ["python", "manage.py", "bootstrap_animemo"]

  api:
    <<: *api-common
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client, json, os; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); connection=http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); connection.request('GET', '/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); response=connection.getresponse(); payload=json.loads(response.read()); assert response.status == 200 and payload.get('status') == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${ANIMEMO_WEB_IMAGE:?ANIMEMO_WEB_IMAGE must be an immutable ghcr.io/yanyuhanyue/animemo-web@sha256 digest}
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    ports:
      - target: 80
        published: ${ANIMEMO_LISTEN_PORT:?ANIMEMO_LISTEN_PORT is required}
        host_ip: ${ANIMEMO_LISTEN_HOST:?ANIMEMO_LISTEN_HOST is required}
        protocol: tcp
    labels:
      cc.animemo.config-revision: ${ANIMEMO_CONFIG_REVISION:?ANIMEMO_CONFIG_REVISION is required}
    networks:
      - animemo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  animemo:
