name: animemo

x-api-common: &api-common
  image: ${ANIMEMO_API_IMAGE:?ANIMEMO_API_IMAGE must be an immutable ghcr.io/yanyuhanyue/animemo-api@sha256 digest}
  env_file:
    - ../.env.production
  environment:
    TZ: Asia/Shanghai
  volumes:
    - ${ANIMEMO_DATA_ROOT:-/data/animemo}/plugins:/app/runtime/plugins
    - ${ANIMEMO_DATA_ROOT:-/data/animemo}/logs:/app/logs
    - ${ANIMEMO_DATA_ROOT:-/data/animemo}/backups:/app/backups
    - ${ANIMEMO_DATA_ROOT:-/data/animemo}/media:/data/animemo/media
    - ${ANIMEMO_DATA_ROOT:-/data/animemo}/private:/app/runtime/private
  networks:
    - animemo
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: animemo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-animemo}
      POSTGRES_USER: ${POSTGRES_USER:-animemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    volumes:
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/postgres:/var/lib/postgresql/data
    networks:
      - animemo
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-animemo} -d ${POSTGRES_DB:-animemo}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: animemo-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/redis:/data
    networks:
      - animemo
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  migration:
    <<: *api-common
    profiles: [release-jobs]
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  bootstrap:
    <<: *api-common
    profiles: [release-jobs]
    restart: "no"
    command: ["python", "manage.py", "bootstrap_animemo"]

  api:
    <<: *api-common
    container_name: animemo-api
    restart: unless-stopped
    volumes:
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/plugins:/app/runtime/plugins
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/logs:/app/logs
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/backups:/app/backups
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/media:/data/animemo/media
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/private:/app/runtime/private
      - /run/animemo-updater:/run/animemo-updater:rw
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client, json, os; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); connection=http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); connection.request('GET', '/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); response=connection.getresponse(); payload=json.loads(response.read()); assert response.status == 200 and payload.get('status') == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${ANIMEMO_WEB_IMAGE:?ANIMEMO_WEB_IMAGE must be an immutable ghcr.io/yanyuhanyue/animemo-web@sha256 digest}
    container_name: animemo-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANIMEMO_PORT:-8088}:80"
    volumes:
      - ${ANIMEMO_DATA_ROOT:-/data/animemo}/media:/var/www/animemo-data/media:ro
    networks:
      - animemo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  animemo:
    name: animemo
    ipam:
      config:
        - subnet: 172.28.0.0/16
