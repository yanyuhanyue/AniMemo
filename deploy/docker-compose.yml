name: anime-journal

services:
  postgres:
    image: postgres:16-alpine
    container_name: anime-journal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anime_journal}
      POSTGRES_USER: ${POSTGRES_USER:-anime_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    volumes:
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/postgres:/var/lib/postgresql/data
    networks:
      - anime-journal
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anime_journal} -d ${POSTGRES_DB:-anime_journal}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: anime-journal-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/redis:/data
    networks:
      - anime-journal
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    container_name: anime-journal-api
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env.production
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    volumes:
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/plugins:/app/runtime/plugins
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/logs:/app/logs
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/backups:/app/backups
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/media:/data/anime-journal/media
    networks:
      - anime-journal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "7"}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client, json, os; host=os.environ['ALLOWED_HOSTS'].split(',')[0].strip(); connection=http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); connection.request('GET', '/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}); response=connection.getresponse(); payload=json.loads(response.read()); assert response.status == 200 and payload.get('status') == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    container_name: anime-journal-web
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANIME_JOURNAL_PORT:-8088}:80"
    volumes:
      - ${ANIME_JOURNAL_DATA_ROOT:-/data/anime-journal}/media:/var/www/anime-data/media:ro
    networks:
      - anime-journal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  anime-journal:
    name: anime-journal
    ipam:
      config:
        - subnet: 172.28.0.0/16
