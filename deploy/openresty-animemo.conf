server {
    listen 80;
    listen [::]:80;
    server_name animemo.cc www.animemo.cc;

    access_log /www/sites/animemo.cc/log/access.log main;
    error_log /www/sites/animemo.cc/log/error.log;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://animemo.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.animemo.cc;

    ssl_certificate /www/sites/animemo.cc/letsencrypt/live/animemo.cc/fullchain.pem;
    ssl_certificate_key /www/sites/animemo.cc/letsencrypt/live/animemo.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:animemo_ssl:10m;
    ssl_session_timeout 10m;

    return 301 https://animemo.cc$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name animemo.cc;

    access_log /www/sites/animemo.cc/log/access.log main;
    error_log /www/sites/animemo.cc/log/error.log;

    ssl_certificate /www/sites/animemo.cc/letsencrypt/live/animemo.cc/fullchain.pem;
    ssl_certificate_key /www/sites/animemo.cc/letsencrypt/live/animemo.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:animemo_ssl:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xjQsrThiVsL5TEjVM6dTosT1AwZvcPBi17BPpLuouCM=' https://challenges.cloudflare.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.bgm.tv wss://animemo.cc; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /plugin-assets/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
