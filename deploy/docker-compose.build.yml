x-api-build: &api-build
  context: ..
  dockerfile: deploy/backend.Dockerfile

x-api-build-common: &api-build-common
  build: *api-build
  env_file:
    - ${ANIMEMO_TEST_MANAGED_ENV_PATH:-../.ci-runtime.env}
  environment:
    ANIMEMO_PUBLIC_ORIGIN: ${ANIMEMO_PUBLIC_ORIGIN:?ANIMEMO_PUBLIC_ORIGIN is required}
  volumes:
    - ${ANIMEMO_TEST_DATA_ROOT:?ANIMEMO_TEST_DATA_ROOT is required}/plugins:/app/runtime/plugins
    - ${ANIMEMO_TEST_DATA_ROOT}/logs:/app/logs
    - ${ANIMEMO_TEST_DATA_ROOT}/backups:/app/backups
    - ${ANIMEMO_TEST_DATA_ROOT}/media:/data/animemo/media
    - ${ANIMEMO_TEST_DATA_ROOT}/private:/app/runtime/private

services:
  postgres:
    volumes:
      - ${ANIMEMO_TEST_DATA_ROOT:?ANIMEMO_TEST_DATA_ROOT is required}/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - ${ANIMEMO_TEST_DATA_ROOT:?ANIMEMO_TEST_DATA_ROOT is required}/redis:/data

  migration:
    <<: *api-build-common

  bootstrap:
    <<: *api-build-common

  api:
    <<: *api-build-common
    volumes:
      - ${ANIMEMO_TEST_DATA_ROOT:?ANIMEMO_TEST_DATA_ROOT is required}/plugins:/app/runtime/plugins
      - ${ANIMEMO_TEST_DATA_ROOT}/logs:/app/logs
      - ${ANIMEMO_TEST_DATA_ROOT}/backups:/app/backups
      - ${ANIMEMO_TEST_DATA_ROOT}/media:/data/animemo/media
      - ${ANIMEMO_TEST_DATA_ROOT}/private:/app/runtime/private
      - /run/animemo-updater:/run/animemo-updater:rw

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    volumes:
      - ${ANIMEMO_TEST_DATA_ROOT:?ANIMEMO_TEST_DATA_ROOT is required}/media:/var/www/animemo-data/media:ro
