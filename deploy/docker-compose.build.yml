x-api-build: &api-build
  context: ..
  dockerfile: deploy/backend.Dockerfile

x-api-build-common: &api-build-common
  build: *api-build
  environment:
    ANIMEMO_PUBLIC_ORIGIN: ${ANIMEMO_PUBLIC_ORIGIN:-${FRONTEND_URL:-https://animemo.cc}}
  volumes:
    - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/plugins:/app/runtime/plugins
    - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/logs:/app/logs
    - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/backups:/app/backups
    - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/media:/data/animemo/media
    - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/private:/app/runtime/private

services:
  postgres:
    volumes:
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/redis:/data

  migration:
    <<: *api-build-common

  bootstrap:
    <<: *api-build-common

  api:
    <<: *api-build-common
    volumes:
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/plugins:/app/runtime/plugins
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/logs:/app/logs
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/backups:/app/backups
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/media:/data/animemo/media
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/private:/app/runtime/private
      - /run/animemo-updater:/run/animemo-updater:rw

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
    ports:
      - "127.0.0.1:${ANIMEMO_PORT:-${ANIME_JOURNAL_PORT:-8088}}:80"
    volumes:
      - ${ANIMEMO_DATA_ROOT:-${ANIME_JOURNAL_DATA_ROOT:-/data/animemo}}/media:/var/www/animemo-data/media:ro
