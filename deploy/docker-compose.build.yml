services:
  migration:
    build: &api-build
      context: ..
      dockerfile: deploy/backend.Dockerfile

  bootstrap:
    build: *api-build

  api:
    build: *api-build

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY is required}
