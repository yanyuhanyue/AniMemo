name: Promote RC to Stable

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Exact RC tag to promote (for example v1.0.0-rc.1)
        required: true
        type: string
      dry_run:
        description: Verify and prepare the promotion without changing tags, packages, releases, or attestations
        required: true
        default: true
        type: boolean

concurrency:
  group: animemo-release-producer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: verify-exact-rc-and-plan-stable
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    outputs:
      stable_tag: ${{ steps.identity.outputs.stable_tag }}
      rc_commit: ${{ steps.identity.outputs.rc_commit }}
      api_repository: ${{ steps.identity.outputs.api_repository }}
      api_digest: ${{ steps.identity.outputs.api_digest }}
      web_repository: ${{ steps.identity.outputs.web_repository }}
      web_digest: ${{ steps.identity.outputs.web_digest }}
      previous_stable: ${{ steps.identity.outputs.previous_stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: release/requirements.lock
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Download exact RC release contract
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc-assets promotion-output
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG" --jq '.draft')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG" --jq '.prerelease')" = "true"
          RC_PORTABLE_ASSET="animemo-$RC_TAG-portable.tar"
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --pattern deployment-contract.json \
            --pattern installer-materials.tar --pattern checksums.txt \
            --pattern "$RC_PORTABLE_ASSET" --dir rc-assets
          (cd rc-assets && sha256sum --check checksums.txt)
          python -m release.cli validate-manifest --manifest rc-assets/release-manifest.json
          python -m release.cli validate-deployment-contract \
            --contract rc-assets/deployment-contract.json \
            --installer-materials rc-assets/installer-materials.tar
      - name: Resolve the exact successful RC publication metadata artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="release-publication-metadata-$RC_TAG"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
            > "$RUNNER_TEMP/rc-publication-artifacts.json"
          count="$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            "$RUNNER_TEMP/rc-publication-artifacts.json")"
          test "$count" = "1"
          jq -c --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0]' \
            "$RUNNER_TEMP/rc-publication-artifacts.json" \
            > "$RUNNER_TEMP/rc-publication-artifact.json"
          run_id="$(jq -r '.workflow_run.id' "$RUNNER_TEMP/rc-publication-artifact.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$RUNNER_TEMP/rc-publication-run.json"
          test "$(jq -r '.path' "$RUNNER_TEMP/rc-publication-run.json")" = ".github/workflows/release.yml"
          test "$(jq -r '.name' "$RUNNER_TEMP/rc-publication-run.json")" = "Release Producer"
          test "$(jq -r '.event' "$RUNNER_TEMP/rc-publication-run.json")" = "workflow_dispatch"
          test "$(jq -r '.status' "$RUNNER_TEMP/rc-publication-run.json")" = "completed"
          test "$(jq -r '.conclusion' "$RUNNER_TEMP/rc-publication-run.json")" = "success"
          archive_url="$(jq -r '.archive_download_url' "$RUNNER_TEMP/rc-publication-artifact.json")"
          metadata_digest="$(jq -r '.digest' "$RUNNER_TEMP/rc-publication-artifact.json")"
          [[ "$metadata_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/rc-publication"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" "$archive_url" \
            -o "$RUNNER_TEMP/rc-publication.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/rc-publication.zip" | awk '{print $1}')" = "$metadata_digest"
          unzip -q "$RUNNER_TEMP/rc-publication.zip" -d "$RUNNER_TEMP/rc-publication"
          test -f "$RUNNER_TEMP/rc-publication/release-notes.json"
          test -f "$RUNNER_TEMP/rc-publication/release-notes.md"
          test "$(jq -r '.tag' "$RUNNER_TEMP/rc-publication/publication-plan.json")" = "$RC_TAG"
          test "$(jq -r '.status' "$RUNNER_TEMP/rc-publication/post-publish-verification.json")" = "PASS"
          python -m release.cli verify-declared-portable \
            --plan "$RUNNER_TEMP/rc-publication/publication-plan.json" \
            --payload "rc-assets/animemo-$RC_TAG-portable.tar"
      - name: Require a reviewed Git-tracked RC live acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          acceptance_path="release/acceptance-records/$RC_TAG.json"
          test -f "$acceptance_path"
          test "$(git ls-files --error-unmatch "$acceptance_path")" = "$acceptance_path"
          cp "$acceptance_path" "$RUNNER_TEMP/rc-live-acceptance.json"
          git fetch --force --tags origin main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG" \
            | jq '{id,tag_name,name,draft,prerelease,immutable}' \
            > "$RUNNER_TEMP/source-rc-presentation.json"
          python -m release.cli verify-stable-source-presentation \
            --acceptance "$RUNNER_TEMP/rc-live-acceptance.json" \
            --release "$RUNNER_TEMP/source-rc-presentation.json" \
            --repository .
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify RC tag, main ancestry, images, and producer provenance
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          test "$(jq -r '.release.version' rc-assets/release-manifest.json)" = "$RC_TAG"
          test "$(jq -r '.release.channel' rc-assets/release-manifest.json)" = "rc"
          rc_commit="$(jq -r '.release.commit' rc-assets/release-manifest.json)"
          test "$(git rev-list -n 1 "$RC_TAG")" = "$rc_commit"
          git merge-base --is-ancestor "$rc_commit" origin/main
          api_repository="$(jq -r '.images.api.repository' rc-assets/release-manifest.json)"
          api_digest="$(jq -r '.images.api.digest' rc-assets/release-manifest.json)"
          web_repository="$(jq -r '.images.web.repository' rc-assets/release-manifest.json)"
          web_digest="$(jq -r '.images.web.digest' rc-assets/release-manifest.json)"
          gh attestation verify "oci://$api_repository@$api_digest" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$rc_commit"
          gh attestation verify "oci://$web_repository@$web_digest" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$rc_commit"
          gh attestation verify rc-assets/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$rc_commit"
          gh attestation verify rc-assets/deployment-contract.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$rc_commit"
          gh attestation verify rc-assets/installer-materials.tar \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$rc_commit"
          cp --no-clobber rc-assets/deployment-contract.json promotion-output/deployment-contract.json
          cp --no-clobber rc-assets/installer-materials.tar promotion-output/installer-materials.tar
          git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
          stable_tag="${RC_TAG%-rc.*}"
          existing_stable_tag_commit=""
          if git show-ref --verify --quiet "refs/tags/$stable_tag"; then
            existing_stable_tag_commit="$(git rev-parse "refs/tags/$stable_tag^{commit}")"
          fi
          python -m release.cli promote-manifest \
            --rc-manifest rc-assets/release-manifest.json --tags-file "$RUNNER_TEMP/tags.txt" \
            --existing-stable-tag-commit "$existing_stable_tag_commit" \
            --output promotion-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest promotion-output/release-manifest.json
          python -m release.cli validate-deployment-contract \
            --contract promotion-output/deployment-contract.json \
            --installer-materials promotion-output/installer-materials.tar
          python -m release.cli write-checksums \
            --output promotion-output/checksums.txt \
            promotion-output/release-manifest.json promotion-output/deployment-contract.json \
            promotion-output/installer-materials.tar
          (cd promotion-output && sha256sum --check checksums.txt)
          stable_tag="$(jq -r '.release.version' promotion-output/release-manifest.json)"
          RC_PORTABLE_ASSET="animemo-$RC_TAG-portable.tar"
          STABLE_PORTABLE_ASSET="animemo-$stable_tag-portable.tar"
          python -m release.cli promote-portable \
            --rc-payload "rc-assets/$RC_PORTABLE_ASSET" \
            --authority-directory promotion-output \
            --output "promotion-output/$STABLE_PORTABLE_ASSET" \
            > promotion-output/portable-promotion-receipt.json
          python -m release.cli previous-stable \
            --tags-file "$RUNNER_TEMP/tags.txt" --target "$stable_tag" \
            --github-output "$GITHUB_OUTPUT"
          stable_commit="$(jq -r '.release.commit' promotion-output/release-manifest.json)"
          stable_api_digest="$(jq -r '.images.api.digest' promotion-output/release-manifest.json)"
          stable_web_digest="$(jq -r '.images.web.digest' promotion-output/release-manifest.json)"
          test "$rc_commit" = "$stable_commit" # RC_COMMIT == STABLE_COMMIT
          test "$api_digest" = "$stable_api_digest" # RC_API_DIGEST == STABLE_API_DIGEST
          test "$web_digest" = "$stable_web_digest" # RC_WEB_DIGEST == STABLE_WEB_DIGEST
          test "$(jq -r '.head_sha' "$RUNNER_TEMP/rc-publication-run.json")" = "$rc_commit"
          test "$(jq -r '.commit' "$RUNNER_TEMP/rc-publication/publication-plan.json")" = "$rc_commit"
          test "$(jq -r '.api_digest' "$RUNNER_TEMP/rc-publication/publication-plan.json")" = "$api_digest"
          test "$(jq -r '.web_digest' "$RUNNER_TEMP/rc-publication/publication-plan.json")" = "$web_digest"
          jq -n \
            --arg rc_tag "$RC_TAG" \
            --arg rc_commit "$rc_commit" \
            --arg manifest "sha256:$(sha256sum rc-assets/release-manifest.json | awk '{print $1}')" \
            --arg deployment "sha256:$(sha256sum rc-assets/deployment-contract.json | awk '{print $1}')" \
            --arg materials "sha256:$(sha256sum rc-assets/installer-materials.tar | awk '{print $1}')" \
            --arg api "$api_digest" --arg web "$web_digest" \
            '{rc_tag:$rc_tag,rc_commit:$rc_commit,release_manifest_identity:$manifest,deployment_contract_identity:$deployment,installer_materials_identity:$materials,api_digest:$api,web_digest:$web}' \
            > "$RUNNER_TEMP/expected-rc-acceptance.json"
          python scripts/rc_live_acceptance.py \
            --record "$RUNNER_TEMP/rc-live-acceptance.json" \
            --expected "$RUNNER_TEMP/expected-rc-acceptance.json" \
            --stable-commit "$stable_commit" \
            --stable-api-digest "$stable_api_digest" \
            --stable-web-digest "$stable_web_digest" \
            > promotion-output/stable-promotion-acceptance.json
          cp "$RUNNER_TEMP/expected-rc-acceptance.json" \
            promotion-output/expected-rc-acceptance.json
          cp "$RUNNER_TEMP/rc-live-acceptance.json" promotion-output/rc-live-acceptance.json
          cp "$RUNNER_TEMP/rc-publication/release-notes.json" promotion-output/rc-release-notes.json
          python -m release.cli promote-release-notes \
            --rc-notes promotion-output/rc-release-notes.json \
            --stable-tag "$stable_tag" \
            --output-json promotion-output/release-notes.json \
            --output-markdown promotion-output/release-notes.md
          python -m release.cli plan-stable-publication-files \
            --repository "$GITHUB_REPOSITORY" --tag "$stable_tag" \
            --acceptance promotion-output/rc-live-acceptance.json \
            --promotion-acceptance promotion-output/stable-promotion-acceptance.json \
            --rc-manifest rc-assets/release-manifest.json \
            --rc-notes promotion-output/rc-release-notes.json \
            --stable-notes promotion-output/release-notes.json \
            --stable-notes-markdown promotion-output/release-notes.md \
            --asset-directory promotion-output \
            --portable "promotion-output/$STABLE_PORTABLE_ASSET" \
            --output promotion-output/publication-plan.json
          OPERATION=portable \
          PUBLICATION_PLAN_PATH=promotion-output/publication-plan.json \
          PORTABLE_BUILD_RECEIPT_PATH=promotion-output/portable-promotion-receipt.json \
            python -m scripts.release_authority \
            > promotion-output/portable-pipeline-authority.json
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"
          echo "rc_commit=$rc_commit" >> "$GITHUB_OUTPUT"
          echo "api_repository=$api_repository" >> "$GITHUB_OUTPUT"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web_repository=$web_repository" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-promotion-${{ steps.identity.outputs.stable_tag }}
          path: promotion-output/
          if-no-files-found: error
          retention-days: 7

  dry-run:
    name: read-only-stable-promotion-dry-run
    if: ${{ inputs.dry_run }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-promotion-${{ needs.plan.outputs.stable_tag }}
          path: promotion-output
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Revalidate read-only promotion output
        shell: bash
        run: |
          python -m release.cli validate-manifest --manifest promotion-output/release-manifest.json
          (cd promotion-output && sha256sum --check checksums.txt)

  publish:
    name: promote-existing-rc-artifacts
    if: ${{ !inputs.dry_run }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-promotion-${{ needs.plan.outputs.stable_tag }}
          path: promotion-output
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: release/requirements.lock
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Revalidate immutable output and publication authority
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.plan.outputs.stable_tag }}
          RC_TAG: ${{ inputs.rc_tag }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
          API_DIGEST: ${{ needs.plan.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.plan.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python -m release.cli validate-manifest \
            --manifest promotion-output/release-manifest.json
          (cd promotion-output && sha256sum --check checksums.txt)
          test "$(jq -r '.release.version' promotion-output/release-manifest.json)" = "$STABLE_TAG"
          test "$(jq -r '.release.commit' promotion-output/release-manifest.json)" = "$RC_COMMIT"
          test "$(jq -r '.images.api.digest' promotion-output/release-manifest.json)" = "$API_DIGEST"
          test "$(jq -r '.images.web.digest' promotion-output/release-manifest.json)" = "$WEB_DIGEST"
          python scripts/rc_live_acceptance.py \
            --record promotion-output/rc-live-acceptance.json \
            --expected promotion-output/expected-rc-acceptance.json \
            --stable-commit "$RC_COMMIT" \
            --stable-api-digest "$API_DIGEST" \
            --stable-web-digest "$WEB_DIGEST"
          rm -rf "$RUNNER_TEMP/source-rc"
          mkdir -p "$RUNNER_TEMP/source-rc"
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/source-rc"
          python -m release.cli plan-stable-publication-files \
            --repository "$GITHUB_REPOSITORY" --tag "$STABLE_TAG" \
            --acceptance promotion-output/rc-live-acceptance.json \
            --promotion-acceptance promotion-output/stable-promotion-acceptance.json \
            --rc-manifest "$RUNNER_TEMP/source-rc/release-manifest.json" \
            --rc-notes promotion-output/rc-release-notes.json \
            --stable-notes promotion-output/release-notes.json \
            --stable-notes-markdown promotion-output/release-notes.md \
            --asset-directory promotion-output \
            --portable "promotion-output/animemo-$STABLE_TAG-portable.tar" \
            --output "$RUNNER_TEMP/revalidated-stable-publication-plan.json"
          cmp "$RUNNER_TEMP/revalidated-stable-publication-plan.json" \
            promotion-output/publication-plan.json
          git fetch --force --tags origin main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG" \
            | jq '{id,tag_name,name,draft,prerelease,immutable}' \
            > "$RUNNER_TEMP/source-rc-presentation.json"
          python -m release.cli verify-stable-source-presentation \
            --acceptance promotion-output/rc-live-acceptance.json \
            --promotion-acceptance promotion-output/stable-promotion-acceptance.json \
            --release "$RUNNER_TEMP/source-rc-presentation.json" \
            --repository .
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Capture the exact trusted workflow snapshot immediately before the
          # first external mutation. Once publication starts, a later main push
          # must not abort this immutable RC transaction halfway through.
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = "true"
      - name: Emit the validated Stable presentation identity
        id: presentation
        shell: bash
        run: |
          set -euo pipefail
          python -m release.cli emit-stable-presentation \
            --plan promotion-output/publication-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
      - name: Reconcile the complete Stable transaction before its first mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-reconcile \
            --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Add only absent Stable registry tags through the durable controller
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-run \
            --phase registry --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Begin the durable Stable manifest attestation intent
        id: tx_attest_file_01
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-01 --github-output "$GITHUB_OUTPUT" \
            --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Attest the Stable manifest under the durable intent
        if: steps.tx_attest_file_01.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: promotion-output/release-manifest.json
          create-storage-record: true
      - name: Reconcile the Stable manifest attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-01 --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Begin the durable Stable deployment contract attestation intent
        id: tx_attest_file_02
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-02 --github-output "$GITHUB_OUTPUT" \
            --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Attest the Stable deployment contract under the durable intent
        if: steps.tx_attest_file_02.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: promotion-output/deployment-contract.json
          create-storage-record: true
      - name: Reconcile the Stable deployment contract attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-02 --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Begin the durable Stable installer materials attestation intent
        id: tx_attest_file_03
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-03 --github-output "$GITHUB_OUTPUT" \
            --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Attest the Stable installer materials under the durable intent
        if: steps.tx_attest_file_03.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: promotion-output/installer-materials.tar
          create-storage-record: true
      - name: Reconcile the Stable installer materials attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-03 --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Verify Stable release contract attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          for subject in release-manifest.json deployment-contract.json installer-materials.tar; do
            gh attestation verify "promotion-output/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/promote-release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Commit Stable tag, Draft, individual assets, and publish through one controller
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-run \
            --phase publication --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin
      - name: Finalize and export the durable Stable transaction receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
        shell: bash
        run: |
          set -euo pipefail
          rc_tree="$(git rev-parse "$RC_COMMIT^{tree}")"
          python -m scripts.release_publication transaction-finalize \
            --plan promotion-output/publication-plan.json \
            --source-tree "$rc_tree" --asset-root promotion-output \
            --repository-path . --remote origin \
            --receipt promotion-output/publication-transaction-ledger.json
      - name: Preserve the finalized Stable publication transaction before post-publication checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-publication-transaction-${{ needs.plan.outputs.stable_tag }}-${{ github.run_attempt }}
          path: promotion-output/publication-transaction-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify the public Stable release without authenticated asset transport
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.plan.outputs.stable_tag }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
          API_DIGEST: ${{ needs.plan.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.plan.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          STABLE_PORTABLE_ASSET="animemo-$STABLE_TAG-portable.tar"
          rm -rf "$RUNNER_TEMP/stable-public-readback"
          mkdir -p "$RUNNER_TEMP/stable-public-readback"
          public_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG"
          env -u GH_TOKEN curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' "$public_api" \
            > "$RUNNER_TEMP/stable-public-release.json"
          jq '{id,tag_name,name,target_commitish,draft,prerelease,immutable,
               assets:[.assets[]|{name}]}' \
            "$RUNNER_TEMP/stable-public-release.json" \
            > "$RUNNER_TEMP/stable-public-presentation.json"
          python -m release.cli verify-release-presentation \
            --plan promotion-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/stable-public-presentation.json" \
            --repository . --state published
          jq --arg target "$RC_COMMIT" \
            '{id,tag:.tag_name,target:$target,draft,prerelease,body,assets:[.assets[]|{name,size,digest}]}' \
            "$RUNNER_TEMP/stable-public-release.json" \
            > "$RUNNER_TEMP/stable-public-metadata.json"
          for name in release-manifest.json deployment-contract.json installer-materials.tar checksums.txt "$STABLE_PORTABLE_ASSET"; do
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' \
              "$RUNNER_TEMP/stable-public-release.json")"
            test -n "$url"
            env -u GH_TOKEN curl --fail --location --silent --show-error \
              "$url" -o "$RUNNER_TEMP/stable-public-readback/$name"
          done
          python -m release.cli verify-declared-portable \
            --plan promotion-output/publication-plan.json \
            --payload "$RUNNER_TEMP/stable-public-readback/$STABLE_PORTABLE_ASSET"
          for subject in release-manifest.json deployment-contract.json installer-materials.tar; do
            gh attestation verify "promotion-output/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/promote-release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          python scripts/release_publication.py verify-post-publish \
            --plan promotion-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/stable-public-metadata.json" \
            --download-directory "$RUNNER_TEMP/stable-public-readback" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --public-unauthenticated-assets --attestations-verified
      - name: Acquire and export the Stable immutable Release attestation sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.plan.outputs.stable_tag }}
          RC_COMMIT: ${{ needs.plan.outputs.rc_commit }}
          API_REPOSITORY: ${{ needs.plan.outputs.api_repository }}
          API_DIGEST: ${{ needs.plan.outputs.api_digest }}
          WEB_REPOSITORY: ${{ needs.plan.outputs.web_repository }}
          WEB_DIGEST: ${{ needs.plan.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          STABLE_PORTABLE_ASSET="animemo-$STABLE_TAG-portable.tar"
          python scripts/acquire_release_attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$STABLE_TAG" --commit "$RC_COMMIT" \
            --workflow .github/workflows/promote-release.yml \
            --payload "promotion-output/$STABLE_PORTABLE_ASSET" \
            --actions-subject "release-manifest=promotion-output/release-manifest.json" \
            --actions-subject "deployment-contract=promotion-output/deployment-contract.json" \
            --actions-subject "installer-materials=promotion-output/installer-materials.tar" \
            --actions-subject "api-image=oci://$API_REPOSITORY@$API_DIGEST" \
            --actions-subject "web-image=oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --actions-workflow api-image=.github/workflows/release.yml \
            --actions-workflow web-image=.github/workflows/release.yml \
            --actions-source-commit release-manifest=$GITHUB_SHA \
            --actions-source-commit deployment-contract=$GITHUB_SHA \
            --actions-source-commit installer-materials=$GITHUB_SHA \
            --output "promotion-output/animemo-$STABLE_TAG-release-attestation.json" \
            > promotion-output/release-attestation-acquisition-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-release-attestation-${{ needs.plan.outputs.stable_tag }}
          path: |
            promotion-output/release-attestation-acquisition-receipt.json
            promotion-output/animemo-${{ needs.plan.outputs.stable_tag }}-release-attestation.json
            promotion-output/publication-transaction-ledger.json
          if-no-files-found: error
          retention-days: 90
