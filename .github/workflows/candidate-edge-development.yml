name: Candidate Edge Development
on:
  push:
    branches: [fix/candidate-installer-exit5-20260912]
permissions:
  contents: read
jobs:
  actual-web-seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: ./.github/actions/setup-pinned-gh-cli
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - run: python -m pip install --require-hashes -r durability/requirements.lock
      - name: Enable OCI image storage on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test -z "$(docker ps -aq)"
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          value = json.loads(path.read_bytes()) if path.exists() else {}
          value.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(value))
          PY
          sudo systemctl restart docker
          docker info -f '{{json .DriverStatus}}'
      - name: Acquire the actual completed Q as read-only development input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/development_candidate_edge_probe.py download --destination "$RUNNER_TEMP/candidate-edge-probe"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce1ce430df7d1eff913f8d0c383c8379f3115561
          path: baseline
          persist-credentials: false
      - name: Reproduce old web startup and verify the isolated correction
        run: >-
          sudo -n -- env -i PATH=/usr/bin:/bin LANG=C.UTF-8 GITHUB_ACTIONS=true
          "$(command -v python)" -I -B scripts/development_candidate_edge_probe.py probe
          --destination "$RUNNER_TEMP/candidate-edge-probe" --baseline "$GITHUB_WORKSPACE/baseline"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-edge-development-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-edge-probe/edge-probe-result.json
          if-no-files-found: error
          retention-days: 14
