name: Release Producer

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Stable release line increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      channel:
        description: Pre-release channel (Stable is promotion-only)
        required: true
        default: rc
        type: choice
        options: [beta, rc]
      dry_run:
        description: Build and validate locally without publishing tags, packages, releases, or attestations
        required: true
        default: true
        type: boolean
      candidate_sha:
        description: Optional exact candidate commit for a read-only dry-run; forbidden for publish
        required: false
        type: string
      target_version_override:
        description: Bootstrap-only vMAJOR.MINOR.PATCH when no Stable tag exists
        required: false
        type: string
      intended_main_sha:
        description: Exact main commit intended for this release
        required: true
        type: string
      upgrade_base_sha:
        description: Audited deployed baseline for BASE to CURRENT validation
        required: true
        default: 6452b3dbfff39529c49c2bc69ede1f3d76236eee
        type: string

concurrency:
  group: animemo-release-producer
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_REPOSITORY: ghcr.io/yanyuhanyue/animemo-api
  WEB_REPOSITORY: ghcr.io/yanyuhanyue/animemo-web

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.version.outputs.target_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      created_at: ${{ steps.identity.outputs.created_at }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind the dispatch ref to an authorized release candidate
        id: candidate
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

          main_sha="$(git rev-parse origin/main^{commit})"
          test "$INTENDED_MAIN_SHA" = "$main_sha"
          candidate_sha="$GITHUB_SHA"
          if [[ "$DRY_RUN" = "true" && -n "$REQUESTED_CANDIDATE_SHA" ]]; then
            [[ "$REQUESTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$REQUESTED_CANDIDATE_SHA" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$REQUESTED_CANDIDATE_SHA"
            candidate_sha="$REQUESTED_CANDIDATE_SHA"
          else
            test -z "$REQUESTED_CANDIDATE_SHA"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force origin "+$candidate_sha:refs/remotes/origin/release-candidate"
          test "$(git rev-parse refs/remotes/origin/release-candidate^{commit})" = "$candidate_sha"
          test "$UPGRADE_BASE_SHA" != "$candidate_sha"
          git rev-parse --verify "$UPGRADE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$UPGRADE_BASE_SHA" "$candidate_sha"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release/requirements.txt
      - run: python -m pip install -r release/requirements.txt
      - name: Prove exact clean candidate identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Resolve deterministic pre-release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          TARGET_VERSION_OVERRIDE: ${{ inputs.target_version_override }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
          python -m release.cli resolve-version \
            --tags-file "$RUNNER_TEMP/tags.txt" \
            --bump "$VERSION_BUMP" \
            --channel "$RELEASE_CHANNEL" \
            --target-version-override "$TARGET_VERSION_OVERRIDE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Reject existing tag or GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Record deterministic artifact identity inputs
        id: identity
        shell: bash
        run: echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Require public frontend configuration before publish
        if: ${{ !inputs.dry_run }}
        env:
          TURNSTILE_SITE_KEY: ${{ vars.ANIMEMO_TURNSTILE_SITE_KEY }}
        shell: bash
        run: test -n "$TURNSTILE_SITE_KEY"

  full-ci:
    name: full-ci
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      comparison_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  full-release-gate:
    name: full-release-gate
    needs: preflight
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      upgrade_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  performance:
    name: rc-performance
    if: ${{ inputs.channel == 'rc' }}
    needs: preflight
    uses: ./.github/workflows/performance.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}

  release-authority:
    name: release-authority
    if: ${{ always() }}
    needs: [preflight, full-ci, full-release-gate, performance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
      - name: Enforce channel-aware Release Producer authority
        env:
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/release_authority.py

  dry-run:
    name: read-only-release-dry-run
    if: ${{ inputs.dry_run }}
    needs: [preflight, release-authority]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Prove exact read-only candidate identity
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release/requirements.txt
      - run: python -m pip install -r release/requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build API OCI artifact without publishing
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Build Web OCI artifact without publishing
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Start and accept the exact locally built API and Web images
        shell: bash
        run: >-
          bash scripts/rehearse-release-images.sh
          --confirm-isolated
          --api-image "animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}"
          --web-image "animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}"
          --version "${{ needs.preflight.outputs.release_tag }}"
          --commit "${{ needs.preflight.outputs.candidate_sha }}"
          --channel "${{ inputs.channel }}"
      - name: Generate and validate manifest, checksums, and unsigned provenance input plan
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          python -m release.cli generate-deployment-contract \
            --root . --output release-output/deployment-contract.json
          python -m release.cli generate-manifest \
            --version "$RELEASE_TAG" --channel "${{ inputs.channel }}" \
            --commit "${{ needs.preflight.outputs.candidate_sha }}" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --compatibility-file release/compatibility.json \
            --deployment-contract-file release-output/deployment-contract.json \
            --deployment-root . \
            --output release-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json --updater-version 1.0.0
          python -m release.cli write-checksums \
            --output release-output/checksums.txt \
            release-output/release-manifest.json release-output/deployment-contract.json
          (cd release-output && sha256sum --check checksums.txt)
          python -m release.cli generate-provenance-plan \
            --version "$RELEASE_TAG" --commit "${{ needs.preflight.outputs.candidate_sha }}" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-output/provenance-plan.unsigned.json
          if [[ "${{ inputs.channel }}" = "rc" ]]; then
            git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
            python -m release.cli promote-manifest \
              --rc-manifest release-output/release-manifest.json \
              --tags-file "$RUNNER_TEMP/tags.txt" --created-at "$CREATED_AT" \
              --provenance-source-commit "${{ needs.preflight.outputs.candidate_sha }}" \
              --output release-output/stable-manifest.dry-run.json
            test "$(jq -r '.release.commit' release-output/release-manifest.json)" = \
              "$(jq -r '.release.commit' release-output/stable-manifest.dry-run.json)" # RC_COMMIT == STABLE_COMMIT
            test "$(jq -r '.images.api.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.api.digest' release-output/stable-manifest.dry-run.json)" # RC_API_DIGEST == STABLE_API_DIGEST
            test "$(jq -r '.images.web.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.web.digest' release-output/stable-manifest.dry-run.json)" # RC_WEB_DIGEST == STABLE_WEB_DIGEST
            test "$(jq -cS '.deployment' release-output/release-manifest.json)" = \
              "$(jq -cS '.deployment' release-output/stable-manifest.dry-run.json)" # RC_DEPLOYMENT == STABLE_DEPLOYMENT
            test "$(jq -cS '.artifacts.deploymentContract' release-output/release-manifest.json)" = \
              "$(jq -cS '.artifacts.deploymentContract' release-output/stable-manifest.dry-run.json)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.preflight.outputs.release_tag }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish-immutable-prerelease
    if: ${{ !inputs.dry_run }}
    needs: [preflight, release-authority]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release/requirements.txt
      - run: python -m pip install -r release/requirements.txt
      - name: Recheck immutable release identity immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image once without publishing
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.API_REPOSITORY }}:${{ needs.preflight.outputs.release_tag }}
            ${{ env.API_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ github.sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Build Web image once without publishing
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.WEB_REPOSITORY }}:${{ needs.preflight.outputs.release_tag }}
            ${{ env.WEB_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_TURNSTILE_SITE_KEY=${{ vars.ANIMEMO_TURNSTILE_SITE_KEY }}
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ github.sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Start and accept the exact images before any external publication
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: >-
          bash scripts/rehearse-release-images.sh
          --confirm-isolated
          --api-image "$API_REPOSITORY:$RELEASE_TAG"
          --web-image "$WEB_REPOSITORY:$RELEASE_TAG"
          --version "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --channel "${{ inputs.channel }}"
      - name: Publish only the already rehearsed images
        id: published
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish_image() {
            local repository="$1"
            local output digest sha_digest
            output="$(docker push "$repository:$RELEASE_TAG" 2>&1)"
            printf '%s\n' "$output" >&2
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$output" | tail -n 1)"
            test -n "$digest"
            output="$(docker push "$repository:sha-$GITHUB_SHA" 2>&1)"
            printf '%s\n' "$output" >&2
            sha_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$output" | tail -n 1)"
            test "$sha_digest" = "$digest"
            printf '%s' "$digest"
          }
          api_digest="$(publish_image "$API_REPOSITORY")"
          web_digest="$(publish_image "$WEB_REPOSITORY")"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"
      - name: Attest API image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest Web image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.WEB_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Generate and validate immutable release assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          python -m release.cli generate-deployment-contract \
            --root . --output release-output/deployment-contract.json
          python -m release.cli generate-manifest \
            --version "$RELEASE_TAG" --channel "${{ inputs.channel }}" \
            --commit "$GITHUB_SHA" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --compatibility-file release/compatibility.json \
            --deployment-contract-file release-output/deployment-contract.json \
            --deployment-root . \
            --output release-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json --updater-version 1.0.0
          python -m release.cli write-checksums \
            --output release-output/checksums.txt \
            release-output/release-manifest.json release-output/deployment-contract.json
          (cd release-output && sha256sum --check checksums.txt)
      - name: Attest release manifest provenance
        uses: actions/attest@v4
        with:
          subject-checksums: release-output/checksums.txt
      - name: Verify published OCI and file attestations
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$API_REPOSITORY@$API_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify release-output/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify release-output/deployment-contract.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
      - name: Create immutable tag and GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "AniMemo $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            release-output/release-manifest.json release-output/deployment-contract.json \
            release-output/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --generate-notes
