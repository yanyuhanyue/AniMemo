name: Release Producer

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit release operation: qualify creates evidence; publish consumes one exact qualification run"
        required: true
        default: qualify
        type: choice
        options: [qualify, publish]
      version_bump:
        description: Stable release line increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      channel:
        description: Pre-release channel (Stable is promotion-only)
        required: true
        default: rc
        type: choice
        options: [beta, rc]
      candidate_sha:
        description: Optional exact candidate commit for a read-only dry-run; forbidden for publish
        required: false
        type: string
      target_version_override:
        description: Bootstrap-only vMAJOR.MINOR.PATCH when no Stable tag exists
        required: false
        type: string
      intended_main_sha:
        description: Exact main commit intended for this release
        required: true
        type: string
      upgrade_base_sha:
        description: Audited deployed baseline for BASE to CURRENT validation
        required: true
        default: 6452b3dbfff39529c49c2bc69ede1f3d76236eee
        type: string
      qualification_run_id:
        description: Successful Phase A qualification run required for publish
        required: false
        type: string

concurrency:
  group: animemo-release-producer
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_REQUIRED_VERSION: 2.97.0
  CRANE_REQUIRED_VERSION: 0.21.9
  API_REPOSITORY: ghcr.io/yanyuhanyue/animemo-api
  WEB_REPOSITORY: ghcr.io/yanyuhanyue/animemo-web
  POSTGRES_IMAGE: docker.io/library/postgres@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
  REDIS_IMAGE: docker.io/library/redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    outputs:
      target_version: ${{ steps.version.outputs.target_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      previous_stable: ${{ steps.previous.outputs.previous_stable }}
      created_at: ${{ steps.identity.outputs.created_at }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the dispatch ref to an authorized release candidate
        id: candidate
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          main_sha="$(git rev-parse origin/main^{commit})"
          test "$INTENDED_MAIN_SHA" = "$main_sha"
          if [[ "$OPERATION" = "publish" ]]; then
            test -z "$REQUESTED_CANDIDATE_SHA"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          elif [[ -n "$REQUESTED_CANDIDATE_SHA" ]]; then
            [[ "$REQUESTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$REQUESTED_CANDIDATE_SHA" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$REQUESTED_CANDIDATE_SHA"
          else
            test -z "$REQUESTED_CANDIDATE_SHA"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force origin "+$GITHUB_SHA:refs/remotes/origin/release-candidate"
          test "$(git rev-parse refs/remotes/origin/release-candidate^{commit})" = "$GITHUB_SHA"
          test "$UPGRADE_BASE_SHA" != "$GITHUB_SHA"
          git rev-parse --verify "$UPGRADE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$UPGRADE_BASE_SHA" "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh --version | sed -nE 's/^gh version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          test "$version" = "$GH_REQUIRED_VERSION"
      - name: Verify immutable-release administration-read credential
        if: ${{ inputs.operation == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.ANIMEMO_RELEASE_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          response="$RUNNER_TEMP/immutable-releases-early.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/immutable-releases" > "$response"
          jq -e '
            type == "object" and
            (.enabled | type) == "boolean" and
            (.enforced_by_owner | type) == "boolean" and
            .enabled == true
          ' "$response" >/dev/null
          enforced_by_owner="$(jq -r '.enforced_by_owner' "$response")"
          printf 'Immutable Releases enabled=true enforced_by_owner=%s\n' "$enforced_by_owner"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r release/requirements.txt
      - name: Prove exact clean candidate identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Resolve deterministic pre-release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          TARGET_VERSION_OVERRIDE: ${{ inputs.target_version_override }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
          python -m release.cli resolve-version \
            --tags-file "$RUNNER_TEMP/tags.txt" \
            --publication-reservations-file release/publication-reservations.json \
            --bump "$VERSION_BUMP" \
            --channel "$RELEASE_CHANNEL" \
            --target-version-override "$TARGET_VERSION_OVERRIDE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve the exact previous Stable notes boundary
        id: previous
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
          python -m release.cli previous-stable \
            --tags-file "$RUNNER_TEMP/tags.txt" --target "$TARGET_VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Reject existing tag or GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Record deterministic artifact identity inputs
        id: identity
        shell: bash
        run: echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  full-ci:
    name: full-ci
    if: ${{ inputs.operation == 'qualify' }}
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      comparison_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  full-release-gate:
    name: full-release-gate
    if: ${{ inputs.operation == 'qualify' }}
    needs: preflight
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      upgrade_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  performance:
    name: rc-performance
    if: ${{ inputs.operation == 'qualify' && inputs.channel == 'rc' }}
    needs: preflight
    uses: ./.github/workflows/performance.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}

  platform-qualification:
    name: platform-qualification-linux-amd64
    if: ${{ inputs.operation == 'qualify' }}
    needs: [preflight, full-ci, full-release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
      QUALIFICATION_POSTGRES_NAME: animemo-platform-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      ANIMEMO_TEST_DATABASE_URL: postgresql://qualification:qualification-only@127.0.0.1:55432/qualification_source
      ANIMEMO_RESTORE_TEST_DATABASE_URL: postgresql://qualification:qualification-only@127.0.0.1:55432/qualification_target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Prove the exact hosted qualification candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          rehearsal_dir="$RUNNER_TEMP/animemo-platform-rehearsals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$rehearsal_dir"
          echo "REHEARSAL_DIR=$rehearsal_dir" >> "$GITHUB_ENV"
      - name: Install exact Python and PostgreSQL 16 qualification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r release/requirements.txt -r durability/requirements.txt -r backend/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          test "$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')" = "16"
          test "$(psql --version | sed -E 's/.* ([0-9]+).*/\1/')" = "16"
      - name: Start the exact PostgreSQL 16 qualification database
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_IMAGE"
          docker run --detach --name "$QUALIFICATION_POSTGRES_NAME" \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=qualification \
            --env POSTGRES_PASSWORD=qualification-only \
            --env POSTGRES_DB=postgres \
            "$POSTGRES_IMAGE"
          for attempt in {1..60}; do
            if docker exec "$QUALIFICATION_POSTGRES_NAME" \
              pg_isready --username qualification --dbname postgres; then
              break
            fi
            if [[ "$attempt" = "60" ]]; then
              docker logs "$QUALIFICATION_POSTGRES_NAME"
              exit 1
            fi
            sleep 2
          done
          docker exec "$QUALIFICATION_POSTGRES_NAME" \
            createdb --username qualification qualification_source
          docker exec "$QUALIFICATION_POSTGRES_NAME" \
            createdb --username qualification qualification_target
      - name: Rehearse Fresh Installer domain, production adapters, and Compose contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            installer.tests.test_cli \
            installer.tests.test_runtime \
            scripts.tests.test_installer_operations \
            scripts.tests.test_deployment_updater_contract -v
          python -c "from installer.production import build_runtime; assert build_runtime().__class__.__name__ == 'Installer'"
          cat > "$RUNNER_TEMP/platform-compose.env" <<EOF
          ANIMEMO_API_IMAGE=ghcr.io/yanyuhanyue/animemo-api@sha256:$(printf 'a%.0s' {1..64})
          ANIMEMO_WEB_IMAGE=ghcr.io/yanyuhanyue/animemo-web@sha256:$(printf 'b%.0s' {1..64})
          ANIMEMO_POSTGRES_IMAGE=$POSTGRES_IMAGE
          ANIMEMO_REDIS_IMAGE=$REDIS_IMAGE
          ANIMEMO_LISTEN_HOST=127.0.0.1
          ANIMEMO_LISTEN_PORT=8088
          ANIMEMO_CONFIG_REVISION=11111111-1111-4111-8111-111111111111
          ANIMEMO_INSTANCE_NAME=qualification
          ANIMEMO_INSTANCE_ID=12345678-1234-4234-9234-123456789abc
          ANIMEMO_COMPOSE_PROJECT=animemo-qualification
          ANIMEMO_MANAGED_ENV_PATH=/run/animemo-updater/qualification/managed.env
          ANIMEMO_UPDATER_RUNTIME_ROOT=/run/animemo-updater/qualification
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=qualification-only
          EOF
          sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" /run/animemo-updater/qualification
          sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/platform-compose.env" /run/animemo-updater/qualification/managed.env
          docker compose --project-name animemo-qualification \
            --env-file "$RUNNER_TEMP/platform-compose.env" \
            --file deploy/docker-compose.yml config --quiet
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/fresh_install"
          chmod 0600 "$REHEARSAL_DIR/fresh_install"
      - name: Rehearse Restore Runtime against real PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.tests.test_restore \
            scripts.tests.test_restore_postgres -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/logical_restore"
          chmod 0600 "$REHEARSAL_DIR/logical_restore"
      - name: Rehearse Migration Runtime against real PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.tests.test_durability_migration \
            scripts.tests.test_migration_postgres -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/logical_migration"
          chmod 0600 "$REHEARSAL_DIR/logical_migration"
      - name: Rehearse canonical Updater adoption and handoff
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            updater.tests.test_adoption \
            updater.tests.test_instance_registry \
            updater.tests.test_linux_e2e \
            updater.tests.test_deployment \
            updater.tests.test_executor -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/updater_handoff"
          chmod 0600 "$REHEARSAL_DIR/updater_handoff"
      - name: Rehearse complete Doctor acceptance semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_durability_doctor -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/doctor_complete"
          chmod 0600 "$REHEARSAL_DIR/doctor_complete"
      - name: Produce exact hosted platform qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 platform-qualification
          python scripts/platform_qualification.py collect \
            --candidate-sha "$CANDIDATE_SHA" \
            --postgres-image "$POSTGRES_IMAGE" \
            --redis-image "$REDIS_IMAGE" \
            --source-database-url "$ANIMEMO_TEST_DATABASE_URL" \
            --target-database-url "$ANIMEMO_RESTORE_TEST_DATABASE_URL" \
            --rehearsal-directory "$REHEARSAL_DIR" \
            --probe-root "$RUNNER_TEMP/animemo-platform-filesystem-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output platform-qualification/platform-qualification.json
          python scripts/platform_qualification.py verify \
            --input platform-qualification/platform-qualification.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-qualification/platform-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup qualification containers and runtime file
        if: always()
        shell: bash
        run: |
          docker rm --force "$QUALIFICATION_POSTGRES_NAME" >/dev/null 2>&1 || true
          sudo rm -f /run/animemo-updater/qualification/managed.env

  release-authority:
    name: release-authority
    if: ${{ always() }}
    needs: [preflight, full-ci, full-release-gate, performance, platform-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.operation == 'qualify' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.operation == 'publish' }}
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh --version | sed -nE 's/^gh version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          test "$version" = "$GH_REQUIRED_VERSION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r release/requirements.txt
      - name: Enforce Phase A Release Producer authority
        if: ${{ inputs.operation == 'qualify' }}
        env:
          OPERATION: qualify
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          PLATFORM_QUALIFICATION_RESULT: ${{ needs.platform-qualification.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLATFORM_QUALIFICATION_RESULT" = "success"
          python -m scripts.release_authority
      - name: Download and verify Phase A qualification evidence
        if: ${{ inputs.operation == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_RUN_ID"
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/qualification-archive"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            > "$RUNNER_TEMP/qualification-run.json"
          run_path="$(jq -r '.path // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_name="$(jq -r '.name // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_event="$(jq -r '.event // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_status="$(jq -r '.status // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_conclusion="$(jq -r '.conclusion // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_attempt="$(jq -r '.run_attempt // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_repo="$(jq -r '.repository.full_name // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_head="$(jq -r '.head_sha // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_branch="$(jq -r '.head_branch // empty' "$RUNNER_TEMP/qualification-run.json")"
          test "$run_path" = ".github/workflows/release.yml"
          test "$run_name" = "Release Producer"
          test "$run_event" = "workflow_dispatch"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          test "$run_repo" = "$GITHUB_REPOSITORY"
          test "$run_head" = "${{ needs.preflight.outputs.candidate_sha }}"
          qualification_workflow_ref="$(jq -r '.workflow_ref // empty' "$RUNNER_TEMP/qualification-run.json")"
          if [[ -z "$qualification_workflow_ref" ]]; then
            test -n "$run_branch"
            qualification_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$run_branch"
          fi
          test "$qualification_workflow_ref" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$run_branch"
          printf '%s\n' "$qualification_workflow_ref" > "$RUNNER_TEMP/qualification-workflow-ref.txt"
          printf '%s\n' "$run_head" > "$RUNNER_TEMP/qualification-workflow-sha.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qualification-artifacts.json"
          artifact_count="$(jq --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("release-qualification-" + $id) and (.workflow_run.id|tostring) == $id)] | length' \
            "$RUNNER_TEMP/qualification-artifacts.json")"
          test "$artifact_count" = "1"
          jq -c --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("release-qualification-" + $id) and (.workflow_run.id|tostring) == $id)][0]' \
            "$RUNNER_TEMP/qualification-artifacts.json" \
            > "$RUNNER_TEMP/qualification-artifact.json"
          archive_url="$(jq -r '.archive_download_url // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          metadata_digest="$(jq -r '.digest // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          artifact_expired="$(jq -r '.expired' "$RUNNER_TEMP/qualification-artifact.json")"
          artifact_head="$(jq -r '.workflow_run.head_sha // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          test -n "$archive_url"
          [[ "$metadata_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$artifact_expired" = "false"
          test "$artifact_head" = "${{ needs.preflight.outputs.candidate_sha }}"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$archive_url" -o "$RUNNER_TEMP/qualification-archive/evidence.zip"
          actual_digest="sha256:$(sha256sum "$RUNNER_TEMP/qualification-archive/evidence.zip" | awk '{print $1}')"
          test "$actual_digest" = "$metadata_digest"
          python -m release.cli extract-qualification-artifact \
            --archive "$RUNNER_TEMP/qualification-archive/evidence.zip" \
            --destination "$RUNNER_TEMP/qualification" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --expected-sha256 "$metadata_digest"
          evidence_file="$RUNNER_TEMP/qualification/release-qualification-$QUALIFICATION_RUN_ID.json"
          test -f "$evidence_file"
          platform_file="$RUNNER_TEMP/qualification/platform-qualification.json"
          test -f "$platform_file"
          notes_file="$RUNNER_TEMP/qualification/release-notes.json"
          notes_markdown="$RUNNER_TEMP/qualification/release-notes.md"
          prepublication_file="$RUNNER_TEMP/qualification/prepublication-materials.json"
          installer_materials="$RUNNER_TEMP/qualification/installer-materials.tar"
          deployment_contract="$RUNNER_TEMP/qualification/deployment-contract.json"
          test -f "$notes_file"
          test -f "$notes_markdown"
          test -f "$prepublication_file"
          test -f "$installer_materials"
          test -f "$deployment_contract"
          test "$(jq -r '.schemaVersion' "$prepublication_file")" = "2"
          test "$(jq -r '.candidateSha' "$prepublication_file")" = "${{ needs.preflight.outputs.candidate_sha }}"
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          test "$(jq -r '.candidateTreeSha' "$prepublication_file")" = "$candidate_tree"
          python -m release.cli verify-prepublication-materials \
            --prepublication "$prepublication_file" \
            --installer-materials "$installer_materials" \
            --deployment-contract "$deployment_contract" \
            --expected-candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --expected-candidate-tree-sha "$candidate_tree"
          notes_identity="$(jq -r '.identity // empty' "$notes_file")"
          notes_markdown_sha256="sha256:$(sha256sum "$notes_markdown" | awk '{print $1}')"
          test "$(jq -r '.release_notes.snapshot_identity // empty' "$evidence_file")" = "$notes_identity"
          test "$(jq -r '.release_notes.markdown_sha256 // empty' "$evidence_file")" = "$notes_markdown_sha256"
          python scripts/platform_qualification.py verify \
            --input "$platform_file" \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --run-id "$QUALIFICATION_RUN_ID" \
            --run-attempt "$run_attempt" \
            --workflow-path .github/workflows/release.yml
          cp "$RUNNER_TEMP/qualification-run.json" "$RUNNER_TEMP/qualification-metadata-run.json"
          cp "$RUNNER_TEMP/qualification-artifact.json" "$RUNNER_TEMP/qualification-metadata-artifact.json"
      - name: Enforce Phase B Release Producer authority
        if: ${{ inputs.operation == 'publish' }}
        env:
          OPERATION: publish
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_PATH: ${{ runner.temp }}/qualification/release-qualification-${{ inputs.qualification_run_id }}.json
          RELEASE_GRAPH_CONTRACT: animemo.release-gate.jobs/v2
        shell: bash
        run: |
          set -euo pipefail
          export QUALIFICATION_RUN_METADATA="$(cat "$RUNNER_TEMP/qualification-metadata-run.json")"
          export QUALIFICATION_ARTIFACT_METADATA="$(cat "$RUNNER_TEMP/qualification-metadata-artifact.json")"
          export QUALIFICATION_ARCHIVE_SHA256="$(jq -r '.digest' "$RUNNER_TEMP/qualification-metadata-artifact.json")"
          export QUALIFICATION_WORKFLOW_REF="$(cat "$RUNNER_TEMP/qualification-workflow-ref.txt")"
          export QUALIFICATION_WORKFLOW_SHA="$(cat "$RUNNER_TEMP/qualification-workflow-sha.txt")"
          export RELEASE_NOTES_IDENTITY="$(jq -r '.identity' "$RUNNER_TEMP/qualification/release-notes.json")"
          export RELEASE_NOTES_MARKDOWN_SHA256="sha256:$(sha256sum "$RUNNER_TEMP/qualification/release-notes.md" | awk '{print $1}')"
          python -m scripts.release_authority
      - name: Stage the validated release input for Phase B production
        if: ${{ inputs.operation == 'publish' }}
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 validated-release-input
          install -m 0600 \
            "$RUNNER_TEMP/qualification/platform-qualification.json" \
            validated-release-input/platform-qualification.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes.json" \
            validated-release-input/release-notes.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes.md" \
            validated-release-input/release-notes.md
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-qualification-$QUALIFICATION_RUN_ID.json" \
            validated-release-input/release-qualification.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/prepublication-materials.json" \
            validated-release-input/prepublication-materials.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/installer-materials.tar" \
            validated-release-input/installer-materials.tar
          install -m 0600 \
            "$RUNNER_TEMP/qualification/deployment-contract.json" \
            validated-release-input/deployment-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.operation == 'publish' }}
        with:
          name: validated-release-input-${{ github.run_id }}
          path: validated-release-input/
          if-no-files-found: error
          retention-days: 1

  dry-run:
    name: read-only-release-dry-run
    if: ${{ inputs.operation == 'qualify' }}
    needs: [preflight, release-authority, platform-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact read-only candidate identity
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - run: python -m pip install -r release/requirements.txt
      - name: Freeze deterministic PR metadata and render qualified Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          PREVIOUS_STABLE: ${{ needs.preflight.outputs.previous_stable }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes_base="$UPGRADE_BASE_SHA"
          if [[ -n "$PREVIOUS_STABLE" ]]; then
            release_notes_base="$(git rev-parse "$PREVIOUS_STABLE^{commit}")"
          fi
          git merge-base --is-ancestor "$release_notes_base" "$CANDIDATE_SHA"
          mkdir -p release-output
          python scripts/release_notes_snapshot.py \
            --repository "$GITHUB_REPOSITORY" \
            --range-start "$release_notes_base" \
            --candidate-sha "$CANDIDATE_SHA" \
            --previous-stable "$PREVIOUS_STABLE" \
            --release-tag "$RELEASE_TAG" \
            --target-version "$TARGET_VERSION" \
            --channel "${{ inputs.channel }}" \
            --supported-os "Ubuntu 24.04 LTS" \
            --output-input release-output/release-notes-input.json \
            --output-json release-output/release-notes.json \
            --output-markdown release-output/release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-qualification-input
      - name: Bind the hosted platform qualification into Installer materials
        shell: bash
        run: |
          set -euo pipefail
          python scripts/platform_qualification.py verify \
            --input platform-qualification-input/platform-qualification.json \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
          install -m 0644 \
            platform-qualification-input/platform-qualification.json \
            release/platform-qualification.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API OCI artifact without publishing
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Build Web OCI artifact without publishing
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Start and accept the exact locally built API and Web images
        env:
          ANIMEMO_POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          ANIMEMO_REDIS_IMAGE: ${{ env.REDIS_IMAGE }}
        shell: bash
        run: >-
          bash scripts/rehearse-release-images.sh
          --confirm-isolated
          --api-image "animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}"
          --web-image "animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}"
          --version "${{ needs.preflight.outputs.release_tag }}"
          --commit "${{ needs.preflight.outputs.candidate_sha }}"
          --channel "${{ inputs.channel }}"
      - name: Generate and validate manifest, checksums, and unsigned provenance input plan
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release/release_attestation_verifier
            go mod download
            GOPROXY=off GOSUMDB=off go mod verify
            GOPROXY=off GOSUMDB=off go test ./...
            CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go build -mod=readonly -trimpath -o offline-release-verifier .
          )
          test -x release/release_attestation_verifier/offline-release-verifier
          rm -rf "$RUNNER_TEMP/animemo-pretrust-v2"
          python -m release.cli build-initial-trust-kit \
            --verifier release/release_attestation_verifier/offline-release-verifier \
            --output "$RUNNER_TEMP/animemo-pretrust-v2"
          mkdir -p release-output
          install -m 0600 \
            "$RUNNER_TEMP/animemo-pretrust-v2/initial-trust-bootstrap.json" \
            release-output/initial-trust-bootstrap.json
          rm -rf "$RUNNER_TEMP/release-wheelhouse"
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest "$RUNNER_TEMP/release-wheelhouse" \
            -r release/requirements.txt -r durability/requirements.txt
          python -m release.cli build-installer-materials \
            --root . --wheelhouse "$RUNNER_TEMP/release-wheelhouse" \
            --initial-trust-kit "$RUNNER_TEMP/animemo-pretrust-v2" \
            --output release-output/installer-materials.tar
          tar --extract --to-stdout --file release-output/installer-materials.tar \
            release/platform-qualification.json | cmp - release/platform-qualification.json
          python -m release.cli generate-deployment-contract \
            --root . --installer-materials release-output/installer-materials.tar \
            --output release-output/deployment-contract.json
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          python -m release.cli build-prepublication-materials \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --candidate-tree-sha "$candidate_tree" \
            --output release-output/prepublication-materials.json
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -m release.cli generate-manifest \
            --version "$RELEASE_TAG" --channel "${{ inputs.channel }}" \
            --commit "${{ needs.preflight.outputs.candidate_sha }}" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --compatibility-file release/compatibility.json \
            --deployment-contract-file release-output/deployment-contract.json \
            --deployment-root . \
            --installer-materials release-output/installer-materials.tar \
            --output release-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json --updater-version 1.0.0
          python -m release.cli write-checksums \
            --output release-output/checksums.txt \
            release-output/release-manifest.json release-output/deployment-contract.json \
            release-output/installer-materials.tar
          (cd release-output && sha256sum --check checksums.txt)
          python -m release.cli generate-provenance-plan \
            --version "$RELEASE_TAG" --commit "${{ needs.preflight.outputs.candidate_sha }}" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-output/provenance-plan.unsigned.json
          if [[ "${{ inputs.channel }}" = "rc" ]]; then
            git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
            python -m release.cli promote-manifest \
              --rc-manifest release-output/release-manifest.json \
              --tags-file "$RUNNER_TEMP/tags.txt" --created-at "$CREATED_AT" \
              --provenance-source-commit "${{ needs.preflight.outputs.candidate_sha }}" \
              --output release-output/stable-manifest.dry-run.json
            test "$(jq -r '.release.commit' release-output/release-manifest.json)" = \
              "$(jq -r '.release.commit' release-output/stable-manifest.dry-run.json)" # RC_COMMIT == STABLE_COMMIT
            test "$(jq -r '.images.api.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.api.digest' release-output/stable-manifest.dry-run.json)" # RC_API_DIGEST == STABLE_API_DIGEST
            test "$(jq -r '.images.web.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.web.digest' release-output/stable-manifest.dry-run.json)" # RC_WEB_DIGEST == STABLE_WEB_DIGEST
            test "$(jq -cS '.deployment' release-output/release-manifest.json)" = \
              "$(jq -cS '.deployment' release-output/stable-manifest.dry-run.json)" # RC_DEPLOYMENT == STABLE_DEPLOYMENT
            test "$(jq -cS '.artifacts.deploymentContract' release-output/release-manifest.json)" = \
              "$(jq -cS '.artifacts.deploymentContract' release-output/stable-manifest.dry-run.json)"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ needs.preflight.outputs.release_tag }}
          path: release-output/
          if-no-files-found: error
          retention-days: 7

  qualification-evidence:
    name: phase-a-qualification-evidence
    if: ${{ always() && inputs.operation == 'qualify' }}
    needs: [preflight, full-ci, full-release-gate, performance, platform-qualification, release-authority, dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh --version | sed -nE 's/^gh version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          test "$version" = "$GH_REQUIRED_VERSION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r release/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-qualification-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dry-run-${{ needs.preflight.outputs.release_tag }}
          path: release-dry-run-input
      - name: Generate qualification evidence after complete Phase A
        env:
          OPERATION: qualify
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          QUALIFICATION_ARTIFACT_PATH: ${{ runner.temp }}/release-qualification-${{ github.run_id }}.json
          RELEASE_NOTES_IDENTITY_FILE: release-dry-run-input/release-notes.json
          RELEASE_NOTES_MARKDOWN_FILE: release-dry-run-input/release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_NOTES_IDENTITY="$(jq -r '.identity // empty' "$RELEASE_NOTES_IDENTITY_FILE")"
          export RELEASE_NOTES_MARKDOWN_SHA256="sha256:$(sha256sum "$RELEASE_NOTES_MARKDOWN_FILE" | awk '{print $1}')"
          [[ "$RELEASE_NOTES_IDENTITY" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-dry-run-input/prepublication-materials.json \
            --installer-materials release-dry-run-input/installer-materials.tar \
            --deployment-contract release-dry-run-input/deployment-contract.json \
            --expected-candidate-sha "$CANDIDATE_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -m scripts.release_authority
          mkdir -p release-qualification
          install -m 0600 "$RUNNER_TEMP/release-qualification-${GITHUB_RUN_ID}.json" \
            "release-qualification/release-qualification-${GITHUB_RUN_ID}.json"
          python scripts/platform_qualification.py verify \
            --input platform-qualification-input/platform-qualification.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
          install -m 0600 platform-qualification-input/platform-qualification.json \
            release-qualification/platform-qualification.json
          install -m 0600 release-dry-run-input/release-notes.json \
            release-qualification/release-notes.json
          install -m 0600 release-dry-run-input/release-notes.md \
            release-qualification/release-notes.md
          install -m 0600 release-dry-run-input/prepublication-materials.json \
            release-qualification/prepublication-materials.json
          install -m 0600 release-dry-run-input/installer-materials.tar \
            release-qualification/installer-materials.tar
          install -m 0600 release-dry-run-input/deployment-contract.json \
            release-qualification/deployment-contract.json
          expected_files="$(printf '%s\n' \
            "release-qualification-${GITHUB_RUN_ID}.json" \
            deployment-contract.json installer-materials.tar \
            platform-qualification.json prepublication-materials.json \
            release-notes.json release-notes.md | LC_ALL=C sort)"
          actual_files="$(find release-qualification -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification-${{ github.run_id }}
          path: release-qualification/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-immutable-prerelease
    if: ${{ !cancelled() && inputs.operation == 'publish' && needs.preflight.result == 'success' && needs.release-authority.result == 'success' }}
    needs: [preflight, release-authority]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(gh --version | sed -nE 's/^gh version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          test "$version" = "$GH_REQUIRED_VERSION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r release/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-input-${{ github.run_id }}
          path: validated-release-input
      - name: Verify and stage exact qualified prepublication materials before mutation
        shell: bash
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' deployment-contract.json \
            installer-materials.tar platform-qualification.json \
            prepublication-materials.json release-notes.json \
            release-notes.md release-qualification.json | LC_ALL=C sort)"
          actual_files="$(find validated-release-input -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"
          python scripts/platform_qualification.py verify \
            --input validated-release-input/platform-qualification.json \
            --candidate-sha "$GITHUB_SHA" \
            --workflow-path .github/workflows/release.yml
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication validated-release-input/prepublication-materials.json \
            --installer-materials validated-release-input/installer-materials.tar \
            --deployment-contract validated-release-input/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          install -d -m 0700 release-output
          for name in release-notes.json release-notes.md release-qualification.json \
            prepublication-materials.json installer-materials.tar \
            deployment-contract.json; do
            install -m 0600 "validated-release-input/$name" "release-output/$name"
            cmp "validated-release-input/$name" "release-output/$name"
          done
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
      - name: Recheck immutable release identity immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - name: Recheck immutable release setting immediately before publishing
        env:
          GH_TOKEN: ${{ secrets.ANIMEMO_RELEASE_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          response="$RUNNER_TEMP/immutable-releases-final.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/immutable-releases" > "$response"
          jq -e '
            type == "object" and
            (.enabled | type) == "boolean" and
            (.enforced_by_owner | type) == "boolean" and
            .enabled == true
          ' "$response" >/dev/null
          enforced_by_owner="$(jq -r '.enforced_by_owner' "$response")"
          printf 'Immutable Releases enabled=true enforced_by_owner=%s\n' "$enforced_by_owner"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.21.9
      - name: Assert exact crane version
        shell: bash
        run: |
          set -euo pipefail
          test "$(crane version)" = "$CRANE_REQUIRED_VERSION"
      - name: Reject existing immutable image manifests before building
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          for image in "$API_REPOSITORY:$RELEASE_TAG" "$API_REPOSITORY:sha-$GITHUB_SHA" \
            "$WEB_REPOSITORY:$RELEASE_TAG" "$WEB_REPOSITORY:sha-$GITHUB_SHA"; do
            if output="$(docker manifest inspect "$image" 2>&1)"; then
              echo "Immutable image manifest already exists: $image" >&2
              exit 1
            fi
            if ! grep -qiE 'manifest unknown|not found|name unknown' <<<"$output"; then
              echo "Unable to prove image manifest is absent: $image" >&2
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
      - name: Build API image once without publishing
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.API_REPOSITORY }}:${{ needs.preflight.outputs.release_tag }}
            ${{ env.API_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ github.sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Build Web image once without publishing
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.WEB_REPOSITORY }}:${{ needs.preflight.outputs.release_tag }}
            ${{ env.WEB_REPOSITORY }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ github.sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Start and accept the exact images before any external publication
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          ANIMEMO_POSTGRES_IMAGE: ${{ env.POSTGRES_IMAGE }}
          ANIMEMO_REDIS_IMAGE: ${{ env.REDIS_IMAGE }}
        shell: bash
        run: >-
          bash scripts/rehearse-release-images.sh
          --confirm-isolated
          --api-image "$API_REPOSITORY:$RELEASE_TAG"
          --web-image "$WEB_REPOSITORY:$RELEASE_TAG"
          --version "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --channel "${{ inputs.channel }}"
      - name: Publish only the already rehearsed images
        id: published
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish_image() {
            local repository="$1"
            local output digest sha_digest
            output="$(docker push "$repository:$RELEASE_TAG" 2>&1)"
            printf '%s\n' "$output" >&2
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$output" | tail -n 1)"
            test -n "$digest"
            output="$(docker push "$repository:sha-$GITHUB_SHA" 2>&1)"
            printf '%s\n' "$output" >&2
            sha_digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$output" | tail -n 1)"
            test "$sha_digest" = "$digest"
            printf '%s' "$digest"
          }
          api_digest="$(publish_image "$API_REPOSITORY")"
          web_digest="$(publish_image "$WEB_REPOSITORY")"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "web_digest=$web_digest" >> "$GITHUB_OUTPUT"
      - name: Attest API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest Web image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WEB_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Generate and validate immutable release assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          test -f release-output/installer-materials.tar
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -m release.cli validate-deployment-contract \
            --contract release-output/deployment-contract.json \
            --installer-materials release-output/installer-materials.tar
          python -m release.cli generate-manifest \
            --version "$RELEASE_TAG" --channel "${{ inputs.channel }}" \
            --commit "$GITHUB_SHA" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --compatibility-file release/compatibility.json \
            --deployment-contract-file release-output/deployment-contract.json \
            --deployment-root . \
            --installer-materials release-output/installer-materials.tar \
            --output release-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json --updater-version 1.0.0
          python -m release.cli write-checksums \
            --output release-output/checksums.txt \
            release-output/release-manifest.json release-output/deployment-contract.json \
            release-output/installer-materials.tar
          (cd release-output && sha256sum --check checksums.txt)
      - name: Materialize exact OCI layouts without rebuilding
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          portable_source="$RUNNER_TEMP/portable-source"
          rm -rf "$portable_source"
          install -d -m 0700 "$portable_source/authority" "$portable_source/oci"
          for name in release-manifest.json deployment-contract.json installer-materials.tar checksums.txt; do
            install -m 0600 "release-output/$name" "$portable_source/authority/$name"
          done
          postgres_repository="${POSTGRES_IMAGE%@*}"
          postgres_digest="${POSTGRES_IMAGE#*@}"
          redis_repository="${REDIS_IMAGE%@*}"
          redis_digest="${REDIS_IMAGE#*@}"
          export_layout() {
            local role
            local reference
            local layout
            role="$1"
            reference="$2"
            case "$role" in
              api)
                layout="$portable_source/oci/api"
                ;;
              web)
                layout="$portable_source/oci/web"
                ;;
              postgres)
                layout="$portable_source/oci/postgres"
                ;;
              redis)
                layout="$portable_source/oci/redis"
                ;;
              *)
                echo "Unsupported OCI layout role: $role" >&2
                return 2
                ;;
            esac
            if [[ ! "$reference" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "OCI layout reference must use an exact sha256 digest" >&2
              return 2
            fi
            rm -rf -- "$layout"
            crane pull "$reference" "$layout" --format=oci
            test -d "$layout"
            test ! -L "$layout"
            test -f "$layout/oci-layout"
            test ! -L "$layout/oci-layout"
            test -f "$layout/index.json"
            test ! -L "$layout/index.json"
            test -d "$layout/blobs"
            test ! -L "$layout/blobs"
            python -m release.cli normalize-oci-layout \
              --source-root "$portable_source" \
              --layout "$layout" \
              --role "$role" \
              --repository "${reference%@*}" \
              --expected-digest "${reference#*@}" \
              --expected-platform linux/amd64
          }
          export_layout api "$API_REPOSITORY@$API_DIGEST"
          export_layout web "$WEB_REPOSITORY@$WEB_DIGEST"
          export_layout postgres "$POSTGRES_IMAGE"
          export_layout redis "$REDIS_IMAGE"
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          python -m release.cli build-portable \
            --source-root "$portable_source" \
            --output "release-output/$PORTABLE_ASSET" \
            --image "api=$API_REPOSITORY@$API_DIGEST" \
            --image "web=$WEB_REPOSITORY@$WEB_DIGEST" \
            --image "postgres=$postgres_repository@$postgres_digest" \
            --image "redis=$redis_repository@$redis_digest" \
            > release-output/portable-build-receipt.json
      - name: Attest release manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-output/checksums.txt
      - name: Verify published OCI and file attestations
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$API_REPOSITORY@$API_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify release-output/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify release-output/deployment-contract.json \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify release-output/installer-materials.tar \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
      - name: Generate the closed publication plan without mutation
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          python -m release.cli plan-publication-files \
            --repository "$GITHUB_REPOSITORY" \
            --channel "${{ inputs.channel }}" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --qualification release-output/release-qualification.json \
            --release-notes release-output/release-notes.json \
            --release-notes-markdown release-output/release-notes.md \
            --asset-directory release-output \
            --portable "release-output/$PORTABLE_ASSET" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-output/publication-plan.json
          OPERATION=portable python -m scripts.release_authority \
            > release-output/portable-pipeline-authority.json
          test "$(jq -r '.external_mutation_mode' release-output/publication-plan.json)" = "PLAN_ONLY"
      - name: Create the immutable annotated RC tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "AniMemo $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create an unpublished GitHub Draft Pre-release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$RELEASE_TAG" --arg name "AniMemo $RELEASE_TAG" \
            --rawfile body release-output/release-notes.md \
            '{tag_name:$tag,name:$name,body:$body,
              draft:true,prerelease:true,make_latest:"false"}' \
            > "$RUNNER_TEMP/draft-create-request.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --input "$RUNNER_TEMP/draft-create-request.json" \
            > "$RUNNER_TEMP/draft-release.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == true and .prerelease == true
             and .immutable == false' \
            "$RUNNER_TEMP/draft-release.json" >/dev/null
          release_id="$(jq -r '.id' "$RUNNER_TEMP/draft-release.json")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Upload and read back the complete Draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          gh release upload "$RELEASE_TAG" \
            release-output/release-manifest.json release-output/deployment-contract.json \
            release-output/installer-materials.tar release-output/checksums.txt \
            "release-output/$PORTABLE_ASSET" \
            --repo "$GITHUB_REPOSITORY"
          rm -rf "$RUNNER_TEMP/draft-readback"
          mkdir -p "$RUNNER_TEMP/draft-readback"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --pattern deployment-contract.json \
            --pattern installer-materials.tar --pattern checksums.txt \
            --pattern "$PORTABLE_ASSET" \
            --dir "$RUNNER_TEMP/draft-readback"
          target="$(git rev-list -n 1 "$RELEASE_TAG")"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            | jq --arg target "$target" \
              '{id,tag:.tag_name,target:$target,draft,prerelease,body,assets:[.assets[]|{name,size,digest}]}' \
              > "$RUNNER_TEMP/draft-metadata.json"
          python scripts/release_publication.py verify-draft \
            --plan release-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/draft-metadata.json" \
            --download-directory "$RUNNER_TEMP/draft-readback" \
            --notes-file release-output/release-notes.md
      - name: Publish only the fully verified Draft Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_ID: ${{ steps.draft_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false \
            > "$RUNNER_TEMP/published-release.json"
          jq -e --arg tag "$RELEASE_TAG" --arg id "$RELEASE_ID" \
            '.id == ($id | tonumber) and .tag_name == $tag and .draft == false
             and .prerelease == true and .immutable == true' \
            "$RUNNER_TEMP/published-release.json" >/dev/null
      - name: Verify the public RC without authenticated asset transport
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          rm -rf "$RUNNER_TEMP/public-readback"
          mkdir -p "$RUNNER_TEMP/public-readback"
          public_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          env -u GH_TOKEN curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' "$public_api" \
            > "$RUNNER_TEMP/public-release.json"
          target="$(git rev-list -n 1 "$RELEASE_TAG")"
          jq --arg target "$target" \
            '{id,tag:.tag_name,target:$target,draft,prerelease,body,assets:[.assets[]|{name,size,digest}]}' \
            "$RUNNER_TEMP/public-release.json" > "$RUNNER_TEMP/public-metadata.json"
          for name in release-manifest.json deployment-contract.json installer-materials.tar checksums.txt "$PORTABLE_ASSET"; do
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' \
              "$RUNNER_TEMP/public-release.json")"
            test -n "$url"
            env -u GH_TOKEN curl --fail --location --silent --show-error \
              "$url" -o "$RUNNER_TEMP/public-readback/$name"
          done
          python -m release.cli verify-declared-portable \
            --plan release-output/publication-plan.json \
            --payload "$RUNNER_TEMP/public-readback/$PORTABLE_ASSET"
          for subject in release-manifest.json deployment-contract.json installer-materials.tar; do
            gh attestation verify "release-output/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          python scripts/release_publication.py verify-post-publish \
            --plan release-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/public-metadata.json" \
            --download-directory "$RUNNER_TEMP/public-readback" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --public-unauthenticated-assets --attestations-verified \
            > release-output/post-publish-verification.json
      - name: Acquire and export the post-publish immutable Release attestation sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          python scripts/acquire_release_attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --workflow .github/workflows/release.yml \
            --payload "release-output/$PORTABLE_ASSET" \
            --actions-subject "release-manifest=release-output/release-manifest.json" \
            --actions-subject "deployment-contract=release-output/deployment-contract.json" \
            --actions-subject "installer-materials=release-output/installer-materials.tar" \
            --actions-subject "api-image=oci://$API_REPOSITORY@$API_DIGEST" \
            --actions-subject "web-image=oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --output "release-output/animemo-$RELEASE_TAG-release-attestation.json" \
            > release-output/release-attestation-acquisition-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-metadata-${{ needs.preflight.outputs.release_tag }}
          path: |
            release-output/release-qualification.json
            release-output/release-notes.json
            release-output/release-notes.md
            release-output/publication-plan.json
            release-output/post-publish-verification.json
            release-output/portable-build-receipt.json
            release-output/portable-pipeline-authority.json
            release-output/release-attestation-acquisition-receipt.json
            release-output/animemo-${{ needs.preflight.outputs.release_tag }}-release-attestation.json
          if-no-files-found: error
          retention-days: 90
