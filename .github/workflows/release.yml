name: Release Producer

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit release operation: qualify creates evidence; publish consumes one exact qualification run"
        required: true
        default: qualify
        type: choice
        options: [qualify, publish]
      version_bump:
        description: Stable release line increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      channel:
        description: Pre-release channel (Stable is promotion-only)
        required: true
        default: rc
        type: choice
        options: [beta, rc]
      candidate_sha:
        description: Optional exact candidate commit for a read-only dry-run; forbidden for publish
        required: false
        type: string
      intended_main_sha:
        description: Exact main commit intended for this release
        required: true
        type: string
      upgrade_base_sha:
        description: Audited deployed baseline for BASE to CURRENT validation
        required: true
        default: 6452b3dbfff39529c49c2bc69ede1f3d76236eee
        type: string
      qualification_run_id:
        description: Successful Phase A qualification run required for publish
        required: false
        type: string
      metadata_freshness_run_id:
        description: Successful trusted metadata freshness run required for publish
        required: false
        type: string
      candidate_acceptance_receipt_b64url:
        description: Required canonical prepublication Candidate Acceptance receipt for publish
        required: false
        type: string

concurrency:
  group: animemo-release-producer
  cancel-in-progress: false

permissions:
  contents: read

env:
  CRANE_REQUIRED_VERSION: 0.21.9
  API_REPOSITORY: ghcr.io/yanyuhanyue/animemo-api
  WEB_REPOSITORY: ghcr.io/yanyuhanyue/animemo-web

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      target_version: ${{ steps.version.outputs.target_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      previous_stable: ${{ steps.previous.outputs.previous_stable }}
      created_at: ${{ steps.identity.outputs.created_at }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind the dispatch ref to an authorized release candidate
        id: candidate
        env:
          OPERATION: ${{ inputs.operation }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          METADATA_FRESHNESS_RUN_ID: ${{ inputs.metadata_freshness_run_id }}
          CANDIDATE_ACCEPTANCE_RECEIPT_B64URL: ${{ inputs.candidate_acceptance_receipt_b64url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          main_sha="$(git rev-parse origin/main^{commit})"
          test "$INTENDED_MAIN_SHA" = "$main_sha"
          if [[ "$OPERATION" = "qualify" && "$CHANNEL" = "rc" ]]; then
            if [[ -n "$REQUESTED_CANDIDATE_SHA" ]]; then
              echo "RC_QUALIFICATION_REQUIRES_CURRENT_MAIN" >&2
              exit 1
            fi
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          elif [[ "$OPERATION" = "publish" ]]; then
            test -z "$REQUESTED_CANDIDATE_SHA"
            [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$METADATA_FRESHNESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test -n "$CANDIDATE_ACCEPTANCE_RECEIPT_B64URL"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          elif [[ -n "$REQUESTED_CANDIDATE_SHA" ]]; then
            [[ "$REQUESTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$REQUESTED_CANDIDATE_SHA" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$REQUESTED_CANDIDATE_SHA"
          else
            test -z "$REQUESTED_CANDIDATE_SHA"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$main_sha"
            test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          fi
          if [[ "$OPERATION" = "qualify" ]]; then
            test -z "$QUALIFICATION_RUN_ID"
            test -z "$METADATA_FRESHNESS_RUN_ID"
            test -z "$CANDIDATE_ACCEPTANCE_RECEIPT_B64URL"
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --force origin "+$GITHUB_SHA:refs/remotes/origin/release-candidate"
          test "$(git rev-parse refs/remotes/origin/release-candidate^{commit})" = "$GITHUB_SHA"
          test "$UPGRADE_BASE_SHA" != "$GITHUB_SHA"
          git rev-parse --verify "$UPGRADE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$UPGRADE_BASE_SHA" "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        uses: ./.github/actions/setup-pinned-gh-cli
      - name: Verify immutable-release administration-read credential
        if: ${{ inputs.operation == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.ANIMEMO_RELEASE_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          response="$RUNNER_TEMP/immutable-releases-early.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/immutable-releases" > "$response"
          jq -e '
            type == "object" and
            (.enabled | type) == "boolean" and
            (.enforced_by_owner | type) == "boolean" and
            .enabled == true
          ' "$response" >/dev/null
          enforced_by_owner="$(jq -r '.enforced_by_owner' "$response")"
          printf 'Immutable Releases enabled=true enforced_by_owner=%s\n' "$enforced_by_owner"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Prove exact clean candidate identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Resolve deterministic pre-release version
        id: version
        env:
          OPERATION: ${{ inputs.operation }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          CANDIDATE_ACCEPTANCE_RECEIPT_B64URL: ${{ inputs.candidate_acceptance_receipt_b64url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" = "publish" ]]; then
            python -m release.cli decode-candidate-acceptance-receipt \
              --value "$CANDIDATE_ACCEPTANCE_RECEIPT_B64URL" \
              --output "$RUNNER_TEMP/publish-candidate-acceptance-receipt.json" \
              > "$RUNNER_TEMP/publish-candidate-acceptance-result.json"
            test "$(jq -r '.qualification_run_id' "$RUNNER_TEMP/publish-candidate-acceptance-receipt.json")" = \
              "$QUALIFICATION_RUN_ID"
            release_tag="$(jq -r '.candidate_version' "$RUNNER_TEMP/publish-candidate-acceptance-receipt.json")"
            target_version="$(jq -r '.target_version' "$RUNNER_TEMP/publish-candidate-acceptance-receipt.json")"
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-${RELEASE_CHANNEL}\.[1-9][0-9]*$ ]]
            [[ "$target_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "${release_tag%%-*}" = "$target_version"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          else
            git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
            python -m release.cli resolve-version \
              --tags-file "$RUNNER_TEMP/tags.txt" \
              --publication-reservations-file release/publication-reservations.json \
              --bump "$VERSION_BUMP" \
              --channel "$RELEASE_CHANNEL" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Resolve the exact previous Stable notes boundary
        id: previous
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
          python -m release.cli previous-stable \
            --tags-file "$RUNNER_TEMP/tags.txt" --target "$TARGET_VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Reject existing tag or GitHub Release
        if: ${{ inputs.operation == 'qualify' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Freeze and bind the complete Release Notes population
        if: ${{ inputs.operation == 'qualify' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
          PREVIOUS_STABLE: ${{ steps.previous.outputs.previous_stable }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes_base="$UPGRADE_BASE_SHA"
          if [[ -n "$PREVIOUS_STABLE" ]]; then
            release_notes_base="$(git rev-parse "$PREVIOUS_STABLE^{commit}")"
          fi
          git merge-base --is-ancestor "$release_notes_base" "$CANDIDATE_SHA"
          head_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          root="$RUNNER_TEMP/release-notes-preflight"
          install -d -m 0700 "$root"
          python scripts/release_notes_snapshot.py \
            --repository "$GITHUB_REPOSITORY" \
            --range-start "$release_notes_base" \
            --candidate-sha "$CANDIDATE_SHA" \
            --previous-stable "$PREVIOUS_STABLE" \
            --release-tag "$RELEASE_TAG" \
            --target-version "$TARGET_VERSION" \
            --channel "$CHANNEL" \
            --supported-os "Ubuntu 24.04 LTS" \
            --output-input "$root/release-notes-input.json" \
            --output-json "$root/release-notes.json" \
            --output-markdown "$root/release-notes.md" \
            --output-readback "$root/release-notes-readback.json"
          python scripts/release_notes_preflight.py create \
            --root "$root" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$CANDIDATE_SHA" --head-tree "$head_tree" \
            --comparison-base-sha "$release_notes_base" \
            --previous-stable "$PREVIOUS_STABLE" \
            --release-tag "$RELEASE_TAG" --target-version "$TARGET_VERSION" \
            --channel "$CHANNEL"
      - name: Upload the sole run-scoped Release Notes authority
        if: ${{ inputs.operation == 'qualify' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes-preflight/
          if-no-files-found: error
          retention-days: 30
      - name: Record deterministic artifact identity inputs
        id: identity
        shell: bash
        run: echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  full-ci:
    name: full-ci
    if: ${{ inputs.operation == 'qualify' }}
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      comparison_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  full-release-gate:
    name: full-release-gate
    if: ${{ inputs.operation == 'qualify' }}
    needs: preflight
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_sha: ${{ needs.preflight.outputs.candidate_sha }}
      upgrade_base_sha: ${{ inputs.upgrade_base_sha }}
      force_full: true

  performance:
    name: rc-performance
    if: ${{ inputs.operation == 'qualify' && inputs.channel == 'rc' }}
    needs: preflight
    uses: ./.github/workflows/performance.yml

  platform-qualification:
    name: platform-qualification-linux-amd64
    if: ${{ inputs.operation == 'qualify' }}
    needs: [preflight, full-ci, full-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.platform_artifact.outputs.artifact-id }}
      artifact_digest: ${{ format('sha256:{0}', steps.platform_artifact.outputs.artifact-digest) }}
    env:
      CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
      QUALIFICATION_POSTGRES_NAME: animemo-platform-postgres-${{ github.run_id }}-${{ github.run_attempt }}
      ANIMEMO_TEST_DATABASE_URL: postgresql://qualification:qualification-only@127.0.0.1:55432/qualification_source
      ANIMEMO_RESTORE_TEST_DATABASE_URL: postgresql://qualification:qualification-only@127.0.0.1:55432/qualification_target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - name: Prove the exact hosted qualification candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          rehearsal_dir="$RUNNER_TEMP/animemo-platform-rehearsals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$rehearsal_dir"
          echo "REHEARSAL_DIR=$rehearsal_dir" >> "$GITHUB_ENV"
      - name: Bind and acquire exact platform dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Install exact Python and PostgreSQL 16 qualification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r release/requirements.lock -r durability/requirements.lock -r backend/requirements.lock
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          test "$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')" = "16"
          test "$(psql --version | sed -E 's/.* ([0-9]+).*/\1/')" = "16"
      - name: Start the exact PostgreSQL 16 qualification database
        shell: bash
        env:
          PGPASSWORD: qualification-only
        run: |
          set -euo pipefail
          docker run --detach --name "$QUALIFICATION_POSTGRES_NAME" \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=qualification \
            --env POSTGRES_PASSWORD=qualification-only \
            --env POSTGRES_DB=postgres \
            "$POSTGRES_IMAGE"
          if ! timeout --foreground --signal=TERM --kill-after=5s 10m \
            bash scripts/wait-for-stable-postgres.sh; then
            docker logs "$QUALIFICATION_POSTGRES_NAME"
            exit 1
          fi
      - name: Rehearse Fresh Installer domain, production adapters, and Compose contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            installer.tests.test_cli \
            installer.tests.test_runtime \
            scripts.tests.test_installer_operations \
            scripts.tests.test_deployment_updater_contract -v
          python -c "from installer.production import build_runtime; assert build_runtime().__class__.__name__ == 'Installer'"
          cat > "$RUNNER_TEMP/platform-compose.env" <<EOF
          ANIMEMO_API_IMAGE=ghcr.io/yanyuhanyue/animemo-api@sha256:$(printf 'a%.0s' {1..64})
          ANIMEMO_WEB_IMAGE=ghcr.io/yanyuhanyue/animemo-web@sha256:$(printf 'b%.0s' {1..64})
          ANIMEMO_POSTGRES_IMAGE=$POSTGRES_IMAGE
          ANIMEMO_REDIS_IMAGE=$REDIS_IMAGE
          ANIMEMO_LISTEN_HOST=127.0.0.1
          ANIMEMO_LISTEN_PORT=8088
          ANIMEMO_CONFIG_REVISION=11111111-1111-4111-8111-111111111111
          ANIMEMO_INSTANCE_NAME=qualification
          ANIMEMO_INSTANCE_ID=12345678-1234-4234-9234-123456789abc
          ANIMEMO_COMPOSE_PROJECT=animemo-qualification
          ANIMEMO_MANAGED_ENV_PATH=/run/animemo-updater/qualification/managed.env
          ANIMEMO_UPDATER_RUNTIME_ROOT=/run/animemo-updater/qualification
          ANIMEMO_DATA_ROOT=/tmp/animemo-qualification-data
          ANIMEMO_RELEASE_VERSION=v1.1.0-qualification
          ANIMEMO_RELEASE_COMMIT=$CANDIDATE_SHA
          ANIMEMO_RELEASE_CHANNEL=rc
          ANIMEMO_DATABASE_CONTRACT=animemo-db-v1
          ANIMEMO_CONFIGURATION_CONTRACT=animemo-config-v1
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=qualification-only
          EOF
          sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" /run/animemo-updater/qualification
          sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" "$RUNNER_TEMP/platform-compose.env" /run/animemo-updater/qualification/managed.env
          docker compose --project-name animemo-qualification \
            --env-file "$RUNNER_TEMP/platform-compose.env" \
            --file updater/docker-compose.runtime.yml \
            --file deploy/docker-compose.yml config --quiet
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/fresh_install"
          chmod 0600 "$REHEARSAL_DIR/fresh_install"
      - name: Rehearse Restore Runtime against real PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.tests.test_restore \
            scripts.tests.test_restore_postgres -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/logical_restore"
          chmod 0600 "$REHEARSAL_DIR/logical_restore"
      - name: Rehearse Migration Runtime against real PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            scripts.tests.test_durability_migration \
            scripts.tests.test_migration_postgres -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/logical_migration"
          chmod 0600 "$REHEARSAL_DIR/logical_migration"
      - name: Rehearse canonical Updater adoption and handoff
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            updater.tests.test_adoption \
            updater.tests.test_instance_registry \
            updater.tests.test_linux_e2e \
            updater.tests.test_deployment \
            updater.tests.test_executor -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/updater_handoff"
          chmod 0600 "$REHEARSAL_DIR/updater_handoff"
      - name: Rehearse complete Doctor acceptance semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.tests.test_durability_doctor -v
          printf '%s\n' "$CANDIDATE_SHA" > "$REHEARSAL_DIR/doctor_complete"
          chmod 0600 "$REHEARSAL_DIR/doctor_complete"
      - name: Produce exact hosted platform qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 platform-qualification
          python scripts/platform_qualification.py collect \
            --candidate-sha "$CANDIDATE_SHA" \
            --postgres-image "$POSTGRES_IMAGE" \
            --redis-image "$REDIS_IMAGE" \
            --source-database-url "$ANIMEMO_TEST_DATABASE_URL" \
            --target-database-url "$ANIMEMO_RESTORE_TEST_DATABASE_URL" \
            --rehearsal-directory "$REHEARSAL_DIR" \
            --probe-root "$RUNNER_TEMP/animemo-platform-filesystem-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output platform-qualification/platform-qualification.json
          python scripts/platform_qualification.py verify \
            --input platform-qualification/platform-qualification.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
      - id: platform_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-qualification/platform-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup qualification containers and runtime file
        if: always()
        shell: bash
        run: |
          docker rm --force "$QUALIFICATION_POSTGRES_NAME" >/dev/null 2>&1 || true
          sudo rm -f /run/animemo-updater/qualification/managed.env

  release-authority:
    name: release-authority
    if: ${{ always() }}
    needs: [preflight, full-ci, full-release-gate, performance, platform-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.operation == 'qualify' }}
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.operation == 'publish' }}
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Enforce Phase A Release Producer authority
        if: ${{ inputs.operation == 'qualify' }}
        env:
          OPERATION: qualify
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          PLATFORM_QUALIFICATION_RESULT: ${{ needs.platform-qualification.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLATFORM_QUALIFICATION_RESULT" = "success"
          python -m scripts.release_authority
      - name: Download and verify Phase A qualification evidence
        if: ${{ inputs.operation == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_RUN_ID"
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/qualification-archive"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            > "$RUNNER_TEMP/qualification-run.json"
          run_path="$(jq -r '.path // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_name="$(jq -r '.name // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_event="$(jq -r '.event // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_status="$(jq -r '.status // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_conclusion="$(jq -r '.conclusion // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_attempt="$(jq -r '.run_attempt // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_repo="$(jq -r '.repository.full_name // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_head="$(jq -r '.head_sha // empty' "$RUNNER_TEMP/qualification-run.json")"
          run_branch="$(jq -r '.head_branch // empty' "$RUNNER_TEMP/qualification-run.json")"
          test "$run_path" = ".github/workflows/release.yml"
          test "$run_name" = "Release Producer"
          test "$run_event" = "workflow_dispatch"
          test "$run_status" = "completed"
          test "$run_conclusion" = "success"
          test "$run_attempt" = "1"
          test "$run_repo" = "$GITHUB_REPOSITORY"
          test "$run_head" = "${{ needs.preflight.outputs.candidate_sha }}"
          qualification_workflow_ref="$(jq -r '.workflow_ref // empty' "$RUNNER_TEMP/qualification-run.json")"
          if [[ -z "$qualification_workflow_ref" ]]; then
            test -n "$run_branch"
            qualification_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$run_branch"
          fi
          test "$qualification_workflow_ref" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$run_branch"
          printf '%s\n' "$qualification_workflow_ref" > "$RUNNER_TEMP/qualification-workflow-ref.txt"
          printf '%s\n' "$run_head" > "$RUNNER_TEMP/qualification-workflow-sha.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/qualification-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/jobs?per_page=100" \
            > "$RUNNER_TEMP/qualification-jobs.json"
          artifact_count="$(jq --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("release-qualification-" + $id) and (.workflow_run.id|tostring) == $id)] | length' \
            "$RUNNER_TEMP/qualification-artifacts.json")"
          test "$artifact_count" = "1"
          jq -c --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("release-qualification-" + $id) and (.workflow_run.id|tostring) == $id)][0]' \
            "$RUNNER_TEMP/qualification-artifacts.json" \
            > "$RUNNER_TEMP/qualification-artifact.json"
          controller_count="$(jq --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("controller-authority-" + $id) and (.workflow_run.id|tostring) == $id)] | length' \
            "$RUNNER_TEMP/qualification-artifacts.json")"
          test "$controller_count" = "1"
          jq -c --arg id "$QUALIFICATION_RUN_ID" \
            '[.artifacts[] | select(.name == ("controller-authority-" + $id) and (.workflow_run.id|tostring) == $id)][0]' \
            "$RUNNER_TEMP/qualification-artifacts.json" \
            > "$RUNNER_TEMP/controller-artifact.json"
          archive_url="$(jq -r '.archive_download_url // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          metadata_digest="$(jq -r '.digest // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          artifact_expired="$(jq -r '.expired' "$RUNNER_TEMP/qualification-artifact.json")"
          artifact_head="$(jq -r '.workflow_run.head_sha // empty' "$RUNNER_TEMP/qualification-artifact.json")"
          test -n "$archive_url"
          [[ "$metadata_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$artifact_expired" = "false"
          test "$artifact_head" = "${{ needs.preflight.outputs.candidate_sha }}"
          controller_artifact_id="$(jq -r '.id // empty' "$RUNNER_TEMP/controller-artifact.json")"
          controller_archive_url="$(jq -r '.archive_download_url // empty' "$RUNNER_TEMP/controller-artifact.json")"
          controller_metadata_digest="$(jq -r '.digest // empty' "$RUNNER_TEMP/controller-artifact.json")"
          controller_expired="$(jq -r '.expired' "$RUNNER_TEMP/controller-artifact.json")"
          controller_head="$(jq -r '.workflow_run.head_sha // empty' "$RUNNER_TEMP/controller-artifact.json")"
          [[ "$controller_artifact_id" =~ ^[1-9][0-9]*$ ]]
          test -n "$controller_archive_url"
          [[ "$controller_metadata_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$controller_expired" = "false"
          test "$controller_head" = "${{ needs.preflight.outputs.candidate_sha }}"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$archive_url" -o "$RUNNER_TEMP/qualification-archive/evidence.zip"
          actual_digest="sha256:$(sha256sum "$RUNNER_TEMP/qualification-archive/evidence.zip" | awk '{print $1}')"
          test "$actual_digest" = "$metadata_digest"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$controller_archive_url" \
            -o "$RUNNER_TEMP/qualification-archive/controller-authority.zip"
          controller_actual_digest="sha256:$(sha256sum "$RUNNER_TEMP/qualification-archive/controller-authority.zip" | awk '{print $1}')"
          test "$controller_actual_digest" = "$controller_metadata_digest"
          python -m release.cli extract-qualification-artifact \
            --archive "$RUNNER_TEMP/qualification-archive/evidence.zip" \
            --destination "$RUNNER_TEMP/qualification" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --expected-sha256 "$metadata_digest" \
            --require-candidate-contract
          evidence_file="$RUNNER_TEMP/qualification/release-qualification-$QUALIFICATION_RUN_ID.json"
          test -f "$evidence_file"
          platform_file="$RUNNER_TEMP/qualification/platform-qualification.json"
          test -f "$platform_file"
          notes_file="$RUNNER_TEMP/qualification/release-notes.json"
          notes_markdown="$RUNNER_TEMP/qualification/release-notes.md"
          notes_input="$RUNNER_TEMP/qualification/release-notes-input.json"
          notes_readback="$RUNNER_TEMP/qualification/release-notes-readback.json"
          notes_preflight="$RUNNER_TEMP/qualification/release-notes-preflight.json"
          prepublication_file="$RUNNER_TEMP/qualification/prepublication-materials.json"
          installer_materials="$RUNNER_TEMP/qualification/installer-materials.tar"
          deployment_contract="$RUNNER_TEMP/qualification/deployment-contract.json"
          test -f "$notes_file"
          test -f "$notes_markdown"
          test -f "$notes_input"
          test -f "$notes_readback"
          test -f "$notes_preflight"
          test -f "$prepublication_file"
          test -f "$installer_materials"
          test -f "$deployment_contract"
          test "$(jq -r '.schemaVersion' "$prepublication_file")" = "2"
          test "$(jq -r '.candidateSha' "$prepublication_file")" = "${{ needs.preflight.outputs.candidate_sha }}"
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          test "$(jq -r '.candidateTreeSha' "$prepublication_file")" = "$candidate_tree"
          python -m release.cli verify-prepublication-materials \
            --prepublication "$prepublication_file" \
            --installer-materials "$installer_materials" \
            --deployment-contract "$deployment_contract" \
            --expected-candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --expected-candidate-tree-sha "$candidate_tree"
          notes_identity="$(jq -r '.identity // empty' "$notes_file")"
          notes_markdown_sha256="sha256:$(sha256sum "$notes_markdown" | awk '{print $1}')"
          test "$(jq -r '.release_notes.snapshot_identity // empty' "$evidence_file")" = "$notes_identity"
          test "$(jq -r '.release_notes.markdown_sha256 // empty' "$evidence_file")" = "$notes_markdown_sha256"
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          notes_preflight_root="$RUNNER_TEMP/qualification-release-notes-preflight"
          install -d -m 0700 "$notes_preflight_root"
          for name in release-notes-input.json release-notes.json release-notes.md \
            release-notes-readback.json release-notes-preflight.json; do
            install -m 0600 "$RUNNER_TEMP/qualification/$name" \
              "$notes_preflight_root/$name"
          done
          python scripts/release_notes_preflight.py verify \
            --root "$notes_preflight_root" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$QUALIFICATION_RUN_ID" --run-attempt "$run_attempt" \
            --head-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --head-tree "$candidate_tree" \
            --comparison-base-sha "$(jq -er '.context.comparison_base_sha' "$notes_file")" \
            --previous-stable "$(jq -er '.context.previous_stable' "$notes_file")" \
            --release-tag "$(jq -er '.context.release_tag' "$notes_file")" \
            --target-version "$(jq -er '.context.target_version' "$notes_file")" \
            --channel "$(jq -er '.context.channel' "$notes_file")"
          python scripts/platform_qualification.py verify \
            --input "$platform_file" \
            --candidate-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --run-id "$QUALIFICATION_RUN_ID" \
            --run-attempt "$run_attempt" \
            --workflow-path .github/workflows/release.yml
          containing_artifact_id="$(jq -r '.id' "$RUNNER_TEMP/qualification-artifact.json")"
          [[ "$containing_artifact_id" =~ ^[1-9][0-9]*$ ]]
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          verified_state="$RUNNER_TEMP/verified-candidate-state"
          install -d -m 0700 "$verified_state"
          python -m release.cli verify-prepublication-candidate \
            --archive "$RUNNER_TEMP/qualification-archive/evidence.zip" \
            --run-metadata "$RUNNER_TEMP/qualification-run.json" \
            --jobs-metadata "$RUNNER_TEMP/qualification-jobs.json" \
            --artifacts-metadata "$RUNNER_TEMP/qualification-artifacts.json" \
            --containing-artifact-id "$containing_artifact_id" \
            --containing-artifact-api-digest "$metadata_digest" \
            --expected-run-id "$QUALIFICATION_RUN_ID" \
            --expected-source-sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --expected-source-tree "$candidate_tree" \
            --expected-candidate-version "${{ needs.preflight.outputs.release_tag }}" \
            --verified-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --state-root "$verified_state" \
            > "$RUNNER_TEMP/verified-candidate-result.json"
          verified_candidate_digest="$(jq -er '.verifiedCandidateDigest' \
            "$RUNNER_TEMP/verified-candidate-result.json")"
          candidate_input_digest="$(jq -er '.candidateInputDigest' \
            "$RUNNER_TEMP/verified-candidate-result.json")"
          [[ "$verified_candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$candidate_input_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate_root="$verified_state/${candidate_input_digest#sha256:}"
          test -d "$candidate_root" && test ! -L "$candidate_root"
          for role in api web; do
            test -d "$candidate_root/candidate-runtime/oci/$role"
            test ! -L "$candidate_root/candidate-runtime/oci/$role"
          done
          for name in release-manifest.json checksums.txt candidate-input.json \
            verified-candidate.json; do
            test -f "$candidate_root/$name"
            test ! -L "$candidate_root/$name"
          done
          phase_b_request="$RUNNER_TEMP/phase-b-controller-request.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_name "Release Producer" \
            --arg workflow_path ".github/workflows/release.yml" \
            --arg workflow_ref "$qualification_workflow_ref" \
            --arg workflow_sha "$run_head" \
            --arg run_id "$QUALIFICATION_RUN_ID" \
            --argjson run_attempt "$run_attempt" \
            --arg event "workflow_dispatch" \
            --arg candidate_sha "${{ needs.preflight.outputs.candidate_sha }}" \
            --arg candidate_tree "$candidate_tree" \
            --arg upgrade_base_sha "${{ inputs.upgrade_base_sha }}" \
            --arg channel "${{ inputs.channel }}" \
            --arg target_version "${{ needs.preflight.outputs.target_version }}" \
            --arg release_tag "${{ needs.preflight.outputs.release_tag }}" \
            --argjson final_id "$containing_artifact_id" \
            --arg final_digest "$metadata_digest" \
            --argjson controller_id "$controller_artifact_id" \
            --arg controller_digest "$controller_metadata_digest" \
            '{
              repository: $repository,
              workflow: {
                name: $workflow_name,
                path: $workflow_path,
                ref: $workflow_ref,
                sha: $workflow_sha
              },
              run: {id: $run_id, attempt: $run_attempt, event: $event},
              candidate_sha: $candidate_sha,
              candidate_tree: $candidate_tree,
              upgrade_base_sha: $upgrade_base_sha,
              channel: $channel,
              target_version: $target_version,
              release_tag: $release_tag,
              final_artifact: {
                id: $final_id,
                name: ("release-qualification-" + $run_id),
                api_digest: $final_digest
              },
              controller_artifact: {
                id: $controller_id,
                name: ("controller-authority-" + $run_id),
                api_digest: $controller_digest
              }
            }' > "$phase_b_request"
          python -m release.qualification_finalization phase-b \
            --request "$phase_b_request" \
            --artifacts-metadata "$RUNNER_TEMP/qualification-artifacts.json" \
            --archive "$RUNNER_TEMP/qualification-archive/evidence.zip" \
            --controller-archive \
              "$RUNNER_TEMP/qualification-archive/controller-authority.zip" \
            --qualification-directory "$RUNNER_TEMP/qualification" \
            --verified-candidate-directory "$candidate_root" \
            --output "$RUNNER_TEMP/phase-b-controller-verification.json" \
            > "$RUNNER_TEMP/phase-b-controller-verification-result.json"
          test "$(jq -er '.status' "$RUNNER_TEMP/phase-b-controller-verification.json")" = "PASS"
          test "$(jq -er '.candidateBytesRebuildCount' "$RUNNER_TEMP/phase-b-controller-verification.json")" = "0"
          python -m release.cli decode-candidate-acceptance-receipt \
            --value "${{ inputs.candidate_acceptance_receipt_b64url }}" \
            --output "$RUNNER_TEMP/candidate-acceptance-receipt.json" \
            > "$RUNNER_TEMP/candidate-acceptance-identity.json"
          test "$(jq -er '.verified_candidate_digest' \
            "$RUNNER_TEMP/candidate-acceptance-receipt.json")" = \
            "$verified_candidate_digest"
          test "$(jq -er '.candidate_input_digest' \
            "$RUNNER_TEMP/candidate-acceptance-receipt.json")" = \
            "$candidate_input_digest"
          python -m release.cli verify-publish-candidate-input \
            --state-root "$verified_state" \
            --verified-candidate-digest "$verified_candidate_digest" \
            --candidate-acceptance-receipt \
              "$RUNNER_TEMP/candidate-acceptance-receipt.json" \
            --output "$RUNNER_TEMP/publish-candidate-plan.json" \
            > "$RUNNER_TEMP/publish-candidate-plan-result.json"
          test "$(jq -er '.publish_rebuild_count' \
            "$RUNNER_TEMP/publish-candidate-plan.json")" = "0"
          test "$(jq -er '.manifest_generation_count' \
            "$RUNNER_TEMP/publish-candidate-plan.json")" = "0"
          cp "$RUNNER_TEMP/qualification-run.json" "$RUNNER_TEMP/qualification-metadata-run.json"
          cp "$RUNNER_TEMP/qualification-artifact.json" "$RUNNER_TEMP/qualification-metadata-artifact.json"
      - name: Enforce Phase B Release Producer authority
        if: ${{ inputs.operation == 'publish' }}
        env:
          OPERATION: publish
          CHANNEL: ${{ inputs.channel }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_GRAPH_CONTRACT: animemo.release-gate.jobs/v2
        shell: bash
        run: |
          set -euo pipefail
          export QUALIFICATION_RUN_METADATA="$(cat "$RUNNER_TEMP/qualification-metadata-run.json")"
          export QUALIFICATION_ARTIFACT_METADATA="$(cat "$RUNNER_TEMP/qualification-metadata-artifact.json")"
          export QUALIFICATION_ARCHIVE_SHA256="$(jq -r '.digest' "$RUNNER_TEMP/qualification-metadata-artifact.json")"
          export QUALIFICATION_EVIDENCE_SHA256="$(jq -er \
            '.qualificationEvidenceSha256 | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/phase-b-controller-verification.json")"
          export QUALIFICATION_WORKFLOW_REF="$(cat "$RUNNER_TEMP/qualification-workflow-ref.txt")"
          export QUALIFICATION_WORKFLOW_SHA="$(cat "$RUNNER_TEMP/qualification-workflow-sha.txt")"
          export RELEASE_NOTES_IDENTITY="$(jq -r '.identity' "$RUNNER_TEMP/qualification/release-notes.json")"
          export RELEASE_NOTES_MARKDOWN_SHA256="sha256:$(sha256sum "$RUNNER_TEMP/qualification/release-notes.md" | awk '{print $1}')"
          qualification_artifact="$RUNNER_TEMP/qualification/release-qualification-$QUALIFICATION_RUN_ID.json"
          test -d "$RUNNER_TEMP/qualification"
          test ! -L "$RUNNER_TEMP/qualification"
          test -f "$qualification_artifact"
          test ! -L "$qualification_artifact"
          test "$(stat --format='%h' -- "$qualification_artifact")" = "1"
          qualification_size="$(stat --format='%s' -- "$qualification_artifact")"
          [[ "$qualification_size" =~ ^[1-9][0-9]*$ ]]
          (( qualification_size <= 8 * 1024 * 1024 ))
          authority_root="$RUNNER_TEMP/phase-b-authority-input"
          test ! -e "$authority_root"
          test ! -L "$authority_root"
          install -d -m 0700 -- "$authority_root"
          install -m 0600 -- "$qualification_artifact" \
            "$authority_root/qualification-evidence.json"
          cd "$authority_root"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m scripts.release_authority
      - name: Stage the validated release input for Phase B production
        if: ${{ inputs.operation == 'publish' }}
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 validated-release-input
          install -d -m 0700 validated-release-input/qualification-authority
          install -m 0600 \
            "$RUNNER_TEMP/qualification/platform-qualification.json" \
            validated-release-input/platform-qualification.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes.json" \
            validated-release-input/release-notes.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes.md" \
            validated-release-input/release-notes.md
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes-input.json" \
            validated-release-input/release-notes-input.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes-readback.json" \
            validated-release-input/release-notes-readback.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-notes-preflight.json" \
            validated-release-input/release-notes-preflight.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/release-qualification-$QUALIFICATION_RUN_ID.json" \
            validated-release-input/release-qualification.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/prepublication-materials.json" \
            validated-release-input/prepublication-materials.json
          install -m 0600 \
            "$RUNNER_TEMP/qualification/installer-materials.tar" \
            validated-release-input/installer-materials.tar
          install -m 0600 \
            "$RUNNER_TEMP/qualification/deployment-contract.json" \
            validated-release-input/deployment-contract.json
          freshness_qualification="validated-release-input/metadata-freshness-qualification"
          test ! -e "$freshness_qualification" && test ! -L "$freshness_qualification"
          install -d -m 0700 "$freshness_qualification"
          freshness_qualification_members=(
            release-qualification.json
            platform-qualification.json
            release-notes-input.json
            release-notes.json
            release-notes.md
            release-notes-readback.json
            release-notes-preflight.json
            prepublication-materials.json
            installer-materials.tar
            deployment-contract.json
          )
          for name in "${freshness_qualification_members[@]}"; do
            source="validated-release-input/$name"
            test -f "$source" && test ! -L "$source"
            install -m 0600 "$source" "$freshness_qualification/$name"
            cmp "$source" "$freshness_qualification/$name"
          done
          expected_freshness_members="$(printf '%s\n' \
            "${freshness_qualification_members[@]}" | LC_ALL=C sort)"
          actual_freshness_members="$(find "$freshness_qualification" \
            -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          unsafe_freshness_members="$(find "$freshness_qualification" \
            -mindepth 1 -maxdepth 1 ! -type f -print)"
          test "$actual_freshness_members" = "$expected_freshness_members"
          test -z "$unsafe_freshness_members"
          install -m 0600 \
            "$RUNNER_TEMP/candidate-acceptance-receipt.json" \
            validated-release-input/candidate-acceptance-receipt.json
          install -m 0600 \
            "$RUNNER_TEMP/publish-candidate-plan.json" \
            validated-release-input/publish-candidate-plan.json
          for name in evidence.zip controller-authority.zip; do
            install -m 0600 "$RUNNER_TEMP/qualification-archive/$name" \
              "validated-release-input/qualification-authority/$name"
          done
          for name in qualification-run.json qualification-jobs.json \
            qualification-artifacts.json qualification-artifact.json \
            controller-artifact.json phase-b-controller-verification.json; do
            install -m 0600 "$RUNNER_TEMP/$name" \
              "validated-release-input/qualification-authority/$name"
          done
          candidate_input_digest="$(jq -er '.candidate_input_digest' \
            "$RUNNER_TEMP/candidate-acceptance-receipt.json")"
          candidate_root="$RUNNER_TEMP/verified-candidate-state/${candidate_input_digest#sha256:}"
          test -d "$candidate_root" && test ! -L "$candidate_root"
          install -d -m 0700 validated-release-input/verified-candidate-state
          cp -a "$candidate_root" \
            validated-release-input/verified-candidate-state/
          cmp "$candidate_root/candidate-input.json" \
            "validated-release-input/verified-candidate-state/${candidate_input_digest#sha256:}/candidate-input.json"
          cmp "$candidate_root/verified-candidate.json" \
            "validated-release-input/verified-candidate-state/${candidate_input_digest#sha256:}/verified-candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.operation == 'publish' }}
        with:
          name: validated-release-input-${{ github.run_id }}
          path: validated-release-input/
          if-no-files-found: error
          retention-days: 1

  metadata-freshness-authority:
    name: metadata-freshness-authority
    if: ${{ !cancelled() && inputs.operation == 'publish' && needs.preflight.result == 'success' && needs.release-authority.result == 'success' }}
    needs: [preflight, release-authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      qualification_artifact_id: ${{ steps.freshness.outputs.qualification_artifact_id }}
      candidate_tree: ${{ steps.freshness.outputs.candidate_tree }}
      candidate_acceptance_receipt_sha256: ${{ steps.freshness.outputs.candidate_acceptance_receipt_sha256 }}
      candidate_version: ${{ steps.freshness.outputs.candidate_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-input-${{ github.run_id }}
          path: validated-release-input
      - name: Authenticate exact trusted freshness producer and artifact
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHNESS_RUN_ID: ${{ inputs.metadata_freshness_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          INTENDED_MAIN_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CANDIDATE_ACCEPTANCE_RECEIPT_B64URL: ${{ inputs.candidate_acceptance_receipt_b64url }}
          CANDIDATE_VERSION: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRESHNESS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INTENDED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$INTENDED_MAIN_SHA"
          test "$(git rev-parse HEAD^{commit})" = "$INTENDED_MAIN_SHA"
          test -n "$CANDIDATE_ACCEPTANCE_RECEIPT_B64URL"
          python -m release.cli decode-candidate-acceptance-receipt \
            --value "$CANDIDATE_ACCEPTANCE_RECEIPT_B64URL" \
            --output "$RUNNER_TEMP/passed-candidate-acceptance-receipt.json" \
            > "$RUNNER_TEMP/passed-candidate-receipt-identity.json"
          candidate_receipt_sha256="$(jq -er '.sha256' "$RUNNER_TEMP/passed-candidate-receipt-identity.json")"
          test "$(jq -er '.candidateVersion' "$RUNNER_TEMP/passed-candidate-receipt-identity.json")" = "$CANDIDATE_VERSION"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer $GH_TOKEN"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --location --silent --show-error "${headers[@]}" \
            "$api/actions/runs/$FRESHNESS_RUN_ID" \
            -o "$RUNNER_TEMP/freshness-run.json"
          curl --fail --location --silent --show-error "${headers[@]}" \
            "$api/actions/runs/$QUALIFICATION_RUN_ID/artifacts?per_page=100" \
            -o "$RUNNER_TEMP/qualification-artifacts.json"
          qualification_artifact_id="$(jq -er --arg id "$QUALIFICATION_RUN_ID" --arg sha "$INTENDED_MAIN_SHA" '
            [.artifacts[] | select(
              .name == ("release-qualification-" + $id) and
              (.workflow_run.id | tostring) == $id and
              .workflow_run.head_sha == $sha and
              .expired == false and
              (.digest | test("^sha256:[0-9a-f]{64}$"))
            )] as $matches |
            if ($matches | length) == 1 then ($matches[0].id | tostring) else error("qualification artifact cardinality") end
          ' "$RUNNER_TEMP/qualification-artifacts.json")"
          [[ "$qualification_artifact_id" =~ ^[1-9][0-9]*$ ]]
          curl --fail --location --silent --show-error "${headers[@]}" \
            "$api/actions/runs/$FRESHNESS_RUN_ID/artifacts?per_page=100" \
            -o "$RUNNER_TEMP/freshness-artifacts.json"
          python -m release.cli validate-freshness-run-metadata \
            --run-metadata "$RUNNER_TEMP/freshness-run.json" \
            --artifacts-metadata "$RUNNER_TEMP/freshness-artifacts.json" \
            --expected-run-id "$FRESHNESS_RUN_ID" \
            --expected-sha "$INTENDED_MAIN_SHA" \
            > "$RUNNER_TEMP/freshness-artifact.json"
          archive_url="$(jq -r '.archiveDownloadUrl' "$RUNNER_TEMP/freshness-artifact.json")"
          metadata_digest="$(jq -r '.digest' "$RUNNER_TEMP/freshness-artifact.json")"
          mkdir "$RUNNER_TEMP/freshness-archive"
          curl --fail --location --silent --show-error "${headers[@]}" \
            "$archive_url" -o "$RUNNER_TEMP/freshness-archive/evidence.zip"
          actual_digest="sha256:$(sha256sum "$RUNNER_TEMP/freshness-archive/evidence.zip" | awk '{print $1}')"
          test "$actual_digest" = "$metadata_digest"
          python -m release.cli extract-metadata-freshness-artifact \
            --archive "$RUNNER_TEMP/freshness-archive/evidence.zip" \
            --destination "$RUNNER_TEMP/metadata-freshness" \
            --expected-sha256 "$metadata_digest"
          candidate_tree="$(git rev-parse "$INTENDED_MAIN_SHA^{tree}")"
          python -m release.cli verify-metadata-freshness \
            --artifact-directory "$RUNNER_TEMP/metadata-freshness" \
            --qualification-directory validated-release-input/metadata-freshness-qualification \
            --expected-workflow-run-id "$FRESHNESS_RUN_ID" \
            --expected-candidate-sha "$INTENDED_MAIN_SHA" \
            --expected-candidate-tree "$candidate_tree" \
            --expected-qualification-run-id "$QUALIFICATION_RUN_ID" \
            --expected-qualification-artifact-id "$qualification_artifact_id" \
            --expected-candidate-acceptance-receipt-sha256 "$candidate_receipt_sha256" \
            --expected-candidate-version "$CANDIDATE_VERSION"
          cmp "$RUNNER_TEMP/passed-candidate-acceptance-receipt.json" \
            "$RUNNER_TEMP/metadata-freshness/candidate-acceptance-receipt.json"
          echo "qualification_artifact_id=$qualification_artifact_id" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          echo "candidate_acceptance_receipt_sha256=$candidate_receipt_sha256" >> "$GITHUB_OUTPUT"
          echo "candidate_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Stage exact freshness input for the mutation job
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 validated-metadata-freshness
          find "$RUNNER_TEMP/metadata-freshness" -mindepth 1 -maxdepth 1 -type f \
            -exec install -m 0600 '{}' validated-metadata-freshness/ \;
          test "$(find validated-metadata-freshness -mindepth 1 -maxdepth 1 -type f | wc -l)" = "10"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-metadata-freshness-${{ github.run_id }}
          path: validated-metadata-freshness/
          if-no-files-found: error
          retention-days: 1

  dry-run:
    name: candidate-byte-producer
    if: ${{ always() && inputs.operation == 'qualify' && needs.preflight.result == 'success' && needs.full-ci.result == 'success' && needs.full-release-gate.result == 'success' && ((inputs.channel == 'rc' && needs.performance.result == 'success') || (inputs.channel == 'beta' && needs.performance.result == 'skipped')) && needs.platform-qualification.result == 'success' && needs.release-authority.result == 'success' }}
    needs: [preflight, full-ci, full-release-gate, performance, platform-qualification, release-authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANIMEMO_CANDIDATE_BUILD_AUTHORITY: AUTHORITATIVE_CANDIDATE_BYTE_PRODUCER
    permissions:
      actions: read
      contents: read
    outputs:
      provisional_artifact_id: ${{ steps.provisional_artifact.outputs.artifact-id }}
      provisional_artifact_digest: ${{ format('sha256:{0}', steps.provisional_artifact.outputs.artifact-digest) }}
      candidate_production_receipt_sha256: ${{ steps.candidate_production_receipt.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the exact frozen Release Notes authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-notes-preflight-input
      - name: Prove exact read-only candidate identity
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Bind and acquire exact dry-run dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.0
          driver-opts: |
            image=moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
          cache-binary: false
      - name: Build the digest-pinned release byte producer
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]
          docker buildx build --load --provenance=false --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --file deploy/release-producer.Dockerfile \
            --tag "animemo-release-producer:$GITHUB_SHA" .
          producer_image_id="$(docker image inspect --format '{{.Id}}' "animemo-release-producer:$GITHUB_SHA")"
          [[ "$producer_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ANIMEMO_RELEASE_PRODUCER_IMAGE_ID=$producer_image_id" >> "$GITHUB_ENV"
      - name: Verify release Producer runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-in-release-producer.sh -- \
            bash scripts/release-producer-runtime-readiness.sh check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: false
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Verify and stage the frozen Release Notes authority
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          PREVIOUS_STABLE: ${{ needs.preflight.outputs.previous_stable }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-notes-preflight-input/release-notes-preflight.json
          release_notes_base="$UPGRADE_BASE_SHA"
          if [[ -n "$PREVIOUS_STABLE" ]]; then
            release_notes_base="$(git rev-parse "$PREVIOUS_STABLE^{commit}")"
          fi
          git merge-base --is-ancestor "$release_notes_base" "$CANDIDATE_SHA"
          head_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          python scripts/release_notes_preflight.py verify \
            --root release-notes-preflight-input \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$CANDIDATE_SHA" --head-tree "$head_tree" \
            --comparison-base-sha "$release_notes_base" \
            --previous-stable "$PREVIOUS_STABLE" \
            --release-tag "$RELEASE_TAG" --target-version "$TARGET_VERSION" \
            --channel "${{ inputs.channel }}"
          output="$RUNNER_TEMP/animemo-release-producer-output"
          install -d -m 0700 "$output"
          find release-notes-preflight-input -mindepth 1 -maxdepth 1 -type f \
            -exec install -m 0600 '{}' "$output/" \;
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-qualification-input
      - name: Bind the hosted platform qualification into Installer materials
        env:
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          bash scripts/run-in-release-producer.sh \
            CANDIDATE_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT -- bash -seu <<'ANIMEMO_PRODUCER'
          python scripts/platform_qualification.py verify \
            --input platform-qualification-input/platform-qualification.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
          install -m 0644 \
            platform-qualification-input/platform-qualification.json \
            release/platform-qualification.json
          ANIMEMO_PRODUCER
      - name: Bind the exact byte-producing toolchain
        env:
          BUILDX_NODES: ${{ steps.buildx.outputs.nodes }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker buildx version | awk '{print $2}')" = "v0.36.0"
          test "$(jq -er 'length == 1 and .[0].buildkit == "v0.32.0"' <<<"$BUILDX_NODES")" = "true"
          test -n "${ImageOS:-}" && test -n "${ImageVersion:-}"
          bash scripts/run-in-release-producer.sh \
            BUILDX_NODES CANDIDATE_SHA RUNNER_OS RUNNER_ARCH ImageOS ImageVersion \
            -- bash -seu <<'ANIMEMO_PRODUCER'
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.12.10"
          test "$(go version | awk '{print $3}')" = "go1.26.6"
          test "$(gh --version | awk 'NR == 1 {print $3}')" = "2.97.0"
          test "$(crane version)" = "0.21.9"
          test "$(jq --version)" = "jq-1.8.1"
          test "$(jq -er '.githubHostedRunner.label' release/producer-toolchain.lock.json)" = "ubuntu-24.04"
          test "$(jq -er '.githubHostedRunner.observationOnly' release/producer-toolchain.lock.json)" = "true"
          test "$(jq -er '.byteAuthority.python.hostedRuntimeVersion' release/producer-toolchain.lock.json)" = "3.12.10"
          test "$(jq -er '.byteAuthority.go.version' release/producer-toolchain.lock.json)" = "1.26.6"
          test "$(jq -er '.byteAuthority.buildx.version' release/producer-toolchain.lock.json)" = "v0.36.0"
          test "$(jq -er '.byteAuthority.buildkit.version' release/producer-toolchain.lock.json)" = "v0.32.0"
          lock_sha256="$(sha256sum release/producer-toolchain.lock.json | awk '{print $1}')"
          dockerfile_sha256="$(sha256sum deploy/release-producer.Dockerfile | awk '{print $1}')"
          jq -n \
            --arg schema_version "animemo.release-producer-toolchain-receipt.v1" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg runner_label "ubuntu-24.04" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg image_os "$ImageOS" \
            --arg image_version "$ImageVersion" \
            --arg python_version "$(python -c 'import platform; print(platform.python_version())')" \
            --arg go_version "$(go version | awk '{print $3}')" \
            --arg buildx_version "$(jq -er '.byteAuthority.buildx.version' release/producer-toolchain.lock.json)" \
            --arg buildkit_version "$(jq -er '.[0].buildkit' <<<"$BUILDX_NODES")" \
            --arg buildkit_image "moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2" \
            --arg backend_image "python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31" \
            --arg node_image "node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43" \
            --arg npm_version "12.0.2" \
            --arg npm_integrity "sha512-uIXokLlBj6FpNUTQX1PmT5pz7BlIN9QlixX+zdaSNHsd0qUXsbDLr50xzY6Sw7cJVr0uzHKDOle0swmPW/p5Qw==" \
            --arg producer_image_id "$ANIMEMO_RELEASE_PRODUCER_IMAGE_ID" \
            --arg producer_dockerfile_sha256 "sha256:$dockerfile_sha256" \
            --arg lock_sha256 "sha256:$lock_sha256" \
            '{schemaVersion:$schema_version,candidateSha:$candidate_sha,runner:{label:$runner_label,os:$runner_os,arch:$runner_arch,imageOS:$image_os,imageVersion:$image_version,observationOnly:true},byteAuthority:{releaseProducer:{imageId:$producer_image_id,dockerfileSha256:$producer_dockerfile_sha256},python:$python_version,go:$go_version,buildx:$buildx_version,buildkit:$buildkit_version,buildkitImage:$buildkit_image,backendImage:$backend_image,nodeImage:$node_image,npm:{version:$npm_version,integrity:$npm_integrity}},toolchainLockSha256:$lock_sha256}' \
            > "$RUNNER_TEMP/release-producer-toolchain-receipt.json"
          install -d -m 0700 release-output
          install -m 0600 "$RUNNER_TEMP/release-producer-toolchain-receipt.json" \
            release-output/release-producer-toolchain-receipt.json
          ANIMEMO_PRODUCER
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.21.9
      - name: Prepare closed Candidate OCI roots
        shell: bash
        run: |
          bash scripts/run-in-release-producer.sh CRANE_REQUIRED_VERSION -- bash -seu <<'ANIMEMO_PRODUCER'
          test "$(crane version)" = "$CRANE_REQUIRED_VERSION"
          install -d -m 0700 "$RUNNER_TEMP/candidate-runtime/oci"
          ANIMEMO_PRODUCER
      - name: Build API OCI artifact without publishing
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          outputs: type=oci,dest=${{ runner.temp }}/candidate-runtime/oci/api,tar=false
          provenance: false
          sbom: false
          tags: animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Build Web OCI artifact without publishing
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          outputs: type=oci,dest=${{ runner.temp }}/candidate-runtime/oci/web,tar=false
          provenance: false
          sbom: false
          tags: animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            ANIMEMO_VERSION=${{ needs.preflight.outputs.release_tag }}
            ANIMEMO_COMMIT=${{ needs.preflight.outputs.candidate_sha }}
            ANIMEMO_CHANNEL=${{ inputs.channel }}
      - name: Start and accept the exact locally built API and Web images
        shell: bash
        run: >-
          bash scripts/rehearse-release-images.sh
          --confirm-isolated
          --api-image "animemo-release-api:${{ needs.preflight.outputs.candidate_sha }}"
          --web-image "animemo-release-web:${{ needs.preflight.outputs.candidate_sha }}"
          --version "${{ needs.preflight.outputs.release_tag }}"
          --commit "${{ needs.preflight.outputs.candidate_sha }}"
          --channel "${{ inputs.channel }}"
      - name: Close and verify all four Candidate OCI layouts
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          bash scripts/run-in-release-producer.sh \
            API_DIGEST WEB_DIGEST API_REPOSITORY WEB_REPOSITORY \
            POSTGRES_IMAGE REDIS_IMAGE -- bash -seu <<'ANIMEMO_PRODUCER'
          root="$RUNNER_TEMP/candidate-runtime"
          materialize_dependency() {
            local role="$1"
            local reference="$2"
            [[ "$reference" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
            local layout="$root/oci/$role"
            test ! -e "$layout" && test ! -L "$layout"
            crane pull "$reference" "$layout" --format=oci
            test -d "$layout" && test ! -L "$layout"
            test -f "$layout/oci-layout" && test ! -L "$layout/oci-layout"
            test -f "$layout/index.json" && test ! -L "$layout/index.json"
            test -d "$layout/blobs" && test ! -L "$layout/blobs"
          }
          materialize_dependency postgres "$POSTGRES_IMAGE"
          materialize_dependency redis "$REDIS_IMAGE"
          python -m release.cli normalize-candidate-oci-layout \
            --source-root "$root" --layout "$root/oci/api" --role api \
            --repository "$API_REPOSITORY" --expected-digest "$API_DIGEST"
          python -m release.cli normalize-candidate-oci-layout \
            --source-root "$root" --layout "$root/oci/web" --role web \
            --repository "$WEB_REPOSITORY" --expected-digest "$WEB_DIGEST"
          python -m release.cli normalize-candidate-oci-layout \
            --source-root "$root" --layout "$root/oci/postgres" --role postgres \
            --repository "${POSTGRES_IMAGE%@*}" \
            --expected-digest "${POSTGRES_IMAGE#*@}"
          python -m release.cli normalize-candidate-oci-layout \
            --source-root "$root" --layout "$root/oci/redis" --role redis \
            --repository "${REDIS_IMAGE%@*}" \
            --expected-digest "${REDIS_IMAGE#*@}"
          cp -a "$root" release-output/candidate-runtime
          ANIMEMO_PRODUCER
      - name: Generate and validate manifest, checksums, and unsigned provenance input plan
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          bash scripts/run-in-release-producer.sh \
            RELEASE_TAG CREATED_AT API_DIGEST WEB_DIGEST CANDIDATE_SHA CHANNEL \
            -- bash -seu <<'ANIMEMO_PRODUCER'
          formal_pretrust_work="release-output/.formal-pretrust-work"
          test ! -e "$formal_pretrust_work"
          test ! -L "$formal_pretrust_work"
          install -d -m 0700 "$formal_pretrust_work"
          bash scripts/release-producer-runtime-readiness.sh build-attestation-verifier
          test -x release/release_attestation_verifier/offline-release-verifier
          test -s "$formal_pretrust_work/formal-release-verifier.exe"
          python -m release.cli build-initial-trust-kit \
            --verifier release/release_attestation_verifier/offline-release-verifier \
            --output "$formal_pretrust_work/initial-trust-kit"
          python -B -m scripts.formal_windows_pretrust build
          mkdir -p release-output
          install -m 0600 \
            "$formal_pretrust_work/initial-trust-kit/initial-trust-bootstrap.json" \
            release-output/initial-trust-bootstrap.json
          rm -rf "$RUNNER_TEMP/release-wheelhouse"
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --require-hashes \
            --dest "$RUNNER_TEMP/release-wheelhouse" \
            -r release/requirements.lock -r durability/requirements.lock
          python -m release.cli build-installer-materials \
            --root . --wheelhouse "$RUNNER_TEMP/release-wheelhouse" \
            --initial-trust-kit "$formal_pretrust_work/initial-trust-kit" \
            --formal-windows-pretrust-kit \
              "$formal_pretrust_work/formal-windows-pretrust-v1" \
            --output release-output/installer-materials.tar
          python -B -m scripts.formal_windows_pretrust inspect-installer-materials \
            > "$RUNNER_TEMP/formal-windows-pretrust-binding.json"
          rm -rf "$formal_pretrust_work"
          tar --extract --to-stdout --file release-output/installer-materials.tar scripts/closed_runtime_inventory.py | cmp - scripts/closed_runtime_inventory.py
          tar --extract --to-stdout --file release-output/installer-materials.tar \
            release/platform-qualification.json | cmp - release/platform-qualification.json
          clean_materials="$RUNNER_TEMP/animemo-clean-stage0-materials"
          clean_runtime="$RUNNER_TEMP/animemo-clean-stage0-runtime"
          rm -rf "$clean_materials" "$clean_runtime"
          install -d -m 0700 "$clean_materials"
          tar --extract --file release-output/installer-materials.tar \
            --directory "$clean_materials" --no-same-owner
          python3 -m venv "$clean_runtime"
          if "$clean_runtime/bin/python" -P -B -c 'import cramjam' 2>/dev/null; then
            echo "clean Stage-0 runtime unexpectedly inherited release dependencies" >&2
            exit 1
          fi
          /usr/bin/env -i HOME="$RUNNER_TEMP" PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$clean_runtime/bin/python" -P -B -m pip install \
            --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: \
            --require-hashes \
            --find-links "$clean_materials/wheelhouse" \
            -r "$clean_materials/release/requirements.lock" \
            -r "$clean_materials/durability/requirements.lock"
          /usr/bin/env -i -C "$clean_materials" \
            HOME="$RUNNER_TEMP" PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONPATH="$clean_materials" PYTHONSAFEPATH=1 \
            "$clean_runtime/bin/python" -P -B -m installer --help >/dev/null
          python -m release.cli generate-deployment-contract \
            --root . --installer-materials release-output/installer-materials.tar \
            --output release-output/deployment-contract.json
          candidate_tree="$(git rev-parse '${{ needs.preflight.outputs.candidate_sha }}^{tree}')"
          python -m release.cli build-prepublication-materials \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --candidate-tree-sha "$candidate_tree" \
            --output release-output/prepublication-materials.json
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$CANDIDATE_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          test "$(jq -er '.formalWindowsPretrust.kitIdentity' \
            release-output/prepublication-materials.json)" = \
            "$(jq -er '.kitIdentity' \
              "$RUNNER_TEMP/formal-windows-pretrust-binding.json")"
          test "$(jq -er '.formalWindowsPretrust.sourceProfileIdentity' \
            release-output/prepublication-materials.json)" = \
            "$(jq -er '.sourceProfileIdentity' \
              "$RUNNER_TEMP/formal-windows-pretrust-binding.json")"
          python -m release.cli generate-manifest \
            --version "$RELEASE_TAG" --channel "$CHANNEL" \
            --commit "$CANDIDATE_SHA" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --compatibility-file release/compatibility.json \
            --deployment-contract-file release-output/deployment-contract.json \
            --deployment-root . \
            --installer-materials release-output/installer-materials.tar \
            --output release-output/release-manifest.json
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json
          python -m release.cli write-checksums \
            --output release-output/checksums.txt \
            release-output/release-manifest.json release-output/deployment-contract.json \
            release-output/installer-materials.tar
          (cd release-output && sha256sum --check checksums.txt)
          python -m release.cli generate-provenance-plan \
            --version "$RELEASE_TAG" --commit "$CANDIDATE_SHA" --created-at "$CREATED_AT" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-output/provenance-plan.unsigned.json
          if [[ "$CHANNEL" = "rc" ]]; then
            git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/tags.txt"
            python -m release.cli promote-manifest \
              --rc-manifest release-output/release-manifest.json \
              --tags-file "$RUNNER_TEMP/tags.txt" --created-at "$CREATED_AT" \
              --provenance-source-commit "$CANDIDATE_SHA" \
              --output release-output/stable-manifest.dry-run.json
            test "$(jq -r '.release.commit' release-output/release-manifest.json)" = \
              "$(jq -r '.release.commit' release-output/stable-manifest.dry-run.json)" # RC_COMMIT == STABLE_COMMIT
            test "$(jq -r '.images.api.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.api.digest' release-output/stable-manifest.dry-run.json)" # RC_API_DIGEST == STABLE_API_DIGEST
            test "$(jq -r '.images.web.digest' release-output/release-manifest.json)" = \
              "$(jq -r '.images.web.digest' release-output/stable-manifest.dry-run.json)" # RC_WEB_DIGEST == STABLE_WEB_DIGEST
            test "$(jq -cS '.deployment' release-output/release-manifest.json)" = \
              "$(jq -cS '.deployment' release-output/stable-manifest.dry-run.json)" # RC_DEPLOYMENT == STABLE_DEPLOYMENT
            test "$(jq -cS '.artifacts.deploymentContract' release-output/release-manifest.json)" = \
              "$(jq -cS '.artifacts.deploymentContract' release-output/stable-manifest.dry-run.json)"
          fi
          ANIMEMO_PRODUCER
      - name: Stage and close the non-authoritative Candidate production transaction
        id: candidate_production_receipt
        env:
          OPERATION: produce
          CHANNEL: ${{ inputs.channel }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ANIMEMO_CANDIDATE_BUILD_AUTHORITY" = \
            "AUTHORITATIVE_CANDIDATE_BYTE_PRODUCER"
          bash scripts/run-in-release-producer.sh \
            OPERATION CHANNEL WORKFLOW_REF WORKFLOW_SHA RUN_ID \
            RUN_ATTEMPT EVENT_NAME CANDIDATE_SHA UPGRADE_BASE_SHA TARGET_VERSION \
            RELEASE_TAG CREATED_AT -- bash -seu <<'ANIMEMO_PRODUCER'
          candidate_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          export CANDIDATE_TREE="$candidate_tree"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$CANDIDATE_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -c 'from pathlib import Path; from release.producer_toolchain import validate_producer_toolchain_receipt; validate_producer_toolchain_receipt(Path("release-output/release-producer-toolchain-receipt.json"), expected_candidate_sha="'"$CANDIDATE_SHA"'")'
          test "$(jq -er '.byteAuthority.releaseProducer.imageId' release-output/release-producer-toolchain-receipt.json)" = \
            "$ANIMEMO_RELEASE_PRODUCER_IMAGE_ID"
          test -z "$(find release-qualification -mindepth 1 -print -quit)"
          python scripts/platform_qualification.py verify \
            --input platform-qualification-input/platform-qualification.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml
          install -m 0600 platform-qualification-input/platform-qualification.json \
            release-qualification/platform-qualification.json
          install -m 0600 release-output/release-notes.json \
            release-qualification/release-notes.json
          install -m 0600 release-output/release-notes.md \
            release-qualification/release-notes.md
          install -m 0600 release-output/release-notes-input.json \
            release-qualification/release-notes-input.json
          install -m 0600 release-output/release-notes-readback.json \
            release-qualification/release-notes-readback.json
          install -m 0600 release-output/release-notes-preflight.json \
            release-qualification/release-notes-preflight.json
          install -m 0600 release-output/prepublication-materials.json \
            release-qualification/prepublication-materials.json
          install -m 0600 release-output/installer-materials.tar \
            release-qualification/installer-materials.tar
          install -m 0600 release-output/deployment-contract.json \
            release-qualification/deployment-contract.json
          install -m 0600 release-output/release-manifest.json \
            release-qualification/release-manifest.json
          install -m 0600 release-output/checksums.txt \
            release-qualification/checksums.txt
          install -m 0600 \
            release-output/release-producer-toolchain-receipt.json \
            release-qualification/release-producer-toolchain-receipt.json
          cp -a release-output/candidate-runtime \
            release-qualification/candidate-runtime
          python -m scripts.release_authority
          test -f release-qualification/candidate-production-receipt.json
          test "$(find release-qualification -maxdepth 1 -type f | wc -l)" = "13"
          test "$(find release-qualification -mindepth 1 -maxdepth 1 | wc -l)" = "14"
          test "$(find release-qualification/candidate-runtime -type f | wc -l)" -gt "8"
          ANIMEMO_PRODUCER
          receipt="$RUNNER_TEMP/animemo-release-qualification-output/candidate-production-receipt.json"
          receipt_sha256="sha256:$(sha256sum "$receipt" | awk '{print $1}')"
          [[ "$receipt_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload the short-lived non-authoritative Candidate transaction
        id: provisional_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-materials-${{ github.run_id }}
          path: ${{ runner.temp }}/animemo-release-qualification-output/
          if-no-files-found: error
          retention-days: 3

  qualification-finalizer:
    name: qualification-finalizer
    if: ${{ always() && inputs.operation == 'qualify' && needs.preflight.result == 'success' && needs.full-ci.result == 'success' && needs.full-release-gate.result == 'success' && ((inputs.channel == 'rc' && needs.performance.result == 'success') || (inputs.channel == 'beta' && needs.performance.result == 'skipped')) && needs.platform-qualification.result == 'success' && needs.release-authority.result == 'success' && needs.dry-run.result == 'success' }}
    needs: [preflight, full-ci, full-release-gate, performance, platform-qualification, release-authority, dry-run]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      final_artifact_id: ${{ steps.qualification_artifact.outputs.artifact-id }}
      final_artifact_digest: ${{ format('sha256:{0}', steps.qualification_artifact.outputs.artifact-digest) }}
      candidate_tree: ${{ steps.finalize.outputs.candidate_tree }}
      target_version: ${{ needs.preflight.outputs.target_version }}
      release_tag: ${{ needs.preflight.outputs.release_tag }}
      created_at: ${{ needs.preflight.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline for Qualification finalization
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Verify the provisional Candidate transaction and finalize Qualification v3
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PLATFORM_ARTIFACT_ID: ${{ needs.platform-qualification.outputs.artifact_id }}
          PLATFORM_ARTIFACT_DIGEST: ${{ needs.platform-qualification.outputs.artifact_digest }}
          PROVISIONAL_ARTIFACT_ID: ${{ needs.dry-run.outputs.provisional_artifact_id }}
          PROVISIONAL_ARTIFACT_DIGEST: ${{ needs.dry-run.outputs.provisional_artifact_digest }}
          CANDIDATE_PRODUCTION_RECEIPT_SHA256: ${{ needs.dry-run.outputs.candidate_production_receipt_sha256 }}
          TARGET_VERSION: ${{ needs.preflight.outputs.target_version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          CREATED_AT: ${{ needs.preflight.outputs.created_at }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLATFORM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PLATFORM_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$PROVISIONAL_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROVISIONAL_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_PRODUCTION_RECEIPT_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate_tree="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$CANDIDATE_SHA"
          artifacts_metadata="$RUNNER_TEMP/qualification-artifacts.json"
          provisional_archive="$RUNNER_TEMP/candidate-materials.zip"
          finalizer_request="$RUNNER_TEMP/qualification-finalizer-request.json"
          final_output="$RUNNER_TEMP/release-qualification-final"
          test ! -e "$final_output"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "$artifacts_metadata"
          jq -e --argjson id "$PROVISIONAL_ARTIFACT_ID" \
            '[.artifacts[] | select(.id == $id)] | length == 1' \
            "$artifacts_metadata" >/dev/null
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVISIONAL_ARTIFACT_ID}/zip" \
            > "$provisional_archive"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg workflow_path ".github/workflows/release.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg candidate_tree "$candidate_tree" \
            --arg upgrade_base_sha "$UPGRADE_BASE_SHA" \
            --arg channel "$CHANNEL" \
            --arg target_version "$TARGET_VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg created_at "$CREATED_AT" \
            --arg receipt_sha256 "$CANDIDATE_PRODUCTION_RECEIPT_SHA256" \
            --argjson platform_id "$PLATFORM_ARTIFACT_ID" \
            --arg platform_digest "$PLATFORM_ARTIFACT_DIGEST" \
            --argjson provisional_id "$PROVISIONAL_ARTIFACT_ID" \
            --arg provisional_digest "$PROVISIONAL_ARTIFACT_DIGEST" \
            --argjson needs "$NEEDS_JSON" \
            '{
              repository: $repository,
              workflow: {
                name: $workflow_name,
                path: $workflow_path,
                ref: $workflow_ref,
                sha: $workflow_sha
              },
              run: {id: $run_id, attempt: $run_attempt, event: $event},
              current_job_id: "qualification-finalizer",
              required_result_jobs: [
                "preflight",
                "full-ci",
                "full-release-gate",
                "performance",
                "platform-qualification",
                "release-authority",
                "dry-run"
              ],
              needs: $needs,
              candidate_sha: $candidate_sha,
              candidate_tree: $candidate_tree,
              upgrade_base_sha: $upgrade_base_sha,
              channel: $channel,
              target_version: $target_version,
              release_tag: $release_tag,
              created_at: $created_at,
              candidate_production_receipt_sha256: $receipt_sha256,
              platform_artifact: {
                id: $platform_id,
                api_digest: $platform_digest
              },
              provisional_artifact: {
                id: $provisional_id,
                name: ("candidate-materials-" + $run_id),
                api_digest: $provisional_digest
              }
            }' > "$finalizer_request"
          python -m release.qualification_finalization finalize \
            --request "$finalizer_request" \
            --artifacts-metadata "$artifacts_metadata" \
            --archive "$provisional_archive" \
            --output "$final_output" \
            > "$RUNNER_TEMP/qualification-finalization-result.json"
          test "$(jq -er '.status' "$RUNNER_TEMP/qualification-finalization-result.json")" = "PASS"
          test "$(jq -er '.candidateBytesRebuildCount' "$RUNNER_TEMP/qualification-finalization-result.json")" = "0"
          test "$(find "$final_output" -maxdepth 1 -type f | wc -l)" = "15"
          test -f "$final_output/candidate-production-receipt.json"
          test -f "$final_output/candidate-input.json"
          test -f "$final_output/release-qualification-${GITHUB_RUN_ID}.json"
          test -d "$final_output/candidate-runtime"
          test ! -e "$final_output/verified-candidate.json"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"
      - name: Upload the sole final Qualification Artifact
        id: qualification_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/release-qualification-final/
          if-no-files-found: error
          retention-days: 30

  controller-authority:
    name: controller-authority
    if: ${{ always() && inputs.operation == 'qualify' && needs.qualification-finalizer.result == 'success' }}
    needs: [qualification-finalizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Gate exact GitHub CLI security baseline for controller authority
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - name: Build the exact remote controller authority
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALIFICATION_ARTIFACT_ID: ${{ needs.qualification-finalizer.outputs.final_artifact_id }}
          QUALIFICATION_ARTIFACT_DIGEST: ${{ needs.qualification-finalizer.outputs.final_artifact_digest }}
          CANDIDATE_TREE: ${{ needs.qualification-finalizer.outputs.candidate_tree }}
          TARGET_VERSION: ${{ needs.qualification-finalizer.outputs.target_version }}
          RELEASE_TAG: ${{ needs.qualification-finalizer.outputs.release_tag }}
          CREATED_AT: ${{ needs.qualification-finalizer.outputs.created_at }}
          UPGRADE_BASE_SHA: ${{ inputs.upgrade_base_sha }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$QUALIFICATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          artifacts_metadata="$RUNNER_TEMP/controller-artifacts.json"
          qualification_archive="$RUNNER_TEMP/release-qualification.zip"
          controller_request="$RUNNER_TEMP/controller-authority-request.json"
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "$artifacts_metadata"
          jq -e --argjson id "$QUALIFICATION_ARTIFACT_ID" \
            '[.artifacts[] | select(.id == $id)] | length == 1' \
            "$artifacts_metadata" >/dev/null
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}/zip" \
            > "$qualification_archive"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg workflow_path ".github/workflows/release.yml" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg candidate_sha "$GITHUB_SHA" \
            --arg candidate_tree "$CANDIDATE_TREE" \
            --arg upgrade_base_sha "$UPGRADE_BASE_SHA" \
            --arg channel "$CHANNEL" \
            --arg target_version "$TARGET_VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg created_at "$CREATED_AT" \
            --argjson final_id "$QUALIFICATION_ARTIFACT_ID" \
            --arg final_digest "$QUALIFICATION_ARTIFACT_DIGEST" \
            --argjson needs "$NEEDS_JSON" \
            '{
              repository: $repository,
              workflow: {
                name: $workflow_name,
                path: $workflow_path,
                ref: $workflow_ref,
                sha: $workflow_sha
              },
              run: {id: $run_id, attempt: $run_attempt, event: $event},
              current_job_id: "controller-authority",
              required_result_jobs: ["qualification-finalizer"],
              needs: $needs,
              candidate_sha: $candidate_sha,
              candidate_tree: $candidate_tree,
              upgrade_base_sha: $upgrade_base_sha,
              channel: $channel,
              target_version: $target_version,
              release_tag: $release_tag,
              created_at: $created_at,
              final_artifact: {
                id: $final_id,
                name: ("release-qualification-" + $run_id),
                api_digest: $final_digest
              }
            }' > "$controller_request"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" \
            python -m release.qualification_finalization verify \
              --request "$controller_request" \
              --artifacts-metadata "$artifacts_metadata" \
              --archive "$qualification_archive" \
              --output controller-authority \
              > controller-authority-result.json
          test "$(find controller-authority -maxdepth 1 -type f | wc -l)" = "3"
          test -f controller-authority/candidate-input.json
          test -f controller-authority/verified-candidate.json
          test -f controller-authority/controller-authority.json
          test ! -e controller-authority/candidate-runtime
      - name: Upload the small remote controller authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/controller-authority/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish-immutable-prerelease
    if: ${{ !cancelled() && inputs.operation == 'publish' && needs.preflight.result == 'success' && needs.release-authority.result == 'success' && needs.metadata-freshness-authority.result == 'success' }}
    needs: [preflight, release-authority, metadata-freshness-authority]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - name: Gate exact GitHub CLI security baseline
        uses: ./.github/actions/setup-pinned-gh-cli
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-release-input-${{ github.run_id }}
          path: validated-release-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-metadata-freshness-${{ github.run_id }}
          path: validated-metadata-freshness
      - name: Verify and stage exact qualified prepublication materials before mutation
        shell: bash
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' deployment-contract.json \
            candidate-acceptance-receipt.json publish-candidate-plan.json \
            installer-materials.tar platform-qualification.json \
            prepublication-materials.json release-notes.json \
            release-notes.md release-notes-input.json \
            release-notes-readback.json release-notes-preflight.json \
            release-qualification.json | LC_ALL=C sort)"
          actual_files="$(find validated-release-input -maxdepth 1 -type f \
            -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"
          expected_directories="$(printf '%s\n' metadata-freshness-qualification \
            qualification-authority verified-candidate-state | LC_ALL=C sort)"
          actual_directories="$(find validated-release-input -mindepth 1 \
            -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_directories" = "$expected_directories"
          candidate_state="validated-release-input/verified-candidate-state"
          test -d "$candidate_state" && test ! -L "$candidate_state"
          chmod 0700 "$candidate_state"
          find "$candidate_state" -mindepth 1 -maxdepth 1 -type d \
            -exec chmod 0700 {} +
          mismatch() {
            echo "PUBLISH_CANDIDATE_BYTE_MISMATCH" >&2
            exit 1
          }
          python scripts/platform_qualification.py verify \
            --input validated-release-input/platform-qualification.json \
            --candidate-sha "$GITHUB_SHA" \
            --workflow-path .github/workflows/release.yml
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication validated-release-input/prepublication-materials.json \
            --installer-materials validated-release-input/installer-materials.tar \
            --deployment-contract validated-release-input/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -m release.cli verify-metadata-freshness \
            --artifact-directory validated-metadata-freshness \
            --qualification-directory validated-release-input/metadata-freshness-qualification \
            --expected-workflow-run-id "${{ inputs.metadata_freshness_run_id }}" \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree "$candidate_tree" \
            --expected-qualification-run-id "${{ inputs.qualification_run_id }}" \
            --expected-qualification-artifact-id "${{ needs.metadata-freshness-authority.outputs.qualification_artifact_id }}" \
            --expected-candidate-acceptance-receipt-sha256 "${{ needs.metadata-freshness-authority.outputs.candidate_acceptance_receipt_sha256 }}" \
            --expected-candidate-version "${{ needs.metadata-freshness-authority.outputs.candidate_version }}"
          verified_candidate_digest="$(jq -er '.verified_candidate_digest' \
            validated-release-input/candidate-acceptance-receipt.json)"
          candidate_input_digest="$(jq -er '.candidate_input_digest' \
            validated-release-input/candidate-acceptance-receipt.json)"
          candidate_root="$candidate_state/${candidate_input_digest#sha256:}"
          test -d "$candidate_root" && test ! -L "$candidate_root" || mismatch
          python -m release.cli verify-publish-candidate-input \
            --state-root "$candidate_state" \
            --verified-candidate-digest "$verified_candidate_digest" \
            --candidate-acceptance-receipt \
              validated-release-input/candidate-acceptance-receipt.json \
            --output "$RUNNER_TEMP/publish-candidate-plan.json" \
            > "$RUNNER_TEMP/publish-candidate-plan-result.json" || mismatch
          cmp "$RUNNER_TEMP/publish-candidate-plan.json" \
            validated-release-input/publish-candidate-plan.json || mismatch
          test "$(jq -er '.images.api.digest' \
            validated-release-input/publish-candidate-plan.json)" = \
            "$(jq -er '.images.api.digest' "$candidate_root/release-manifest.json")" \
            || mismatch
          test "$(jq -er '.images.web.digest' \
            validated-release-input/publish-candidate-plan.json)" = \
            "$(jq -er '.images.web.digest' "$candidate_root/release-manifest.json")" \
            || mismatch
          test "$(jq -er '.release_manifest_digest' \
            validated-release-input/publish-candidate-plan.json)" = \
            "sha256:$(sha256sum "$candidate_root/release-manifest.json" | awk '{print $1}')" \
            || mismatch
          install -d -m 0700 release-output
          qualification_source="$candidate_root/release-qualification-${{ inputs.qualification_run_id }}.json"
          test -f "$qualification_source" && test ! -L "$qualification_source" \
            || mismatch
          install -m 0600 "$qualification_source" \
            release-output/release-qualification.json
          cmp "$qualification_source" release-output/release-qualification.json \
            || mismatch
          for name in release-notes.json release-notes.md \
            release-notes-input.json release-notes-readback.json \
            release-notes-preflight.json \
            prepublication-materials.json installer-materials.tar deployment-contract.json \
            release-manifest.json checksums.txt candidate-input.json \
            verified-candidate.json; do
            install -m 0600 "$candidate_root/$name" "release-output/$name"
            cmp "$candidate_root/$name" "release-output/$name" || mismatch
          done
          install -m 0600 validated-release-input/candidate-acceptance-receipt.json \
            release-output/candidate-acceptance-receipt.json
          install -m 0600 validated-release-input/publish-candidate-plan.json \
            release-output/publish-candidate-plan.json
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          api_digest="$(jq -er '.images.api.digest' release-output/publish-candidate-plan.json)"
          web_digest="$(jq -er '.images.web.digest' release-output/publish-candidate-plan.json)"
          api_repository="$(jq -er '.images.api.repository' release-output/publish-candidate-plan.json)"
          web_repository="$(jq -er '.images.web.repository' release-output/publish-candidate-plan.json)"
          test "$api_repository" = "$API_REPOSITORY" || mismatch
          test "$web_repository" = "$WEB_REPOSITORY" || mismatch
          postgres_image="$(jq -er '.images.postgres.repository + "@" + .images.postgres.digest' \
            release-output/release-manifest.json)"
          redis_image="$(jq -er '.images.redis.repository + "@" + .images.redis.digest' \
            release-output/release-manifest.json)"
          {
            echo "ANIMEMO_ACCEPTED_CANDIDATE_ROOT=$candidate_root"
            echo "ANIMEMO_ACCEPTED_API_DIGEST=$api_digest"
            echo "ANIMEMO_ACCEPTED_WEB_DIGEST=$web_digest"
            echo "POSTGRES_IMAGE=$postgres_image"
            echo "REDIS_IMAGE=$redis_image"
          } >> "$GITHUB_ENV"
      - name: Recheck immutable release identity immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          INTENDED_MAIN_SHA: ${{ inputs.intended_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$INTENDED_MAIN_SHA" = "$GITHUB_SHA"
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          cmp release-output/publish-candidate-plan.json \
            validated-release-input/publish-candidate-plan.json || {
              echo "PUBLISH_CANDIDATE_BYTE_MISMATCH" >&2
              exit 1
            }
      - name: Recheck immutable release setting immediately before publishing
        env:
          GH_TOKEN: ${{ secrets.ANIMEMO_RELEASE_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          response="$RUNNER_TEMP/immutable-releases-final.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/immutable-releases" > "$response"
          jq -e '
            type == "object" and
            (.enabled | type) == "boolean" and
            (.enforced_by_owner | type) == "boolean" and
            .enabled == true
          ' "$response" >/dev/null
          enforced_by_owner="$(jq -r '.enforced_by_owner' "$response")"
          printf 'Immutable Releases enabled=true enforced_by_owner=%s\n' "$enforced_by_owner"
      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.21.9
      - name: Assert exact crane version
        shell: bash
        run: |
          set -euo pipefail
          test "$(crane version)" = "$CRANE_REQUIRED_VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify metadata freshness TTL immediately before external publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.metadata-freshness-authority.outputs.candidate_tree }}"
          python -m release.cli verify-metadata-freshness \
            --artifact-directory validated-metadata-freshness \
            --qualification-directory validated-release-input/metadata-freshness-qualification \
            --expected-workflow-run-id "${{ inputs.metadata_freshness_run_id }}" \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree "${{ needs.metadata-freshness-authority.outputs.candidate_tree }}" \
            --expected-qualification-run-id "${{ inputs.qualification_run_id }}" \
            --expected-qualification-artifact-id "${{ needs.metadata-freshness-authority.outputs.qualification_artifact_id }}" \
            --expected-candidate-acceptance-receipt-sha256 "${{ needs.metadata-freshness-authority.outputs.candidate_acceptance_receipt_sha256 }}" \
            --expected-candidate-version "${{ needs.metadata-freshness-authority.outputs.candidate_version }}"
      - name: Bind the accepted Candidate digests for the no-rebuild publication
        id: published
        shell: bash
        run: |
          set -euo pipefail
          echo "api_digest=$ANIMEMO_ACCEPTED_API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_digest=$ANIMEMO_ACCEPTED_WEB_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Validate the exact Candidate-accepted release assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          test -f release-output/installer-materials.tar
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m release.cli verify-prepublication-materials \
            --prepublication release-output/prepublication-materials.json \
            --installer-materials release-output/installer-materials.tar \
            --deployment-contract release-output/deployment-contract.json \
            --expected-candidate-sha "$GITHUB_SHA" \
            --expected-candidate-tree-sha "$candidate_tree"
          python -m release.cli validate-deployment-contract \
            --contract release-output/deployment-contract.json \
            --installer-materials release-output/installer-materials.tar
          python -m release.cli validate-manifest \
            --manifest release-output/release-manifest.json
          test "$(jq -er '.release.version' release-output/release-manifest.json)" = \
            "$RELEASE_TAG"
          test "$(jq -er '.release.commit' release-output/release-manifest.json)" = \
            "$GITHUB_SHA"
          test "$(jq -er '.images.api.digest' release-output/release-manifest.json)" = \
            "$API_DIGEST"
          test "$(jq -er '.images.web.digest' release-output/release-manifest.json)" = \
            "$WEB_DIGEST"
          (cd release-output && sha256sum --check checksums.txt)
      - name: Assemble the portable transport from accepted OCI layouts
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          portable_source="$RUNNER_TEMP/portable-source"
          rm -rf "$portable_source"
          install -d -m 0700 "$portable_source" "$portable_source/authority"
          cp -a "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT/candidate-runtime/oci" \
            "$portable_source/oci"
          for role in api web postgres redis; do
            layout="$portable_source/oci/$role"
            test -d "$layout" && test ! -L "$layout"
            test -f "$layout/oci-layout" && test ! -L "$layout/oci-layout"
            test -f "$layout/index.json" && test ! -L "$layout/index.json"
            test -d "$layout/blobs" && test ! -L "$layout/blobs"
          done
          for name in release-manifest.json deployment-contract.json installer-materials.tar checksums.txt; do
            install -m 0600 "release-output/$name" "$portable_source/authority/$name"
            cmp "release-output/$name" "$portable_source/authority/$name"
          done
          postgres_repository="${POSTGRES_IMAGE%@*}"
          postgres_digest="${POSTGRES_IMAGE#*@}"
          redis_repository="${REDIS_IMAGE%@*}"
          redis_digest="${REDIS_IMAGE#*@}"
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          python -m release.cli build-portable \
            --source-root "$portable_source" \
            --output "release-output/$PORTABLE_ASSET" \
            --image "api=$API_REPOSITORY@$API_DIGEST" \
            --image "web=$WEB_REPOSITORY@$WEB_DIGEST" \
            --image "postgres=$postgres_repository@$postgres_digest" \
            --image "redis=$redis_repository@$redis_digest" \
            > release-output/portable-build-receipt.json
      - name: Generate the closed publication plan without mutation
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          qualification_source="release-output/release-qualification.json"
          test -f "$qualification_source" && test ! -L "$qualification_source"
          qualification_bytes_sha256="$(sha256sum "$qualification_source" \
            | awk '{print $1}')"
          publication_qualification="$(mktemp "$RUNNER_TEMP/publication-qualification-compat.XXXXXX.json")"
          cleanup_publication_qualification() {
            rm -f -- "$publication_qualification"
          }
          trap cleanup_publication_qualification EXIT
          qualification_identity="$(
            python - "$qualification_source" "$publication_qualification" <<'PY'
          import json
          import stat
          import sys
          from pathlib import Path

          from scripts.release_qualification import validate_qualification_evidence

          source_path = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          source = json.loads(source_path.read_bytes())
          qualification = validate_qualification_evidence(source)
          if qualification["schema"] != "animemo.release-qualification/v3":
              raise SystemExit("unsupported publication Qualification schema")
          qualification_identity = qualification["qualification_sha256"]
          compatibility = dict(qualification)
          compatibility.pop("qualification_sha256")
          compatibility["artifact_sha256"] = qualification_identity
          expected_keys = (
              set(qualification) - {"qualification_sha256"}
          ) | {"artifact_sha256"}
          if set(compatibility) != expected_keys:
              raise SystemExit("publication Qualification projection differs")
          destination_stat = destination.lstat()
          if not stat.S_ISREG(destination_stat.st_mode) or destination_stat.st_nlink != 1:
              raise SystemExit("publication Qualification projection is unsafe")
          destination.write_bytes(
              (json.dumps(compatibility, sort_keys=True, separators=(",", ":")) + "\n").encode(
                  "utf-8"
              )
          )
          print(qualification_identity)
          PY
          )"
          python -m release.cli plan-publication-files \
            --repository "$GITHUB_REPOSITORY" \
            --channel "${{ inputs.channel }}" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --qualification "$publication_qualification" \
            --release-notes release-output/release-notes.json \
            --release-notes-markdown release-output/release-notes.md \
            --asset-directory release-output \
            --portable "release-output/$PORTABLE_ASSET" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-output/publication-plan.json
          cleanup_publication_qualification
          test ! -e "$publication_qualification" && test ! -L "$publication_qualification"
          trap - EXIT
          test "$(sha256sum "$qualification_source" | awk '{print $1}')" = \
            "$qualification_bytes_sha256"
          test "$(jq -er '.qualification_sha256' "$qualification_source")" = \
            "$qualification_identity"
          test "$(jq -er '.qualification_identity' \
            release-output/publication-plan.json)" = "$qualification_identity"
          OPERATION=portable python -m scripts.release_authority \
            > release-output/portable-pipeline-authority.json
          test "$(jq -r '.external_mutation_mode' release-output/publication-plan.json)" = "PLAN_ONLY"
      - name: Reconcile the complete RC transaction before its first mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Publish the four exact Candidate registry keys through the durable controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-run \
            --phase registry --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Begin the durable API image attestation intent
        id: tx_attest_api
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-api --github-output "$GITHUB_OUTPUT" \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Attest API image provenance under the durable intent
        if: steps.tx_attest_api.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.API_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: true
      - name: Reconcile the API image attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-api --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Begin the durable Web image attestation intent
        id: tx_attest_web
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-web --github-output "$GITHUB_OUTPUT" \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Attest Web image provenance under the durable intent
        if: steps.tx_attest_web.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WEB_REPOSITORY }}
          subject-digest: ${{ steps.published.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: true
      - name: Reconcile the Web image attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-web --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Begin the durable manifest attestation intent
        id: tx_attest_file_01
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-01 --github-output "$GITHUB_OUTPUT" \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Attest the exact release manifest under the durable intent
        if: steps.tx_attest_file_01.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-output/release-manifest.json
          create-storage-record: true
      - name: Reconcile the manifest attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-01 --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Begin the durable deployment contract attestation intent
        id: tx_attest_file_02
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-02 --github-output "$GITHUB_OUTPUT" \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Attest the exact deployment contract under the durable intent
        if: steps.tx_attest_file_02.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-output/deployment-contract.json
          create-storage-record: true
      - name: Reconcile the deployment contract attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-02 --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Begin the durable installer materials attestation intent
        id: tx_attest_file_03
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-begin-external \
            --step attestation-file-03 --github-output "$GITHUB_OUTPUT" \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Attest the exact installer materials under the durable intent
        if: steps.tx_attest_file_03.outputs.should_mutate == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-output/installer-materials.tar
          create-storage-record: true
      - name: Reconcile the installer materials attestation readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-reconcile-external \
            --step attestation-file-03 --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Verify every controller-owned RC attestation
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$API_REPOSITORY@$API_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          gh attestation verify "oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          for subject in release-manifest.json deployment-contract.json installer-materials.tar; do
            gh attestation verify "release-output/$subject" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Emit the validated RC presentation identity
        id: presentation
        shell: bash
        run: |
          set -euo pipefail
          python -m release.cli emit-publication-presentation \
            --plan release-output/publication-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Commit RC tag, Draft, individual assets, and publish through one controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-run \
            --phase publication --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin
      - name: Finalize and export the durable RC transaction receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          python -m scripts.release_publication transaction-finalize \
            --plan release-output/publication-plan.json \
            --source-tree "$candidate_tree" --asset-root release-output \
            --candidate-root "$ANIMEMO_ACCEPTED_CANDIDATE_ROOT" \
            --repository-path . --remote origin \
            --receipt release-output/publication-transaction-ledger.json
      - name: Preserve the finalized RC publication transaction before post-publication checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-transaction-${{ needs.preflight.outputs.release_tag }}-${{ github.run_attempt }}
          path: release-output/publication-transaction-ledger.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify the public RC without authenticated asset transport
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          rm -rf "$RUNNER_TEMP/public-readback"
          mkdir -p "$RUNNER_TEMP/public-readback"
          public_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          env -u GH_TOKEN curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' "$public_api" \
            > "$RUNNER_TEMP/public-release.json"
          jq '{id,tag_name,name,target_commitish,draft,prerelease,immutable,
               assets:[.assets[]|{name}]}' \
            "$RUNNER_TEMP/public-release.json" \
            > "$RUNNER_TEMP/public-presentation.json"
          python -m release.cli verify-release-presentation \
            --plan release-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/public-presentation.json" \
            --repository . --state published
          target="$(git rev-list -n 1 "$RELEASE_TAG")"
          jq --arg target "$target" \
            '{id,tag:.tag_name,target:$target,draft,prerelease,body,assets:[.assets[]|{name,size,digest}]}' \
            "$RUNNER_TEMP/public-release.json" > "$RUNNER_TEMP/public-metadata.json"
          for name in release-manifest.json deployment-contract.json installer-materials.tar checksums.txt "$PORTABLE_ASSET"; do
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' \
              "$RUNNER_TEMP/public-release.json")"
            test -n "$url"
            env -u GH_TOKEN curl --fail --location --silent --show-error \
              "$url" -o "$RUNNER_TEMP/public-readback/$name"
          done
          python -m release.cli verify-declared-portable \
            --plan release-output/publication-plan.json \
            --payload "$RUNNER_TEMP/public-readback/$PORTABLE_ASSET"
          for subject in release-manifest.json deployment-contract.json installer-materials.tar; do
            gh attestation verify "release-output/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          python scripts/release_publication.py verify-post-publish \
            --plan release-output/publication-plan.json \
            --metadata "$RUNNER_TEMP/public-metadata.json" \
            --download-directory "$RUNNER_TEMP/public-readback" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --public-unauthenticated-assets --attestations-verified \
            > release-output/post-publish-verification.json
      - name: Acquire and export the post-publish immutable Release attestation sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          API_DIGEST: ${{ steps.published.outputs.api_digest }}
          WEB_DIGEST: ${{ steps.published.outputs.web_digest }}
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_ASSET="animemo-$RELEASE_TAG-portable.tar"
          python scripts/acquire_release_attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" \
            --workflow .github/workflows/release.yml \
            --payload "release-output/$PORTABLE_ASSET" \
            --actions-subject "release-manifest=release-output/release-manifest.json" \
            --actions-subject "deployment-contract=release-output/deployment-contract.json" \
            --actions-subject "installer-materials=release-output/installer-materials.tar" \
            --actions-subject "api-image=oci://$API_REPOSITORY@$API_DIGEST" \
            --actions-subject "web-image=oci://$WEB_REPOSITORY@$WEB_DIGEST" \
            --output "release-output/animemo-$RELEASE_TAG-release-attestation.json" \
            > release-output/release-attestation-acquisition-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-publication-metadata-${{ needs.preflight.outputs.release_tag }}
          path: |
            release-output/release-qualification.json
            release-output/release-notes.json
            release-output/release-notes.md
            release-output/candidate-input.json
            release-output/verified-candidate.json
            release-output/candidate-acceptance-receipt.json
            release-output/publish-candidate-plan.json
            release-output/publication-plan.json
            release-output/publication-transaction-ledger.json
            release-output/post-publish-verification.json
            release-output/portable-build-receipt.json
            release-output/portable-pipeline-authority.json
            release-output/release-attestation-acquisition-receipt.json
            release-output/animemo-${{ needs.preflight.outputs.release_tag }}-release-attestation.json
          if-no-files-found: error
          retention-days: 90
