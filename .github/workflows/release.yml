name: Release

'on':
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      previous_release:
        description: 'Verified release tag to upgrade from (1.3 RC2 API or newer); blank uses ANIMEMO_PREVIOUS_RELEASE repository variable'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # A manual rerun must also select a tag. Never issue provenance for a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GOTELEMETRY: 'off'
      GOENV: 'off'
      GOCACHE: ${{ github.workspace }}/.local/cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.local/cache/go-mod
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.local/cache/npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Match source version and immutable tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; if(process.env.RELEASE_TAG !== "v"+JSON.parse(readFileSync("package.json")).version) process.exit(1)'
          if gh release view "$RELEASE_TAG"; then
            echo 'A release already exists; do not replace published assets.' >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run db:start
      - run: npm run verify
      - name: Install age into project tools
        run: |
          mkdir -p .local/tools/age
          GOBIN="$GITHUB_WORKSPACE/.local/tools/age" go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
      - name: Build one candidate
        run: npm run release -- build --output .local/output/release --image animemo-release:candidate
      - name: Select a verified upgrade baseline
        env:
          PREVIOUS_RELEASE: ${{ inputs.previous_release || vars.ANIMEMO_PREVIOUS_RELEASE }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$PREVIOUS_RELEASE" ]; then
            echo 'No published upgrade baseline selected; checking first installation and restore only.'
            echo 'ANIMEMO_PREVIOUS_IMAGE=animemo-release:candidate' >> "$GITHUB_ENV"
          else
            node --input-type=module -e 'if (!/^v\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$/.test(process.env.PREVIOUS_RELEASE) || process.env.PREVIOUS_RELEASE === process.env.RELEASE_TAG) throw Error("Select a different published release tag")'
            gh release download "$PREVIOUS_RELEASE" --dir .local/output/previous-release --pattern release.json --pattern animemo-image.tar --pattern attestations.jsonl
            node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { loadVerifiedRelease } from './tooling/release.mjs';
          const previous = await loadVerifiedRelease('.local/output/previous-release');
          if (previous.tag !== process.env.PREVIOUS_RELEASE) throw Error('Downloaded baseline tag mismatch');
          const current = JSON.parse(readFileSync('.local/output/release/release.json'));
          if (previous.image === current.image) throw Error('Upgrade baseline and candidate are the same image');
          appendFileSync(process.env.GITHUB_ENV, `ANIMEMO_PREVIOUS_IMAGE=${previous.local_image}\n`);
          writeFileSync('.local/output/release/upgrade-baseline.json', JSON.stringify({ tag: previous.tag, revision: previous.revision, image: previous.image }, null, 2) + '\n');
          NODE
          fi
      - name: Validate candidate lifecycle and extensions
        env:
          ANIMEMO_CANDIDATE_IMAGE: animemo-release:candidate
        run: |
          npm run test:instance
          node tooling/memory-instance-smoke.mjs
          npm run test:stage3
          node tooling/recovery-smoke.mjs
          cp .local/output/instance-smoke.json .local/output/memory-instance-smoke.json .local/output/stage3-smoke.json .local/output/recovery-smoke.json .local/output/release/
      - uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-path: |
            .local/output/release/release.json
            .local/output/release/animemo-image.tar
      - name: Preserve proof and upload a draft of the tested bytes
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$BUNDLE" .local/output/release/attestations.jsonl
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" .local/output/release/* --draft --verify-tag --title "AniMemo $RELEASE_TAG" --notes "Linux amd64 / Docker Compose / PostgreSQL 17. Install and recovery instructions: docs/instance-operations.md. VM and sustained-load checks are optional and were not run." "${flags[@]}"
      - name: Verify downloaded draft assets and boot the same image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir .local/output/downloaded
          npm run release -- load --directory .local/output/downloaded
          node tooling/release-smoke.mjs .local/output/downloaded
      - name: Publish without rebuilding and verify public downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          gh release download "$RELEASE_TAG" --dir .local/output/public-download
          npm run release -- verify --directory .local/output/public-download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            .local/output/instance-smoke.json
            .local/output/memory-instance-smoke.json
            .local/output/stage3-smoke.json
            .local/output/recovery-smoke.json
            .local/output/release-smoke.json
          if-no-files-found: ignore
