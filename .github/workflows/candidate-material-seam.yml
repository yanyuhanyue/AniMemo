name: Candidate Material Seam

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/candidate-material-seam.yml'
      - 'scripts/candidate_*.py'
      - 'scripts/guest_sudo_session.py'
      - 'scripts/tests/test_candidate_*.py'
      - 'installer/**'
      - 'release/materials.py'

permissions:
  contents: read

jobs:
  material-seam:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - run: python -m pip install --require-hashes -r durability/requirements.lock
      - name: Download the exact failed Candidate for development regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/candidate_material_seam.py download --destination "$RUNNER_TEMP/candidate-material-seam"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bd781acec7b157fdef4c6633df0964ecc612d2af
          path: baseline
          persist-credentials: false
      - name: Exercise actual POSIX root copying and actual distribution runtime imports
        run: >-
          sudo -n -- env -i PATH=/usr/bin:/bin LANG=C.UTF-8 GITHUB_ACTIONS=true
          "$(command -v python)" -I -B scripts/candidate_material_seam.py probe
          --destination "$RUNNER_TEMP/candidate-material-seam" --baseline "$GITHUB_WORKSPACE/baseline"
      - name: Retain only the bounded non-secret observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-material-seam-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-material-seam/material-seam-result.json
          if-no-files-found: ignore
          retention-days: 14
