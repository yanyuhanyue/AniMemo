name: Performance Baseline

on:
  workflow_call: {}

concurrency:
  group: animemo-performance-trusted-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: frontend-production-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - &trusted_main_binding
        name: Bind this runner to exact current main
        id: trusted_main
        env:
          TRUSTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "yanyuhanyue/AniMemo"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD^{commit})" = "$TRUSTED_SHA"
          test "$(git rev-parse origin/main^{commit})" = "$TRUSTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for the production browser probe
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: |
          set -euo pipefail
          echo "PROVISION_STAGE=BROWSER_DOWNLOAD STATUS=START"
          timeout --foreground --signal=TERM --kill-after=30s 8m npx playwright install chromium
          echo "PROVISION_STAGE=BROWSER_DOWNLOAD STATUS=PASS"
          echo "PROVISION_STAGE=BROWSER_RUNTIME_VERIFICATION STATUS=START"
          timeout --foreground --signal=TERM --kill-after=15s 2m node -e '(async()=>{const {chromium}=require("playwright");const browser=await chromium.launch({headless:true});await browser.close();})().catch(error=>{console.error(error);process.exit(1);})'
          echo "PROVISION_STAGE=BROWSER_RUNTIME_VERIFICATION STATUS=PASS"
      - name: Run deterministic frontend performance probe
        env:
          FRONTEND_PERF_COMMIT: ${{ github.sha }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: |
          mkdir -p artifacts
          node tests/performance-frontend-e2e.mjs
      - name: Upload frontend evidence
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-frontend
          path: artifacts/frontend.json
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: backend-postgresql-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBUG: "true"
      PYTHONPATH: ${{ github.workspace }}
      DJANGO_SECRET_KEY: ci-only-performance-secret-key-012345678901234567890123456789012345678901234567890
      CREDENTIAL_ENCRYPTION_KEY: a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
      ANIMEMO_PUBLIC_ORIGIN: http://perf.example.test:8088
      FRONTEND_URL: http://perf.example.test:8088
      ALLOWED_HOSTS: perf.example.test
      PERFORMANCE_SERVER_NAME: perf.example.test
      DATABASE_URL: postgresql://animemo:ci-password@127.0.0.1:5432/animemo
      POSTGRES_DB: animemo
      POSTGRES_USER: animemo
      POSTGRES_PASSWORD: ci-password
      REDIS_URL: redis://127.0.0.1:6379/0
      TURNSTILE_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: animemo
          POSTGRES_USER: animemo
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animemo -d animemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted_main_binding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Apply migrations to the ephemeral PostgreSQL service
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Measure SMALL, MEDIUM, and LARGE PostgreSQL paths
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          for dataset in small medium large; do
            python manage.py benchmark_backend_performance \
              --dataset "$dataset" \
              --explain \
              --output "../artifacts/backend-$dataset.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          for dataset in ("small", "medium", "large"):
              report = json.loads(Path(f"../artifacts/backend-{dataset}.json").read_text())
              assert report["mode"] == "POSTGRESQL_AUTHORITATIVE", report["mode"]
              assert report["database"] == {
                  "vendor": "postgresql",
                  "authoritative": True,
                  "explain_analyze_buffers": True,
              }, report["database"]
          PY
      - name: Upload backend evidence
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-backend
          path: artifacts/backend-*.json
          if-no-files-found: warn
          retention-days: 14

  isolated-resource-load:
    name: isolated-resource-load
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANIMEMO_CANDIDATE_BUILD_AUTHORITY: NON_AUTHORITATIVE_ISOLATED_TEST_ONLY
      COMPOSE_PROJECT_NAME: animemo-perf-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_HTTP_TIMEOUT: "120"
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.build.yml:deploy/docker-compose.performance.yml
      PERF_ADMIN_PASSWORD: PerfOnly-Admin-2026!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted_main_binding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.0
          driver-opts: |
            image=moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
          cache-binary: false
          keep-state: false
          cleanup: true
      - name: Bind and acquire exact performance dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Prepare the disposable production-like environment
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/animemo-performance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$data_root"/logs "$data_root"/backups "$data_root"/media "$data_root"/postgres "$data_root"/redis
          chmod -R a+rwx "$data_root"
          sudo -n install -d -m 0755 -o 10001 -g 10001 "$data_root/plugins"
          sudo install -d -m 0700 -o 10001 -g 10001 "$data_root/private"
          cat > .ci-runtime.env <<EOF
          DEBUG=false
          DJANGO_SECRET_KEY=ci-only-performance-secret-key-012345678901234567890123456789012345678901234567890
          CREDENTIAL_ENCRYPTION_KEY=a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql://animemo:ci-password@postgres:5432/animemo
          DATABASE_SSL_REQUIRE=false
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=perf.example.test
          ANIMEMO_PUBLIC_ORIGIN=https://perf.example.test
          CORS_ALLOWED_ORIGINS=https://perf.example.test
          CSRF_TRUSTED_ORIGINS=https://perf.example.test
          TRUSTED_PROXY_IPS=172.28.0.0/16
          TURNSTILE_ENABLED=false
          VITE_TURNSTILE_SITE_KEY=ci-site-key
          SECURE_SSL_REDIRECT=false
          SESSION_COOKIE_SECURE=false
          CSRF_COOKIE_SECURE=false
          REFRESH_COOKIE_SECURE=false
          ALLOW_INSECURE_PRODUCTION_COOKIES=true
          ANIMEMO_LISTEN_HOST=127.0.0.1
          ANIMEMO_LISTEN_PORT=8088
          ANIMEMO_CONFIG_REVISION=11111111-1111-4111-8111-111111111111
          ANIMEMO_TEST_DATA_ROOT=$data_root
          ANIMEMO_API_IMAGE=animemo-perf-api:candidate
          ANIMEMO_WEB_IMAGE=animemo-perf-web:candidate
          ANIMEMO_POSTGRES_IMAGE=$POSTGRES_IMAGE
          ANIMEMO_REDIS_IMAGE=$REDIS_IMAGE
          EOF
          sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" /run/animemo-updater
          sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" .ci-runtime.env /run/animemo-updater/managed.env
          echo "PERF_DATA_ROOT=$data_root" >> "$GITHUB_ENV"
      - name: Validate the isolated Compose contract
        run: docker compose --env-file .ci-runtime.env config
      - name: Build the candidate API and Web images
        run: docker compose --env-file .ci-runtime.env build api web
      - name: Start PostgreSQL and Redis, then run release jobs
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .ci-runtime.env up -d --pull never --wait --wait-timeout 120 postgres redis
          docker compose --env-file .ci-runtime.env run --rm --no-deps migration
          docker compose --env-file .ci-runtime.env run --rm --no-deps bootstrap
          docker compose --env-file .ci-runtime.env up -d --pull never --no-deps api web
      - name: Wait for the candidate Web/API health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              -H 'Host: perf.example.test' \
              http://127.0.0.1:8088/health/ \
              | python3 -c "import json, sys; assert json.load(sys.stdin).get('status') == 'ok'"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --env-file .ci-runtime.env ps
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error \
            -H 'Host: perf.example.test' \
            http://127.0.0.1:8088/ | grep -q '<div id="root">'
          echo '127.0.0.1 perf.example.test' | sudo tee -a /etc/hosts >/dev/null
      - name: Complete and lock the real first-run setup API
        shell: bash
        run: |
          set -euo pipefail
          ANIMEMO_CI_SETUP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ANIMEMO_CI_SETUP_PASSWORD
          sudo cat "$PERF_DATA_ROOT/private/setup-code" |
            python3 scripts/ci_first_run.py \
              --confirm-isolated \
              --code-stdin \
              --base-url http://127.0.0.1:8088 \
              --host perf.example.test \
              --username ci-bootstrap-admin \
              --email ci-bootstrap-admin@example.test \
              --password-env ANIMEMO_CI_SETUP_PASSWORD
      - name: Seed the isolated users and LARGE-shaped read dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          identities_file="$RUNNER_TEMP/animemo-performance-identities-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          docker compose --env-file .ci-runtime.env exec -T \
            -e PERF_ADMIN_PASSWORD="$PERF_ADMIN_PASSWORD" \
            api python manage.py provision_performance_load_identities \
              --dataset large \
              --count 20 \
              --token-minutes 40 \
              --staff-password-env PERF_ADMIN_PASSWORD \
              --confirm-isolated \
            > "$identities_file"
          chmod 600 "$identities_file"
          python3 - "$identities_file" > artifacts/seed.json <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          identities = payload["identities"]
          assert len(identities) == 20
          assert len({item["username"] for item in identities}) == 20
          assert len({item["entry_id"] for item in identities}) == 20
          print(json.dumps({
              "dataset": payload["dataset"],
              "journal_entries": payload["journal_entries"],
              "virtual_users": len(identities),
          }, sort_keys=True))
          PY
          echo "PERF_IDENTITIES_FILE=$identities_file" >> "$GITHUB_ENV"
      - name: Run the 1/5/10/20-user and 25-minute isolated workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -c 'from scripts.perf.contract import CONCURRENCY_LEVELS; assert CONCURRENCY_LEVELS == (1, 5, 10, 20)'
          python scripts/perf/isolated_run.py \
            --confirm-isolated \
            --base-url http://perf.example.test:8088 \
            --identities-file "$PERF_IDENTITIES_FILE" \
            --staff-username perf-v1-admin \
            --staff-password-env PERF_ADMIN_PASSWORD \
            --search-term anime \
            --iterations-per-user 2 \
            --sustained-concurrency 5 \
            --duration-seconds 1500 \
            --think-time-seconds 0.35 \
            --timeout-seconds 20 \
            --compose-project "$COMPOSE_PROJECT_NAME" \
            --postgres-user animemo \
            --postgres-database animemo \
            --resource-interval-seconds 15 \
            --output artifacts/resource-load.json
      - name: Capture scoped Compose state and logs
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose --env-file .ci-runtime.env ps --all > artifacts/compose-ps.txt 2>&1 || true
          docker compose --env-file .ci-runtime.env logs --no-color > artifacts/compose.log 2>&1 || true
      - name: Upload isolated resource/load evidence
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-resource-load
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Print isolated logs on failure
        if: ${{ failure() && steps.trusted_main.outputs.verified == 'true' }}
        run: docker compose --env-file .ci-runtime.env logs --no-color
      - name: Remove only this disposable performance Compose project
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        run: docker compose --env-file .ci-runtime.env down -v --remove-orphans

  isolated-long-operation-capacity:
    name: performance-long-operation-capacity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANIMEMO_CANDIDATE_BUILD_AUTHORITY: NON_AUTHORITATIVE_ISOLATED_TEST_ONLY
      COMPOSE_PROJECT_NAME: animemo-capacity-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_HTTP_TIMEOUT: "120"
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.build.yml:deploy/docker-compose.performance.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted_main_binding
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.36.0
          driver-opts: |
            image=moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
          cache-binary: false
          keep-state: false
          cleanup: true
      - name: Bind and acquire exact capacity dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Prepare the unique disposable capacity environment
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/animemo-capacity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$data_root"/{logs,backups,media,postgres,redis}
          chmod -R a+rwx "$data_root"
          sudo -n install -d -m 0755 -o 10001 -g 10001 "$data_root/plugins"
          sudo install -d -m 0700 -o 10001 -g 10001 "$data_root/private"
          cat > .ci-runtime.env <<EOF
          DEBUG=false
          DJANGO_SECRET_KEY=ci-only-capacity-secret-key-012345678901234567890123456789012345678901234567890
          CREDENTIAL_ENCRYPTION_KEY=a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql://animemo:ci-password@postgres:5432/animemo
          DATABASE_SSL_REQUIRE=false
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=capacity.example.test
          ANIMEMO_PUBLIC_ORIGIN=https://capacity.example.test
          CORS_ALLOWED_ORIGINS=https://capacity.example.test
          CSRF_TRUSTED_ORIGINS=https://capacity.example.test
          TRUSTED_PROXY_IPS=172.28.0.0/16
          TURNSTILE_ENABLED=false
          VITE_TURNSTILE_SITE_KEY=ci-site-key
          SECURE_SSL_REDIRECT=false
          SESSION_COOKIE_SECURE=false
          CSRF_COOKIE_SECURE=false
          REFRESH_COOKIE_SECURE=false
          ALLOW_INSECURE_PRODUCTION_COOKIES=true
          THROTTLE_USER_RATE=300/min
          ANIMEMO_ISOLATED_CAPACITY_PROBE=true
          ANIMEMO_ISOLATED_PROVIDER_LATENCY_MS=1200
          ANIMEMO_LISTEN_HOST=127.0.0.1
          ANIMEMO_LISTEN_PORT=8089
          ANIMEMO_CONFIG_REVISION=22222222-2222-4222-8222-222222222222
          ANIMEMO_TEST_DATA_ROOT=$data_root
          ANIMEMO_API_IMAGE=animemo-capacity-api:candidate
          ANIMEMO_WEB_IMAGE=animemo-capacity-web:candidate
          ANIMEMO_POSTGRES_IMAGE=$POSTGRES_IMAGE
          ANIMEMO_REDIS_IMAGE=$REDIS_IMAGE
          EOF
          sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" /run/animemo-updater
          sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" .ci-runtime.env /run/animemo-updater/managed.env
          echo "CAPACITY_DATA_ROOT=$data_root" >> "$GITHUB_ENV"
      - name: Validate and build the exact capacity candidate
        run: |
          docker compose --env-file .ci-runtime.env config
          docker compose --env-file .ci-runtime.env build api web
      - name: Start disposable capacity PostgreSQL Redis API and Web
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .ci-runtime.env up -d --pull never --wait --wait-timeout 120 postgres redis
          docker compose --env-file .ci-runtime.env run --rm --no-deps migration
          docker compose --env-file .ci-runtime.env run --rm --no-deps bootstrap
          docker compose --env-file .ci-runtime.env up -d --pull never --no-deps api web
          for attempt in {1..30}; do
            if curl --fail --silent --show-error -H 'Host: capacity.example.test' \
              http://127.0.0.1:8089/health/ \
              | python3 -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --env-file .ci-runtime.env ps --all
              exit 1
            fi
            sleep 5
          done
          echo '127.0.0.1 capacity.example.test' | sudo tee -a /etc/hosts >/dev/null
      - name: Complete the isolated capacity first-run setup
        shell: bash
        run: |
          set -euo pipefail
          CAPACITY_SETUP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export CAPACITY_SETUP_PASSWORD
          sudo cat "$CAPACITY_DATA_ROOT/private/setup-code" |
            python3 scripts/ci_first_run.py \
              --confirm-isolated \
              --code-stdin \
              --base-url http://127.0.0.1:8089 \
              --host capacity.example.test \
              --username capacity-bootstrap-admin \
              --email capacity-bootstrap-admin@example.test \
              --password-env CAPACITY_SETUP_PASSWORD
      - name: Provision sixty isolated capacity identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          identities_file="$RUNNER_TEMP/animemo-capacity-identities-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          docker compose --env-file .ci-runtime.env exec -T api \
            python manage.py provision_performance_load_identities \
              --dataset large \
              --count 60 \
              --token-minutes 30 \
              --confirm-isolated \
            > "$identities_file"
          chmod 600 "$identities_file"
          python3 - "$identities_file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert len(payload["identities"]) == 60
          assert len({item["username"] for item in payload["identities"]}) == 60
          assert len({item["access_token"] for item in payload["identities"]}) == 60
          PY
          echo "CAPACITY_IDENTITIES_FILE=$identities_file" >> "$GITHUB_ENV"
      - name: Run real HTTP 20 40 60 by 0 2 4 8 capacity matrix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/perf/long_operation_capacity.py \
            --confirm-isolated \
            --base-url http://capacity.example.test:8089 \
            --identities-file "$CAPACITY_IDENTITIES_FILE" \
            --compose-project "$COMPOSE_PROJECT_NAME" \
            --postgres-user animemo \
            --postgres-database animemo \
            --iterations-per-user 4 \
            --timeout-seconds 20 \
            --resource-interval-seconds 0.5 \
            --output artifacts/long-operation-capacity.json
      - name: Capture scoped capacity Compose state and logs
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose --env-file .ci-runtime.env ps --all > artifacts/capacity-compose-ps.txt 2>&1 || true
          docker compose --env-file .ci-runtime.env logs --no-color > artifacts/capacity-compose.log 2>&1 || true
      - name: Upload isolated long-operation capacity evidence
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-long-operation-capacity
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this disposable capacity Compose project
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        run: docker compose --env-file .ci-runtime.env down -v --remove-orphans

  regression-gate:
    name: performance-regression-gate
    if: ${{ always() }}
    needs: [frontend, backend, isolated-resource-load, isolated-long-operation-capacity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted_main_binding
      - name: Require every performance evidence producer to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: job["result"]
              for name, job in needs.items()
              if job["result"] != "success"
          }
          if failed:
              raise SystemExit(json.dumps(failed, sort_keys=True))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: performance-frontend
          path: artifacts/frontend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: performance-backend
          path: artifacts/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: performance-resource-load
          path: artifacts/resource
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: performance-long-operation-capacity
          path: artifacts/capacity
      - name: Evaluate the deterministic performance regression gate
        run: |
          python scripts/perf/regression_gate.py \
            --frontend artifacts/frontend/frontend.json \
            --backend artifacts/backend/backend-small.json \
            --backend artifacts/backend/backend-medium.json \
            --backend artifacts/backend/backend-large.json \
            --resource artifacts/resource/resource-load.json \
            --output artifacts/regression-gate.json
      - name: Upload the aggregate regression gate evidence
        if: ${{ always() && steps.trusted_main.outputs.verified == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-regression-gate
          path: artifacts/regression-gate.json
          if-no-files-found: warn
          retention-days: 14
