name: RC2 Hosted Draft Readback Diagnostic

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]

permissions: {}

jobs:
  scoped-diagnostic:
    if: >-
      github.repository == 'yanyuhanyue/AniMemo' &&
      github.actor == 'yanyuhanyue' &&
      github.event.pull_request.user.login == 'yanyuhanyue' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diag/rc2-hosted-draft-readback-20260919' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Verify operator event and frozen reviewed head before repository code
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import datetime, json, os, pathlib, re, urllib.request, urllib.error

          M = '089519b4ad07a29571b970a48537f439a0432965'
          REPO = 'yanyuhanyue/AniMemo'
          BRANCH = 'diag/rc2-hosted-draft-readback-20260919'
          WORKFLOW = '.github/workflows/rc2-draft-readback-diagnostic.yml'
          START = datetime.datetime.fromisoformat('2026-09-19T10:16:04+00:00')
          END = datetime.datetime.fromisoformat('2026-09-21T10:16:04+00:00')
          events = []

          def require(value):
              if not value:
                  raise ValueError('DIAGNOSTIC_BINDING_REJECTED')

          def reviewed(pr):
              matches = re.findall(r'<!-- animemo-reviewed-head: ([0-9a-f]{40}) -->', pr.get('body') or '')
              require(len(matches) == 1)
              return matches[0]

          def check_pr(pr, expected):
              require(type(pr.get('number')) is int and pr['number'] > 0)
              require(pr['user']['login'] == 'yanyuhanyue' and pr['user']['id'] == 111261350 and pr['user']['type'] == 'User')
              require(pr['state'] == 'open' and pr['draft'] is False)
              require(pr['base']['ref'] == 'main' and pr['base']['sha'] == M)
              require(pr['head']['ref'] == BRANCH and pr['head']['sha'] == expected and reviewed(pr) == expected)
              for side in ['head','base']:
                  repo = pr[side]['repo']
                  require(repo['id'] == 1327429673 and repo['full_name'] == REPO and repo['fork'] is False)
                  require(repo['owner']['id'] == 111261350 and repo['owner']['login'] == 'yanyuhanyue')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          def main():
              require(START <= datetime.datetime.now(datetime.timezone.utc) < END)
              require(os.environ['GITHUB_EVENT_NAME'] == 'pull_request')
              require(os.environ['GITHUB_REPOSITORY'] == REPO and os.environ['GITHUB_REPOSITORY_ID'] == '1327429673')
              require(os.environ['GITHUB_ACTOR'] == 'yanyuhanyue' and os.environ['GITHUB_ACTOR_ID'] == '111261350')
              require(os.environ['GITHUB_TRIGGERING_ACTOR'] == 'yanyuhanyue' and os.environ['GITHUB_RUN_ATTEMPT'] == '1')
              require(re.fullmatch('[1-9][0-9]*', os.environ['GITHUB_RUN_ID']) is not None)
              event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
              require(event['action'] == 'ready_for_review' and event['sender']['id'] == 111261350)
              pr = event['pull_request']
              expected = reviewed(pr)
              check_pr(pr, expected)
              number, run_id = pr['number'], int(os.environ['GITHUB_RUN_ID'])
              require(os.environ['GITHUB_REF'] == f'refs/pull/{number}/merge')
              for name in ['GITHUB_SHA','GITHUB_WORKFLOW_SHA']:
                  require(re.fullmatch('[0-9a-f]{40}', os.environ[name]) is not None)
              require(os.environ['GITHUB_WORKFLOW_REF'] == REPO + '/' + WORKFLOW + f'@refs/pull/{number}/merge')
              allowed = {f'pulls/{number}': '2022-11-28', f'actions/runs/{run_id}': '2026-03-10',
                         'git/ref/heads/main': '2026-03-10'}
              token = os.environ.pop('GH_TOKEN')
              def get(path):
                  require(path in allowed)
                  version = allowed[path]
                  row = {'ordinal':len(events)+1, 'endpoint_class': 'PR' if path.startswith('pulls/') else 'RUN' if path.startswith('actions/runs/') else 'WORKFLOW' if path.startswith('actions/workflows/') else 'MAIN',
                         'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'status':None,
                         'credential_role':'CURRENT_JOB_GITHUB_TOKEN', 'requested_api_version':version}
                  events.append(row)
                  request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + path,
                      method='GET', headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,
                                            'X-GitHub-Api-Version':version,'User-Agent':'AniMemo-publication-transaction/1'})
                  try:
                      response = urllib.request.build_opener(NoRedirect()).open(request, timeout=45)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      row['status'] = response.status
                      for header, key, pattern in [('X-GitHub-Request-Id','request_id',r'[0-9a-fA-F:]{1,128}'), ('X-GitHub-Api-Version-Selected','selected_version',r'[0-9]{4}-[0-9]{2}-[0-9]{2}')]:
                          value=response.headers.get(header)
                          row[key]=value if isinstance(value,str) and re.fullmatch(pattern,value) else None
                      length=response.headers.get('Content-Length')
                      body=response.read(4*1024*1024+1)
                      require(length is None or isinstance(length,str) and re.fullmatch('[0-9]{1,16}',length)
                              and int(length)==len(body) and len(response.headers.get_all('Content-Length'))==1)
                  require(response.status==200 and len(body)<=4*1024*1024)
                  value=json.loads(body)
                  require(isinstance(value,dict))
                  return value
              live=get(f'pulls/{number}')
              check_pr(live,expected)
              require(live['number']==number and get('git/ref/heads/main')['object']['sha']==M)
              run=get(f'actions/runs/{run_id}')
              require(run['id']==run_id and run['run_attempt']==1 and run['event']=='pull_request')
              require(run['head_sha']==expected and run['path']==WORKFLOW)
              require(run['repository']['id']==1327429673 and run['head_repository']['id']==1327429673)
              require(run['actor']['id']==111261350 and run['triggering_actor']['id']==111261350)
              require(START <= datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')) < END)
              workflow_id=run['workflow_id']
              require(type(workflow_id) is int and workflow_id>0)
              allowed[f'actions/workflows/{workflow_id}']='2026-03-10'
              workflow=get(f'actions/workflows/{workflow_id}')
              require(workflow['id']==workflow_id and workflow['path']==WORKFLOW)
              root=pathlib.Path(os.environ['RUNNER_TEMP'])/'animemo-draft-diagnostic'
              root.mkdir(exist_ok=False)
              identity={'schema':'animemo.hosted-diagnostic-binding/v1','product_source_sha':M,
                        'checkout_sha':expected,'pr_head_sha':live['head']['sha'],'pr_base_sha':live['base']['sha'],
                        'pr_number':number,'pr_merge_ref_sha':os.environ['GITHUB_SHA'],
                        'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'workflow_path':WORKFLOW,
                        'event':'pull_request/ready_for_review','run_id':run_id,'run_attempt':1,
                        'declared_permissions':{'contents':'write','actions':'read','pull-requests':'read','others':'none'},
                        'permission_evidence':'DECLARATION_ONLY_SEE_RUNNER_SETUP_LOG_FOR_REPORTED_TOKEN_PERMISSIONS',
                        'GET_count':len(events),'requests':events}
              (root/'identity.json').write_text(json.dumps(identity,indent=2)+'\n',encoding='utf-8')
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                  output.write('checkout_sha='+expected+'\n')

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  # Event body, exception text and API responses are never printed.
                  print(json.dumps({'status':'DIAGNOSTIC_BOOTSTRAP_REJECTED','requests':events}))
                  raise SystemExit(2) from None
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.binding.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Use runner Python and install existing hash-locked wheels
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/animemo-diagnostic-venv"
          "$RUNNER_TEMP/animemo-diagnostic-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r release/requirements.lock
      - name: Verify exact checkout
        env:
          CHECKOUT_SHA: ${{ steps.binding.outputs.checkout_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Observe fixed release endpoints with the current job token
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ steps.binding.outputs.checkout_sha }}
        run: '"$RUNNER_TEMP/animemo-diagnostic-venv/bin/python" -B -m release.draft_readback_diagnostic'
      - name: Upload only reviewed diagnostic projections
        if: ${{ always() && steps.binding.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc2-draft-readback-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/animemo-draft-diagnostic/identity.json
            ${{ runner.temp }}/animemo-draft-diagnostic/diagnostic.json
          if-no-files-found: error
          retention-days: 7
