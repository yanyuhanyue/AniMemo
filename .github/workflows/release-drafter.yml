name: 版本变更草稿

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: 更新版本变更草稿
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 更新草稿
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
