name: 版本变更草稿

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  update_release_draft:
    name: 更新版本变更草稿
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 更新草稿
        uses: release-drafter/release-drafter@v7

  auto_label:
    name: 标注变更类别
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 应用确定性标签规则
        uses: release-drafter/release-drafter/autolabeler@v7
