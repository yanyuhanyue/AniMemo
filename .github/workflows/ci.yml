name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      comparison_base_sha:
        description: Audited base commit used for changed-file and plugin comparison
        required: true
        type: string
      force_full:
        description: Force the authoritative full regression matrix
        required: true
        type: boolean
      public_origin:
        description: Candidate public origin used by isolated backend fixtures
        required: false
        default: http://localhost:5173
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      comparison_base_sha:
        description: Audited base commit used for comparison
        required: true
        type: string
      force_full:
        description: Force the full regression matrix
        required: true
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: changed-files
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      risk_level: ${{ steps.classify.outputs.risk_level }}
      risk_rank: ${{ steps.classify.outputs.risk_rank }}
      execution_force_full: ${{ steps.classify.outputs.execution_force_full }}
      classification_json: ${{ steps.classify.outputs.classification_json }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mixed: ${{ steps.classify.outputs.mixed }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}
      run_backend: ${{ steps.classify.outputs.run_backend }}
      run_bootstrap: ${{ steps.classify.outputs.run_bootstrap }}
      run_plugins: ${{ steps.classify.outputs.run_plugins }}
      run_bridge: ${{ steps.classify.outputs.run_bridge }}
      run_postgres: ${{ steps.classify.outputs.run_postgres }}
      run_runtime: ${{ steps.classify.outputs.run_runtime }}
      run_release_full: ${{ steps.classify.outputs.run_release_full }}
      run_release_updater: ${{ steps.classify.outputs.run_release_updater }}
      run_release_docker: ${{ steps.classify.outputs.run_release_docker }}
      run_release_stateful: ${{ steps.classify.outputs.run_release_stateful }}
      full_gate: ${{ steps.classify.outputs.full_gate }}
      critical_gate: ${{ steps.classify.outputs.critical_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - id: classify
        env:
          GITHUB_EVENT_NAME: ${{ inputs.force_full && 'workflow_call' || github.event_name }}
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_BASE_SHA: ${{ inputs.comparison_base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          CI_HEAD_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
        run: python scripts/ci_classify.py --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  fast-fail:
    name: ci-fast-fail
    needs: classify
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.docs_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - name: Validate changed-files classifier
        run: python scripts/ci_classify.py --self-test
      - name: Validate tracked text
        run: git diff --check

  docs-only:
    name: docs-only
    needs: classify
    if: ${{ !inputs.force_full && needs.classify.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Documentation-only change; product gates are not required."

  frontend:
    name: frontend
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Install Chromium for critical browser regressions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx playwright install --with-deps chromium
      - run: npm run qa:critical

  backend:
    name: backend
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-local-github-actions-validation
      CREDENTIAL_ENCRYPTION_KEY: a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
      ANIMEMO_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'http://localhost:5173' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-tools.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -r scripts/requirements-tools.txt
      - run: python -m ruff check --select E9,F63,F7,F82 backend bridges scripts
      - run: python -m compileall -q backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check
        working-directory: backend
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/animemo-openapi.yaml
        working-directory: backend
      - run: python scripts/update_dependencies.py --check
      - run: python manage.py test
        working-directory: backend

  bootstrap-smoke:
    name: bootstrap-smoke (${{ matrix.os }})
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_bootstrap == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS/Linux setup smoke
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/dev.sh --setup-only
      - name: Run Windows setup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev.ps1 -SetupOnly

  postgres:
    name: postgres
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_postgres == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-local-github-actions-validation
      CREDENTIAL_ENCRYPTION_KEY: a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
      ANIMEMO_PUBLIC_ORIGIN: ${{ inputs.public_origin || 'http://localhost:5173' }}
      DATABASE_URL: postgresql://animemo:ci-password@127.0.0.1:5432/animemo
      POSTGRES_DB: animemo
      POSTGRES_USER: animemo
      POSTGRES_PASSWORD: ci-password
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: animemo
          POSTGRES_USER: animemo
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animemo -d animemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).close(); print('PostgreSQL service is reachable')"
      - run: python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor; print(connection.vendor)"
        working-directory: backend
      - run: python manage.py test plugin_host.tests.test_concurrency.PluginPlatformPostgreSQLConcurrencyTests integrations.tests.test_concurrency.IntegrationReceiptPostgreSQLConcurrencyTests journal.test_external_account_concurrency.ExternalAccountRefreshPostgreSQLConcurrencyTests journal.test_external_media_concurrency.ExternalMediaIdentityPostgreSQLConcurrencyTests journal.test_watch_history_core.WatchHistoryPostgreSQLConcurrencyTests journal.test_external_sync_concurrency.ExternalCollectionSyncStatePostgreSQLConcurrencyTests journal.test_security.PostgreSQLRefreshTokenTests journal.test_profile_journal_queries journal.test_media_storage.StoragePostgreSQLConcurrencyTests site_config.test_first_run_bootstrap.FirstRunSetupPostgreSQLConcurrencyTests --verbosity 2
        working-directory: backend

  plugins:
    name: plugins
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_plugins == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r release/requirements.txt
      - run: npm ci
      - run: npm run test:plugins
      - run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - run: python scripts/pluginctl.py validate
      - run: python scripts/pluginctl.py build watch-history-importer
      - name: Check official plugin immutable package identities
        env:
          COMPARISON_BASE_SHA: ${{ inputs.comparison_base_sha || '' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
        shell: bash
        run: |
          if [[ -n "$COMPARISON_BASE_SHA" ]]; then
            python scripts/check_official_plugin_immutability.py \
              --base "$COMPARISON_BASE_SHA" --head "$CANDIDATE_SHA" --head-root .
          else
            python scripts/check_official_plugin_immutability.py --head-root .
          fi
      - run: python scripts/pluginctl.py pack watch-history-importer

  astrbot-bridge:
    name: astrbot-bridge
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_bridge == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r bridges/astrbot_plugin_animemo_bridge/requirements.txt
      - run: python -m unittest discover -s bridges/astrbot_plugin_animemo_bridge/tests -p "test_*.py" -v
      - run: python scripts/validate-astrbot-bridge.py
      - run: python scripts/package-astrbot-bridge.py

  astrbot-runtime:
    name: astrbot-runtime (${{ matrix.astrbot_ref }})
    needs: [classify, fast-fail]
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_runtime == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref:
          - v4.27.2
          - 30e20318cbaaa2e1ba57f3e0eee265d9ee98115c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.astrbot_ref }}
          path: .astrbot-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r .astrbot-runtime/requirements.txt
      - run: python -m pip install -r bridges/astrbot_plugin_animemo_bridge/requirements.txt
      - name: Smoke Bridge against the real AstrBot runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/.astrbot-runtime
          ASTRBOT_ROOT: ${{ runner.temp }}/animemo-astrbot-smoke
        run: python scripts/smoke-astrbot-bridge-runtime.py
      - name: Package Bridge for real loader smoke
        run: python scripts/package-astrbot-bridge.py --output "${{ runner.temp }}/astrbot_plugin_animemo_bridge-0.1.3.zip"
      - name: Load Bridge source through AstrBot PluginManager
        run: python scripts/smoke-astrbot-bridge-loader.py --runtime-root .astrbot-runtime --label "${{ matrix.astrbot_ref }} source loader"
      - name: Load packaged Bridge through AstrBot PluginManager
        run: python scripts/smoke-astrbot-bridge-loader.py --runtime-root .astrbot-runtime --plugin-zip "${{ runner.temp }}/astrbot_plugin_animemo_bridge-0.1.3.zip" --label "${{ matrix.astrbot_ref }} package loader"
      - name: Prove schema loader gate red and green
        run: python scripts/prove-astrbot-bridge-schema-gate.py --runtime-root .astrbot-runtime --plugin-zip "${{ runner.temp }}/astrbot_plugin_animemo_bridge-0.1.3.zip"

  selection-authority:
    name: ci-selection-authority
    if: ${{ always() }}
    needs: [classify, fast-fail, docs-only, frontend, backend, bootstrap-smoke, postgres, plugins, astrbot-bridge, astrbot-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - name: Require selected jobs to succeed and unselected jobs to skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci_gate_authority.py
          --workflow ci
          --event-name "${{ github.event_name }}"

  pr-fast-gate:
    name: pr-fast-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: selection-authority
    runs-on: ubuntu-latest
    steps:
      - name: Require the selection-aware PR Fast authority
        env:
          AUTHORITY_RESULT: ${{ needs.selection-authority.result }}
        shell: bash
        run: test "$AUTHORITY_RESULT" = success
