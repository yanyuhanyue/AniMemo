name: CI

'on':
  pull_request:
  push:
    branches: [main, codex/animemo-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTELEMETRY: 'off'
  GOENV: 'off'
  GOCACHE: ${{ github.workspace }}/.local/cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.local/cache/go-mod
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.local/cache/npm

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      web: ${{ steps.checks.outputs.web }}
      api: ${{ steps.checks.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/output
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:tooling/ci-select.mjs" 2>/dev/null; then
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > .local/output/changed-paths
            git show "$BASE_SHA:tooling/ci-select.mjs" > .local/output/base-select.mjs
            node .local/output/base-select.mjs .local/output/changed-paths
          else
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo 'api=true' >> "$GITHUB_OUTPUT"
          fi
      - run: node --test tooling/ci-select.test.mjs tooling/container-smoke.test.mjs
      - run: git diff --check

  web:
    needs: select
    if: needs.select.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:web
      - run: node --test web/tests/*.test.mjs tooling/*.test.mjs
      - run: node node_modules/vite/bin/vite.js build --config web/vite.config.ts

  api:
    needs: select
    if: needs.select.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: animemo
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: animemo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U animemo -d animemo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://animemo:ci-only-synthetic-password@127.0.0.1:5432/animemo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: node tooling/check-layout.mjs
      - run: go -C server vet ./...
      - run: go -C server test -race -tags=integration -count=1 ./...
      - run: mkdir -p .local/bin && go -C server build -trimpath -o ../.local/bin/animemo ./cmd/animemo

  required:
    name: required
    if: always()
    needs: [select, web, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          SELECTION_RESULT: ${{ needs.select.result }}
          WEB_SELECTED: ${{ needs.select.outputs.web }}
          API_SELECTED: ${{ needs.select.outputs.api }}
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SELECTION_RESULT" = success
          for component in WEB API; do
            selected="${component}_SELECTED"
            result="${component}_RESULT"
            if [[ "${!selected}" == true ]]; then
              test "${!result}" = success
            elif [[ "${!selected}" == false ]]; then
              test "${!result}" = skipped
            else
              exit 1
            fi
          done
