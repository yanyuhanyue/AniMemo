name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upgrade_base_sha:
        description: Optional known production/base SHA for official plugin comparison
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-local-github-actions-validation
      CREDENTIAL_ENCRYPTION_KEY: a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-tools.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -r scripts/requirements-tools.txt
      - run: python -m compileall -q backend
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check
        working-directory: backend
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/animemo-openapi.yaml
        working-directory: backend
      - run: python scripts/update_dependencies.py --check
      - run: python manage.py test
        working-directory: backend

  bootstrap-smoke:
    name: bootstrap-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run macOS/Linux setup smoke
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/dev.sh --setup-only
      - name: Run Windows setup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev.ps1 -SetupOnly

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-for-local-github-actions-validation
      CREDENTIAL_ENCRYPTION_KEY: a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://anime_journal:ci-password@127.0.0.1:5432/anime_journal
      POSTGRES_DB: anime_journal
      POSTGRES_USER: anime_journal
      POSTGRES_PASSWORD: ci-password
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anime_journal
          POSTGRES_USER: anime_journal
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anime_journal -d anime_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL']).close(); print('PostgreSQL service is reachable')"
      - run: python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor; print(connection.vendor)"
        working-directory: backend
      - run: python manage.py test plugin_host.tests.test_concurrency.PluginPlatformPostgreSQLConcurrencyTests integrations.tests.test_concurrency.IntegrationReceiptPostgreSQLConcurrencyTests journal.test_external_media_concurrency.ExternalMediaIdentityPostgreSQLConcurrencyTests journal.test_watch_history_core.WatchHistoryPostgreSQLConcurrencyTests journal.test_external_sync_concurrency.ExternalCollectionSyncStatePostgreSQLConcurrencyTests journal.test_security.PostgreSQLRefreshTokenTests journal.test_profile_journal_queries --verbosity 2
        working-directory: backend

  plugins:
    name: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging==25.0
      - run: npm ci
      - run: npm run test:plugins
      - run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
      - run: python scripts/pluginctl.py validate
      - run: python scripts/pluginctl.py build watch-history-importer
      - name: Check official plugin immutable package identities
        run: python scripts/check_official_plugin_immutability.py --head-root .
      - run: python scripts/pluginctl.py pack watch-history-importer

  astrbot-bridge:
    name: astrbot-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r bridges/astrbot_plugin_animemo_bridge/requirements.txt
      - run: python -m unittest discover -s bridges/astrbot_plugin_animemo_bridge/tests -p "test_*.py" -v
      - run: python scripts/validate-astrbot-bridge.py
      - run: python scripts/package-astrbot-bridge.py

  astrbot-runtime:
    name: astrbot-runtime (${{ matrix.astrbot_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        astrbot_ref:
          - v4.27.2
          - 30e20318cbaaa2e1ba57f3e0eee265d9ee98115c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.astrbot_ref }}
          path: .astrbot-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r .astrbot-runtime/requirements.txt
      - run: python -m pip install -r bridges/astrbot_plugin_animemo_bridge/requirements.txt
      - name: Smoke Bridge against the real AstrBot runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/.astrbot-runtime
          ASTRBOT_ROOT: ${{ runner.temp }}/animemo-astrbot-smoke
        run: python scripts/smoke-astrbot-bridge-runtime.py
