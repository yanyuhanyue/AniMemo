name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      upgrade_base_sha:
        description: Audited base SHA for BASE to CURRENT validation
        required: true
        type: string
      force_full:
        description: Force the authoritative release gate
        required: true
        type: boolean
      public_origin:
        description: Candidate public origin used by isolated Docker fixtures
        required: false
        default: https://ci.example.test
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      upgrade_base_sha:
        description: Audited base SHA for BASE to CURRENT validation
        required: true
        type: string
      force_full:
        description: Force the full release gate
        required: true
        default: true
        type: boolean

concurrency:
  group: release-gate-${{ github.workflow }}-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: release-changed-files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      risk_level: ${{ steps.classify.outputs.risk_level }}
      risk_rank: ${{ steps.classify.outputs.risk_rank }}
      execution_force_full: ${{ steps.classify.outputs.execution_force_full }}
      classification_json: ${{ steps.classify.outputs.classification_json }}
      authority_scalars_json: ${{ steps.classify.outputs.authority_scalars_json }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mixed: ${{ steps.classify.outputs.mixed }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}
      run_backend: ${{ steps.classify.outputs.run_backend }}
      run_bootstrap: ${{ steps.classify.outputs.run_bootstrap }}
      run_plugins: ${{ steps.classify.outputs.run_plugins }}
      run_bridge: ${{ steps.classify.outputs.run_bridge }}
      run_postgres: ${{ steps.classify.outputs.run_postgres }}
      run_runtime: ${{ steps.classify.outputs.run_runtime }}
      run_release_full: ${{ steps.classify.outputs.run_release_full }}
      run_release_updater: ${{ steps.classify.outputs.run_release_updater }}
      run_release_docker: ${{ steps.classify.outputs.run_release_docker }}
      run_release_stateful: ${{ steps.classify.outputs.run_release_stateful }}
      full_gate: ${{ steps.classify.outputs.full_gate }}
      critical_gate: ${{ steps.classify.outputs.critical_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - id: classify
        env:
          GITHUB_EVENT_NAME: ${{ inputs.force_full && 'workflow_call' || github.event_name }}
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_BASE_SHA: ${{ inputs.upgrade_base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          CI_HEAD_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
        run: >-
          python scripts/ci_classify.py
          --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --authority-output "$RUNNER_TEMP/release-classification-authority.json"
      - name: Upload the exact Release Gate classification authority document
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-classification-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-classification-authority.json
          if-no-files-found: error
          retention-days: 1

  post-merge-sanity:
    name: post-merge-sanity
    needs: classify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - run: python scripts/ci_classify.py --self-test
      - run: git diff --check
      - run: python -m compileall -q scripts

  updater-isolated:
    name: updater-isolated
    needs: classify
    if: github.event_name != 'push' && needs.classify.outputs.run_release_updater == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            release/requirements.lock
            durability/requirements.lock
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - run: python -m pip install --require-hashes -r durability/requirements.lock
      - name: Run restricted Agent unit, security, Unix Socket, and isolated A-B-A tests
        run: python -m unittest discover -s updater/tests -p 'test_*.py' -v
      - name: Run pinned GitHub CLI Stage0 version contract
        run: python -m unittest discover -s installer/tests -p 'test_*.py' -v

  docker:
    name: docker
    needs: classify
    if: github.event_name != 'push' && needs.classify.outputs.run_release_docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANIMEMO_CANDIDATE_BUILD_AUTHORITY: NON_AUTHORITATIVE_ISOLATED_TEST_ONLY
      COMPOSE_PROJECT_NAME: animemo-ci
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            release/requirements.lock
            durability/requirements.lock
      - run: python -m pip install --require-hashes -r release/requirements.lock
      - run: python -m pip install --require-hashes -r durability/requirements.lock
      - name: Bind and acquire exact release-gate dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Create ephemeral production-like environment
        shell: bash
        run: |
          data_root="$RUNNER_TEMP/animemo-data"
          mkdir -p "$data_root"/logs "$data_root"/backups "$data_root"/media "$data_root"/postgres "$data_root"/redis
          chmod -R a+rwx "$data_root"
          sudo -n install -d -m 0755 -o 10001 -g 10001 "$data_root/plugins"
          sudo -n install -d -m 0700 -o 10001 -g 10001 "$data_root/private"
          cat > .ci-runtime.env <<EOF
          DEBUG=false
          DJANGO_SECRET_KEY=ci-only-secret-key-012345678901234567890123456789012345678901234567890
          CREDENTIAL_ENCRYPTION_KEY=a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql://animemo:ci-password@postgres:5432/animemo
          DATABASE_SSL_REQUIRE=false
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=ci.example.test
          ANIMEMO_PUBLIC_ORIGIN=${{ inputs.public_origin || 'https://ci.example.test' }}
          CORS_ALLOWED_ORIGINS=${{ inputs.public_origin || 'https://ci.example.test' }}
          CSRF_TRUSTED_ORIGINS=${{ inputs.public_origin || 'https://ci.example.test' }}
          TRUSTED_PROXY_IPS=172.28.0.0/16
          TURNSTILE_ENABLED=false
          VITE_TURNSTILE_SITE_KEY=ci-site-key
          SECURE_SSL_REDIRECT=false
          SESSION_COOKIE_SECURE=false
          CSRF_COOKIE_SECURE=false
          REFRESH_COOKIE_SECURE=false
          ALLOW_INSECURE_PRODUCTION_COOKIES=true
          ANIMEMO_LISTEN_HOST=127.0.0.1
          ANIMEMO_LISTEN_PORT=8088
          ANIMEMO_CONFIG_REVISION=11111111-1111-4111-8111-111111111111
          ANIMEMO_RELEASE_VERSION=v1.1.0-rc.0
          ANIMEMO_RELEASE_COMMIT=${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          ANIMEMO_RELEASE_CHANNEL=rc
          ANIMEMO_DATABASE_CONTRACT=animemo.database/v1
          ANIMEMO_CONFIGURATION_CONTRACT=animemo.configuration/v1
          ANIMEMO_INSTANCE_NAME=release-gate
          ANIMEMO_INSTANCE_ID=12345678-1234-4234-9234-123456789abc
          ANIMEMO_COMPOSE_PROJECT=animemo-release-gate
          ANIMEMO_MANAGED_ENV_PATH=/run/animemo-updater/release-gate/managed.env
          ANIMEMO_UPDATER_RUNTIME_ROOT=/run/animemo-updater/release-gate
          ANIMEMO_DATA_ROOT=$data_root
          ANIMEMO_TEST_DATA_ROOT=$data_root
          ANIMEMO_API_IMAGE=animemo-api:release-gate
          ANIMEMO_WEB_IMAGE=animemo-web:release-gate
          ANIMEMO_POSTGRES_IMAGE=$POSTGRES_IMAGE
          ANIMEMO_REDIS_IMAGE=$REDIS_IMAGE
          EOF
          sudo install -d -m 0750 -o "$(id -u)" -g "$(id -g)" /run/animemo-updater/release-gate
          sudo install -m 0600 -o "$(id -u)" -g "$(id -g)" .ci-runtime.env /run/animemo-updater/release-gate/managed.env
          echo "RELEASE_GATE_DATA_ROOT=$data_root" >> "$GITHUB_ENV"
      - name: Select candidate Compose contract
        shell: bash
        run: |
          test -f deploy/docker-compose.build.yml
          test -f updater/docker-compose.runtime.yml
          echo "COMPOSE_FILE=deploy/docker-compose.yml:updater/docker-compose.runtime.yml:deploy/docker-compose.build.yml" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose --project-name animemo-release-gate --env-file .ci-runtime.env config
      - name: Build production images
        run: docker compose --project-name animemo-release-gate --env-file .ci-runtime.env build api web
      - name: Start production-like stack
        run: |
          # NEGATIVE_TEST_FIXTURE: legacy ordering only: up -d --wait --wait-timeout 120 postgres redis
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env up -d --pull never --wait --wait-timeout 120 postgres redis
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env run --rm --no-deps migration
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env run --rm --no-deps bootstrap
          # NEGATIVE_TEST_FIXTURE: legacy ordering only: up -d --no-deps api web
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env up -d --pull never --no-deps api web
      - name: Run real production PostgreSQL Backup adapter create and verify
        env:
          ANIMEMO_RUN_PRODUCTION_BACKUP_DOCKER_TEST: "1"
        run: python -m unittest scripts.tests.test_production_backup_postgres.RealProductionPostgresBackupTests -v
      - name: Run health and frontend smoke checks
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/health/ | python3 -c "import json, sys; assert json.load(sys.stdin).get('status') == 'ok'"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --project-name animemo-release-gate --env-file .ci-runtime.env ps
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/ | grep -q '<div id="root">'
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env ps
      - name: Complete and lock the real first-run setup API
        shell: bash
        run: |
          set -euo pipefail
          ANIMEMO_CI_SETUP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ANIMEMO_CI_SETUP_PASSWORD
          sudo cat "$RELEASE_GATE_DATA_ROOT/private/setup-code" |
            python3 scripts/ci_first_run.py \
              --confirm-isolated \
              --code-stdin \
              --base-url http://127.0.0.1:8088 \
              --host ci.example.test \
              --username ci-bootstrap-admin \
              --email ci-bootstrap-admin@example.test \
              --password-env ANIMEMO_CI_SETUP_PASSWORD
      - name: Verify fresh D1A routes, pull-only capability, and empty sync state
        run: >-
          docker compose --project-name animemo-release-gate --env-file .ci-runtime.env exec -T api
          python manage.py shell -c
          "from django.db import connection; from django.urls import resolve, reverse;
          from journal.external_accounts.providers.bangumi import BangumiAccountProvider;
          from journal.models import ExternalCollectionSyncState;
          assert ExternalCollectionSyncState._meta.db_table in connection.introspection.table_names();
          assert not ExternalCollectionSyncState.objects.exists();
          preview = reverse('external-collection-sync-preview', kwargs={'provider': 'bangumi', 'entry_id': 1});
          apply = reverse('external-collection-sync-apply', kwargs={'provider': 'bangumi', 'entry_id': 1});
          assert resolve(preview).view_name == 'external-collection-sync-preview';
          assert resolve(apply).view_name == 'external-collection-sync-apply';
          capabilities = BangumiAccountProvider().capabilities();
          assert capabilities['collection_sync_preview_available'];
          assert capabilities['collection_sync_pull_available'];
          assert capabilities['collection_sync_apply_available'];
          assert not capabilities['collection_sync_push_available'];
          assert not capabilities['collection_write_implemented'];
          print('Fresh D1A pull-only gate: PASS')"
      - name: Print logs on failure
        if: failure()
        run: docker compose --project-name animemo-release-gate --env-file .ci-runtime.env logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --project-name animemo-release-gate --env-file .ci-runtime.env down -v

  stateful-upgrade:
    name: stateful-upgrade
    needs: classify
    if: github.event_name != 'push' && needs.classify.outputs.run_release_stateful == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: animemo-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Prepare scoped upgrade temp root
        shell: bash
        run: echo "STATEFUL_UPGRADE_TEMP_ROOT=$RUNNER_TEMP/animemo-upgrade-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Resolve audited upgrade refs
        id: refs
        run: >-
          python scripts/ci_refs.py
          --base "${{ inputs.upgrade_base_sha || '' }}"
          --head "${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Bind and acquire exact upgrade dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Run BASE to CURRENT stateful production upgrade gate
        shell: bash
        run: >-
          bash scripts/stateful-upgrade-gate.sh
          --base "${{ steps.refs.outputs.base }}"
          --head "${{ steps.refs.outputs.head }}"
          --current-root "$GITHUB_WORKSPACE"
      - name: Print scoped upgrade logs on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          for container in $(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            docker logs "$container" || true
          done
      - name: Scoped fallback cleanup
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          if [[ -d "$STATEFUL_UPGRADE_TEMP_ROOT/base" ]]; then
            git worktree remove --force "$STATEFUL_UPGRADE_TEMP_ROOT/base" || true
          fi
          git worktree prune
          if ! rm -rf -- "$STATEFUL_UPGRADE_TEMP_ROOT" 2>/dev/null; then
            sudo -n rm -rf -- "$STATEFUL_UPGRADE_TEMP_ROOT"
          fi

  dr-rehearsal:
    name: dr-rehearsal
    needs: classify
    if: github.event_name != 'push' && fromJSON(needs.classify.outputs.classification_json).gates.run_release_dr == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      COMPOSE_HTTP_TIMEOUT: "120"
      COMPOSE_PROJECT_NAME: animemo-dr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Bind and acquire exact DR dependency images
        shell: bash
        run: |
          set -euo pipefail
          python -m release.registry_transport pull-all --projection github-env >> "$GITHUB_ENV"
      - name: Validate portable DR backup contract
        run: python -m unittest scripts.tests.test_dr_backup scripts.tests.test_dr_recovery_paths scripts.tests.test_dr_rehearsal_contract -v
      - name: Run isolated A-to-B DR rehearsal
        env:
          DR_REHEARSAL_TEMP_ROOT: ${{ runner.temp }}/animemo-dr-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: bash scripts/dr-rehearsal.sh --candidate-sha "$CANDIDATE_SHA" --current-root "$GITHUB_WORKSPACE"

  selection-authority:
    name: release-gate-authority
    if: ${{ always() }}
    needs: [classify, post-merge-sanity, updater-isolated, docker, stateful-upgrade, dr-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - name: Download the exact Release Gate classification authority document
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-classification-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-classification-authority
      - name: Require selected jobs to succeed and unselected jobs to skip
        env:
          AUTHORITY_EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION_AUTHORITY_SCALARS_JSON: ${{ needs.classify.outputs.authority_scalars_json }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          POST_MERGE_SANITY_RESULT: ${{ needs.post-merge-sanity.result }}
          UPDATER_ISOLATED_RESULT: ${{ needs.updater-isolated.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          STATEFUL_UPGRADE_RESULT: ${{ needs.stateful-upgrade.result }}
          DR_REHEARSAL_RESULT: ${{ needs.dr-rehearsal.result }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_gate_authority.py \
            --workflow release \
            --event-name "$AUTHORITY_EVENT_NAME" \
            --release-graph-contract animemo.release-gate.jobs/v2 \
            --classification-file "$RUNNER_TEMP/release-classification-authority/release-classification-authority.json" \
            --authority-scalars-json "$CLASSIFICATION_AUTHORITY_SCALARS_JSON" \
            --job-result "classify=$CLASSIFY_RESULT" \
            --job-result "post-merge-sanity=$POST_MERGE_SANITY_RESULT" \
            --job-result "updater-isolated=$UPDATER_ISOLATED_RESULT" \
            --job-result "docker=$DOCKER_RESULT" \
            --job-result "stateful-upgrade=$STATEFUL_UPGRADE_RESULT" \
            --job-result "dr-rehearsal=$DR_REHEARSAL_RESULT"
