name: Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: anime-journal-ci
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral production-like environment
        shell: bash
        run: |
          data_root="$RUNNER_TEMP/anime-journal-data"
          mkdir -p "$data_root"
          cat > .env.production <<EOF
          DEBUG=false
          DJANGO_SECRET_KEY=ci-only-secret-key-012345678901234567890123456789012345678901234567890
          CREDENTIAL_ENCRYPTION_KEY=a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
          POSTGRES_DB=anime_journal
          POSTGRES_USER=anime_journal
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql://anime_journal:ci-password@postgres:5432/anime_journal
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=ci.example.test
          FRONTEND_URL=https://ci.example.test
          CORS_ALLOWED_ORIGINS=https://ci.example.test
          CSRF_TRUSTED_ORIGINS=https://ci.example.test
          TRUSTED_PROXY_IPS=172.28.0.0/16
          TURNSTILE_ENABLED=false
          VITE_TURNSTILE_SITE_KEY=ci-site-key
          SECURE_SSL_REDIRECT=false
          ALLOW_INSECURE_PRODUCTION_COOKIES=true
          ANIME_JOURNAL_PORT=8088
          ANIME_JOURNAL_DATA_ROOT=$data_root
          EOF
      - name: Validate Compose configuration
        run: docker compose --env-file .env.production -f deploy/docker-compose.yml config
      - name: Build production images
        run: docker compose --env-file .env.production -f deploy/docker-compose.yml build
      - name: Start production-like stack
        run: docker compose --env-file .env.production -f deploy/docker-compose.yml up -d
      - name: Run health and frontend smoke checks
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/health/ | grep -q '"status":"ok"'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --env-file .env.production -f deploy/docker-compose.yml ps
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/ | grep -q '<div id="root">'
          docker compose --env-file .env.production -f deploy/docker-compose.yml ps
      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f deploy/docker-compose.yml logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.production -f deploy/docker-compose.yml down -v
