name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      upgrade_base_sha:
        description: Audited base SHA for BASE to CURRENT validation
        required: true
        type: string
      force_full:
        description: Force the authoritative release gate
        required: true
        type: boolean
      public_origin:
        description: Candidate public origin used by isolated Docker fixtures
        required: false
        default: https://ci.example.test
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to validate
        required: true
        type: string
      upgrade_base_sha:
        description: Audited base SHA for BASE to CURRENT validation
        required: true
        type: string
      force_full:
        description: Force the full release gate
        required: true
        default: true
        type: boolean

concurrency:
  group: release-gate-${{ github.workflow }}-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify:
    name: release-changed-files
    runs-on: ubuntu-latest
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      risk_level: ${{ steps.classify.outputs.risk_level }}
      risk_rank: ${{ steps.classify.outputs.risk_rank }}
      execution_force_full: ${{ steps.classify.outputs.execution_force_full }}
      classification_json: ${{ steps.classify.outputs.classification_json }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      mixed: ${{ steps.classify.outputs.mixed }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}
      run_backend: ${{ steps.classify.outputs.run_backend }}
      run_bootstrap: ${{ steps.classify.outputs.run_bootstrap }}
      run_plugins: ${{ steps.classify.outputs.run_plugins }}
      run_bridge: ${{ steps.classify.outputs.run_bridge }}
      run_postgres: ${{ steps.classify.outputs.run_postgres }}
      run_runtime: ${{ steps.classify.outputs.run_runtime }}
      run_release_full: ${{ steps.classify.outputs.run_release_full }}
      run_release_updater: ${{ steps.classify.outputs.run_release_updater }}
      run_release_docker: ${{ steps.classify.outputs.run_release_docker }}
      run_release_stateful: ${{ steps.classify.outputs.run_release_stateful }}
      full_gate: ${{ steps.classify.outputs.full_gate }}
      critical_gate: ${{ steps.classify.outputs.critical_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - id: classify
        env:
          GITHUB_EVENT_NAME: ${{ inputs.force_full && 'workflow_call' || github.event_name }}
          CI_FORCE_FULL: ${{ inputs.force_full || false }}
          CI_BASE_SHA: ${{ inputs.upgrade_base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          CI_HEAD_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
        run: python scripts/ci_classify.py --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  post-merge-sanity:
    name: post-merge-sanity
    needs: classify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - run: python scripts/ci_classify.py --self-test
      - run: git diff --check
      - run: python -m compileall -q scripts

  updater-isolated:
    name: updater-isolated
    needs: classify
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_release_updater == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: release/requirements.txt
      - run: python -m pip install -r release/requirements.txt
      - name: Run restricted Agent unit, security, Unix Socket, and isolated A-B-A tests
        run: python -m unittest discover -s updater/tests -p 'test_*.py' -v

  docker:
    name: docker
    needs: classify
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_release_docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: animemo-ci
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - name: Create ephemeral production-like environment
        shell: bash
        run: |
          data_root="$RUNNER_TEMP/animemo-data"
          mkdir -p "$data_root"/plugins "$data_root"/logs "$data_root"/backups "$data_root"/media "$data_root"/postgres "$data_root"/redis
          chmod -R a+rwx "$data_root"
          sudo install -d -m 0700 -o 10001 -g 10001 "$data_root/private"
          cat > .env.production <<EOF
          DEBUG=false
          DJANGO_SECRET_KEY=ci-only-secret-key-012345678901234567890123456789012345678901234567890
          CREDENTIAL_ENCRYPTION_KEY=a0DtqkhZwqytmU2lcF-2oUKmjlyqPIrJsU5O_T6d3Io=
          POSTGRES_DB=animemo
          POSTGRES_USER=animemo
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql://animemo:ci-password@postgres:5432/animemo
          DATABASE_SSL_REQUIRE=false
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=ci.example.test
          ANIMEMO_PUBLIC_ORIGIN=${{ inputs.public_origin || 'https://ci.example.test' }}
          CORS_ALLOWED_ORIGINS=${{ inputs.public_origin || 'https://ci.example.test' }}
          CSRF_TRUSTED_ORIGINS=${{ inputs.public_origin || 'https://ci.example.test' }}
          TRUSTED_PROXY_IPS=172.28.0.0/16
          TURNSTILE_ENABLED=false
          VITE_TURNSTILE_SITE_KEY=ci-site-key
          SECURE_SSL_REDIRECT=false
          SESSION_COOKIE_SECURE=false
          CSRF_COOKIE_SECURE=false
          REFRESH_COOKIE_SECURE=false
          ALLOW_INSECURE_PRODUCTION_COOKIES=true
          ANIMEMO_PORT=8088
          ANIMEMO_DATA_ROOT=$data_root
          ANIMEMO_API_IMAGE=animemo-api:release-gate
          ANIMEMO_WEB_IMAGE=animemo-web:release-gate
          EOF
          echo "RELEASE_GATE_DATA_ROOT=$data_root" >> "$GITHUB_ENV"
      - name: Select candidate Compose contract
        shell: bash
        run: |
          if [[ -f deploy/docker-compose.build.yml ]]; then
            echo "COMPOSE_FILE=deploy/docker-compose.yml:deploy/docker-compose.build.yml" >> "$GITHUB_ENV"
            echo "EXPLICIT_RELEASE_JOBS=true" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_FILE=deploy/docker-compose.yml" >> "$GITHUB_ENV"
            echo "EXPLICIT_RELEASE_JOBS=false" >> "$GITHUB_ENV"
          fi
      - name: Validate Compose configuration
        run: docker compose --env-file .env.production config
      - name: Build production images
        shell: bash
        run: |
          if [[ "$EXPLICIT_RELEASE_JOBS" == "true" ]]; then
            docker compose --env-file .env.production build api web
          else
            docker compose --env-file .env.production build
          fi
      - name: Start production-like stack
        shell: bash
        run: |
          if [[ "$EXPLICIT_RELEASE_JOBS" == "true" ]]; then
            docker compose --env-file .env.production up -d --wait --wait-timeout 120 postgres redis
            docker compose --env-file .env.production run --rm --no-deps migration
            docker compose --env-file .env.production run --rm --no-deps bootstrap
            docker compose --env-file .env.production up -d --no-deps api web
          else
            docker compose --env-file .env.production up -d
          fi
      - name: Run health and frontend smoke checks
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/health/ | python3 -c "import json, sys; assert json.load(sys.stdin).get('status') == 'ok'"; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --env-file .env.production ps
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error -H 'Host: ci.example.test' http://127.0.0.1:8088/ | grep -q '<div id="root">'
          docker compose --env-file .env.production ps
      - name: Complete and lock the real first-run setup API
        shell: bash
        run: |
          set -euo pipefail
          ANIMEMO_CI_SETUP_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export ANIMEMO_CI_SETUP_PASSWORD
          sudo cat "$RELEASE_GATE_DATA_ROOT/private/setup-code" |
            python3 scripts/ci_first_run.py \
              --confirm-isolated \
              --code-stdin \
              --base-url http://127.0.0.1:8088 \
              --host ci.example.test \
              --username ci-bootstrap-admin \
              --email ci-bootstrap-admin@example.test \
              --password-env ANIMEMO_CI_SETUP_PASSWORD
      - name: Verify fresh D1A routes, pull-only capability, and empty sync state
        run: >-
          docker compose --env-file .env.production exec -T api
          python manage.py shell -c
          "from django.db import connection; from django.urls import resolve, reverse;
          from journal.external_accounts.providers.bangumi import BangumiAccountProvider;
          from journal.models import ExternalCollectionSyncState;
          assert ExternalCollectionSyncState._meta.db_table in connection.introspection.table_names();
          assert not ExternalCollectionSyncState.objects.exists();
          preview = reverse('external-collection-sync-preview', kwargs={'provider': 'bangumi', 'entry_id': 1});
          apply = reverse('external-collection-sync-apply', kwargs={'provider': 'bangumi', 'entry_id': 1});
          assert resolve(preview).view_name == 'external-collection-sync-preview';
          assert resolve(apply).view_name == 'external-collection-sync-apply';
          capabilities = BangumiAccountProvider().capabilities();
          assert capabilities['collection_sync_preview_available'];
          assert capabilities['collection_sync_pull_available'];
          assert capabilities['collection_sync_apply_available'];
          assert not capabilities['collection_sync_push_available'];
          assert not capabilities['collection_write_implemented'];
          print('Fresh D1A pull-only gate: PASS')"
      - name: Print logs on failure
        if: failure()
        run: docker compose --env-file .env.production logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.production down -v

  stateful-upgrade:
    name: stateful-upgrade
    needs: classify
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_release_stateful == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: animemo-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare scoped upgrade temp root
        shell: bash
        run: echo "STATEFUL_UPGRADE_TEMP_ROOT=$RUNNER_TEMP/animemo-upgrade-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Resolve audited upgrade refs
        id: refs
        run: >-
          python scripts/ci_refs.py
          --base "${{ inputs.upgrade_base_sha || '' }}"
          --head "${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Run BASE to CURRENT stateful production upgrade gate
        shell: bash
        run: >-
          bash scripts/stateful-upgrade-gate.sh
          --base "${{ steps.refs.outputs.base }}"
          --head "${{ steps.refs.outputs.head }}"
          --current-root "$GITHUB_WORKSPACE"
      - name: Print scoped upgrade logs on failure
        if: failure()
        shell: bash
        run: |
          docker ps -a --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          for container in $(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            docker logs "$container" || true
          done
      - name: Scoped fallback cleanup
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker rm -f
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker network rm
          if [[ -d "$STATEFUL_UPGRADE_TEMP_ROOT/base" ]]; then
            git worktree remove --force "$STATEFUL_UPGRADE_TEMP_ROOT/base" || true
          fi
          git worktree prune
          if ! rm -rf -- "$STATEFUL_UPGRADE_TEMP_ROOT" 2>/dev/null; then
            sudo -n rm -rf -- "$STATEFUL_UPGRADE_TEMP_ROOT"
          fi

  dr-rehearsal:
    name: dr-rehearsal
    needs: classify
    if: github.event_name != 'push' && (inputs.force_full || needs.classify.outputs.run_release_stateful == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      COMPOSE_HTTP_TIMEOUT: "120"
      COMPOSE_PROJECT_NAME: animemo-dr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate portable DR backup contract
        run: python -m unittest scripts.tests.test_dr_backup scripts.tests.test_dr_recovery_paths scripts.tests.test_dr_rehearsal_contract -v
      - name: Run isolated A-to-B DR rehearsal
        env:
          DR_REHEARSAL_TEMP_ROOT: ${{ runner.temp }}/animemo-dr-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: bash scripts/dr-rehearsal.sh --candidate-sha "$CANDIDATE_SHA" --current-root "$GITHUB_WORKSPACE"

  selection-authority:
    name: release-gate-authority
    if: ${{ always() }}
    needs: [classify, post-merge-sanity, updater-isolated, docker, stateful-upgrade, dr-rehearsal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      - name: Require selected jobs to succeed and unselected jobs to skip
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python scripts/ci_gate_authority.py
          --workflow release
          --event-name "${{ github.event_name }}"
