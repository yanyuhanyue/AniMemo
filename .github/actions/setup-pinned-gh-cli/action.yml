name: Setup pinned GitHub CLI
description: Install and verify the exact GitHub CLI used by release authority jobs

inputs:
  version:
    description: Exact GitHub CLI semantic version
    required: true
  linux-amd64-sha256:
    description: SHA-256 of the official linux-amd64 archive
    required: true

runs:
  using: composite
  steps:
    - name: Install and verify pinned GitHub CLI
      shell: bash
      env:
        GH_CLI_VERSION: ${{ inputs.version }}
        GH_CLI_LINUX_AMD64_SHA256: ${{ inputs.linux-amd64-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
