name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: "\\<*_&"
no-changes-template: "- 本周期没有可列入变更日志的合并请求。"

categories:
  - type: pre-exclude
    when:
      label: skip-changelog

  - type: pre-exclude
    when:
      label: release/internal

  - title: "⚠️ Breaking Changes"
    exclusive: true
    semver-increment: major
    when:
      label: release/breaking

  - title: "🔒 安全与稳定性"
    exclusive: true
    when:
      label: release/security

  - title: "✨ 新增功能"
    exclusive: true
    semver-increment: minor
    when:
      label: release/feature

  - title: "🐛 Bug 修复"
    exclusive: true
    when:
      label: release/fix

  - title: "🎨 界面与交互"
    exclusive: true
    when:
      label: release/ui

  - title: "💡 功能与体验优化"
    exclusive: true
    when:
      label: release/improvement

  - title: "🚀 性能与代码改进"
    exclusive: true
    when:
      labels:
        - release/performance
        - release/refactor

  - title: "🧱 部署与运维"
    exclusive: true
    when:
      label: release/deployment

  - title: "🧰 CI / 工程化"
    exclusive: true
    when:
      label: release/ci

  - title: "⬆️ 依赖更新"
    exclusive: true
    when:
      label: release/dependencies

  - title: "📝 文档"
    exclusive: true
    when:
      label: release/docs

  - title: "📦 其他变更"

template: |
  本草稿由已合并的 Pull Request 自动汇总；发布前仍须通过 AniMemo 的 Release Gate。

  $CHANGES

  > 此页面是变更草稿，不代表 RC、Stable、部署或发布授权。
